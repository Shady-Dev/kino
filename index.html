  function netErrorHtml(e){
    return `<div class="status">${L[state.lang].loadFail}<br><small>${esc(e.message||e)}</small></div>`;
  }
  // Every provider string crosses an innerHTML boundary somewhere, and every adapter
  // strips tags *then* unescapes, so a source page's entities arrive here as live HTML
  // metacharacters — a stored-XSS surface fed by nine third-party sites, and a rendering
  // bug on harmless titles ("Movie &lt;3"). Escape at the sink, never in the adapters:
  // the verbatim title is the key for normTitle(), films-extra.json and tmdb-aliases.
  const esc = v => String(v ?? '').replace(/[&<>"']/g,
    ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  // href/src values also come from provider JSON. esc() stops attribute breakout; this
  // additionally rejects any scheme that is not http(s), so a hostile booking URL cannot
  // be javascript: or data:. Scheme-less (repo-relative poster paths) stays allowed.
  // Two different questions, and one answer was being used for both. A ticket or
  // trailer URL is *meant* to leave this origin, so http(s) and relative are all fine.
  // A poster is not: an <img> is a request the browser makes on its own, and the
  // README's claim that a page load makes no third-party requests rests on every
  // poster being local. safeUrl said yes to `https://third-party/x.jpg` in both roles.
  const safeUrl = u => {
    u = String(u || '').trim();
    if(!u) return '';
    const m = u.match(/^([a-z][a-z0-9+.\-]*):/i);
    return (!m || /^https?$/i.test(m[1])) ? esc(u) : '';
  };
  // Same-origin, and inside the mirror directory. Deliberately a path allowlist rather
  // than an origin check: `mirror_posters.py` leaves a hot-linked URL in the data when a
  // download fails, on purpose, so that a third party's uptime cannot stop the pipeline
  // publishing showtimes. That makes the privacy invariant something the client has to
  // hold on its own rather than something it inherits from the pipeline behaving. Every
  // poster reference in the committed data is `data/posters/` today (3157 of them,
  // counted 2026-08-30), so the rule costs nothing and catches the day one is not.
  const ASSET_DIR = 'data/posters/';
  const safeAssetUrl = u => {
    u = String(u || '').trim();
    if(!u) return '';
    if(/^[a-z][a-z0-9+.\-]*:/i.test(u) || u.startsWith('//')) return '';
    return u.replace(/^\.?\//, '').startsWith(ASSET_DIR) ? esc(u) : '';
  };
  const jsonCache = {};
  let lastLoad = 0;      // when the schedule last came off the network; see refreshAll
  const FETCH_MS = 8000;
  // Boot-time speculation: every URL the boot will need is derivable before any
  // response arrives, so those requests can start in parallel instead of in three
  // serial waves (providers -> venue lists -> schedule). A prefetched promise is
  // consumed once by the fetchJSON call that would have made the same request; a
  // wrong guess (venue changed on another device, stale city ids) is one wasted
  // request and the normal path fetches as before.
  const prefetched = new Map();
  function prefetch(path){
    if(prefetched.has(path)) return;
    const p = fetchJSON(path);
    p.catch(() => {});            // not consumed is not an error
    prefetched.set(path, p);
  }

  async function fetchJSON(path){
    if(prefetched.has(path)){
      const p = prefetched.get(path);
      prefetched.delete(path);
      return p;
    }
    // No cache-buster: GitHub Pages serves max-age=600 and data updates 4x/day, so a
    // schedule up to 10 min stale is immaterial and the stale banner covers the
    // pathological case. The buster made every fetch a unique URL, so the SW cached a
    // fresh copy of every file per app open (tens of MB on a phone, evicted only on a
    // CACHE bump) and the HTTP cache never served anything.
    //
    // fetch() has no timeout of its own, so a connection that opens and then stalls --
    // the normal shape of a phone leaving coverage -- never settles and never rejects:
    // the spinner spins until the app is closed, with no error and nothing to retry.
    // Abort at FETCH_MS so the catch in the caller can draw netErrorHtml instead.
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), FETCH_MS);
    try {
      const r = await fetch(path, { signal: ac.signal });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally {
      clearTimeout(t);
    }
  }

  const LANGS = ['fi','sv','en'];
  // Swedish names for the cities we cover. Display only: cityGroups is keyed by the
  // Finnish name and so is the `city:` value in prefs and in the ?area= links the
  // generated pages carry, so translating the key would break every deep link. Cities
  // with no established Swedish name keep the Finnish one, which is also what
  // Finland-Swedish usage does for monolingual municipalities.
  const CITY_SV = {
    Espoo:'Esbo', Helsinki:'Helsingfors', Hyvinkää:'Hyvinge', Hämeenlinna:'Tavastehus',
    Iisalmi:'Idensalmi', Kajaani:'Kajana', Kokkola:'Karleby', Lahti:'Lahtis',
    Lappeenranta:'Villmanstrand', Oulu:'Uleåborg', Pietarsaari:'Jakobstad',
    Pori:'Björneborg', Porvoo:'Borgå', Raisio:'Reso', Savonlinna:'Nyslott',
    Tampere:'Tammerfors', Tornio:'Torneå', Turku:'Åbo', Vaasa:'Vasa', Vantaa:'Vanda'
  };
  const cityLabel = c => (state.lang === 'sv' && CITY_SV[c]) || c;

  // Sorting followed Finnish collation in every language, which was a recorded gap for
  // English and would have been a worse one for Swedish. One collator per language,
  // rebuilt on switch. Measured as free: Intl.Collator and localeCompare cost the same
  // on a 45-title sort, V8 caches it either way.
  const COLLATE = { fi:'fi', sv:'sv-FI', en:'en' };
  let coll = new Intl.Collator(COLLATE.fi);

  // Finnkino names carry the city as the last word ("Plevna Tampere"); BioRex ships city
  // explicitly. Group by city, since people pick a place before they pick a chain.
  function cityOf(a){
    if(a.city) return a.city;
    const w = (a.name || '').trim().split(/\s+/);
    return w.length > 1 ? w[w.length-1] : (a.name || '');
  }
  // "Itis Helsinki" never says Finnkino, so prefix the chain and drop the city — the
  // optgroup label already carries the city. BioRex names are already chain-prefixed.
  // Every provider-specific string and colour comes from data/providers.json, which
  // the pipeline generates from scripts/providers/registry.py. Adding a provider is a
  // registry entry plus an adapter: no edit in this file. The fallback keeps the app
  // usable when that file is missing (first deploy, or an old service worker).
  const PROV_FALLBACK = [
    { id:'finnkino',     label:'Finnkino',      host:'finnkino.fi',       accent:'#E4551F', book:'buy' },
    { id:'biorex',       label:'BioRex',        host:'biorex.fi',         accent:'#1273D4', book:'buy' },
    { id:'kinoset',      label:'Kinoset',       host:'kinoset.fi',        accent:'#0E9B63', book:'reserve' },
    { id:'kotkanleffat', label:'Kotkan Leffat', host:'kotkanleffat.fi',   accent:'#C42749', book:'buy' },
    { id:'riviera',      label:'Riviera',       host:'rivieracinemas.fi', accent:'#0C6464', book:'buy' },
    { id:'gilda',        label:'Gilda',         host:'gilda.fi',          accent:'#D62D8F', book:'buy' },
    { id:'savonkinot',   label:'Savon Kinot',   host:'savonkinot.fi',     accent:'#0C8FA8', book:'buy' },
    { id:'orion',        label:'Cinema Orion',  host:'cinemaorion.fi',    accent:'#4E7A16', book:'buy' },
    { id:'engel',        label:'Kino Engel',    host:'kinoengel.fi',      accent:'#B47ACC', book:'buy' },
    { id:'biorexkokkola',label:'Bio Rex Kokkola',host:'biorex.org',       accent:'#006655', book:'buy' },
    { id:'kinoakseli',   label:'Kino Akseli',   host:'kinoakseli.fi',     accent:'#B8801A', book:'door' }
  ];
  let PROVIDERS = [];
  const CHAIN = {}, SOURCE = {}, BOOK = {};
  function applyProviders(list){
    PROVIDERS = (Array.isArray(list) && list.length) ? list : PROV_FALLBACK;
    for(const o of [CHAIN, SOURCE, BOOK]) for(const k of Object.keys(o)) delete o[k];
    for(const p of PROVIDERS){
      if(!p || !p.id) continue;
      CHAIN[p.id] = p.label || p.id;
      SOURCE[p.id] = [p.label || p.id, p.host || ''];
      BOOK[p.id] = p.book || 'buy';
    }
    let el = document.getElementById('chainpal');
    if(!el){ el = document.createElement('style'); el.id = 'chainpal'; document.head.appendChild(el); }
    el.textContent = PROVIDERS.filter(p => p && p.id && p.accent)
      .map(p => `.chain-${p.id}{--chain:${p.accent}}`).join('');
  }
  applyProviders(null);
  async function loadProviders(){
    try { applyProviders((await fetchJSON('data/providers.json')).providers); }
    catch(_){ applyProviders(null); }   // fallback already applied; stay quiet
  }
  function shortOf(a){
    if(a.short) return a.short;
    const city = cityOf(a);
    const n = (a.name || '').trim();
    return n.endsWith(' ' + city) ? n.slice(0, -(city.length + 1)).trim() : n;
  }
  function labelOf(a){
    const chain = CHAIN[a.provider] || '';
    const short = shortOf(a);
    return (chain && !short.startsWith(chain)) ? `${chain} ${short}` : short;
  }
  // Split out of fillAreaSelect: the language toggle has to relabel the picker
  // ("Kaikki Helsinki" / "All in Helsinki") without resetting the selected venue.
  function buildAreaOptions(){
    const areas = allVenues;
    const byCity = new Map();
    for(const a of areas){
      const c = cityOf(a);
      if(!byCity.has(c)) byCity.set(c, []);
      byCity.get(c).push(a);
    }
    const cities = [...byCity.keys()].sort((x,y)=>coll.compare(cityLabel(x), cityLabel(y)));
    cityGroups = {};
    for(const c of cities) cityGroups[c] = byCity.get(c).map(a => a.id);
    const opt = a => `<option value="${esc(a.id)}">${esc(labelOf(a))}</option>`;
    // Cities with more than one screen get a combined entry at the top of their group.
    areaSel.innerHTML = cities.map(c => {
      const vs = byCity.get(c).sort((x,y)=>coll.compare(labelOf(x), labelOf(y)));
      const all = vs.length > 1
        ? `<option value="city:${esc(c)}">${L[state.lang].allIn} ${esc(cityLabel(c))} (${vs.length})</option>`
        : '';
      return `<optgroup label="${esc(cityLabel(c))}">${all}${vs.map(opt).join('')}</optgroup>`;
    }).join('');
  }
  function fillAreaSelect(areas){
    allVenues = areas.slice();
    venueIndex = {};
    for(const a of areas) venueIndex[a.id] = Object.assign({}, a, { short: shortOf(a), label: labelOf(a) });
    buildAreaOptions();
    // A starred venue opens every time; otherwise fall back to the last one browsed.
    const pr = prefs.get();
    const known = id => !!id && (areas.some(a => a.id === id) ||
      (id.startsWith('city:') && (cityGroups[id.slice(5)] || []).length > 1));
    // ?area= beats both. The pre-rendered pages under /teatteri/ and /kaupunki/ link here,
    // and without this a reader arriving from a search for one cinema landed on whatever
    // they browsed last and had to find it again in a 46-entry picker. Validated against
    // the venue list like any stored value, so a stale or hand-edited link falls through
    // to the normal restore rather than showing an empty view.
    let deep = '';
    try {
      deep = new URLSearchParams(location.search).get('area') || '';
    } catch(_){ deep = ''; }
    if(known(deep)){
      state.area = deep;
      prefs.set({ area: deep });   // stick, so the next visit opens here too
      // Drop the param once applied: leaving it in place would override the picker on
      // every reload, which is wrong for an app people keep open.
      try {
        const u = new URL(location.href);
        u.searchParams.delete('area');
        history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch(_){}
    } else {
      state.area = known(pr.fav) ? pr.fav : (known(pr.area) ? pr.area : areas[0].id);
    }
    areaSel.value = state.area;
    syncFav();
  }

  // Fetch the venue lists and rebuild providerMeta. Split out of loadAreas so a resume can
  // refresh the ages without going near fillAreaSelect, which re-runs the prefs-based
  // venue restore and would bounce the reader off the venue they were looking at.
  async function fetchVenueLists(areasPromise){
    const data = await (areasPromise || fetchJSON('data/areas.json'));
    const areas = (data.areas || []).filter(a => a.id && a.id !== '1029')
      .map(a => ({ ...a, provider:'finnkino' }));
    // Seeded from the expected provider list *before* any venue file is fetched, so a
    // provider whose file never arrives stays on screen as unavailable instead of
    // vanishing. It used to be built only from what loaded, which meant a chain that was
    // completely down was indistinguishable from a chain that does not exist -- the one
    // state the health line most needs to show, and the only one it could not.
    providerMeta = {};
    for(const pr of PROVIDERS) if(pr && pr.id) providerMeta[pr.id] = { venues: 0, gone: true };
    providerMeta.finnkino = { generated: data.generated, oldest: data.generated,
                              stale: 0, venues: areas.length };
    if(!areas.length) throw new Error('Theatre list came back empty');
    // Extra providers, each optional: a missing or broken file must not take the app down.
    // Fetched in parallel — awaiting eight files one at a time was most of the startup
    // waterfall on mobile. Promise.all keeps array order, so the picker order is stable.
    const extra = [];
    // Finnkino is skipped: it is the areas.json above, in the legacy numeric shape.
    const provIds = PROVIDERS.map(p => p.id).filter(id => id !== 'finnkino');
    const provFiles = await Promise.all(provIds.map(
      prov => fetchJSON(`data/venues-${prov}.json`).catch(() => null)));
    provIds.forEach((prov, i) => {
      const j = provFiles[i];
      if(!j) return;
      const vs = (j.venues || []).filter(v => v.id && v.name);
      for(const v of vs) extra.push({ ...v, provider: prov });
      // `oldest` is the weakest venue's timestamp; `generated` only says when the
      // pipeline wrote this file, which is always now. Reading `generated` was how a
      // chain with one week-old cinema reported itself as current. Falls back to
      // `generated` so a file written before the field existed still renders.
      if(vs.length) providerMeta[prov] = {
        generated: j.generated, oldest: j.oldest || j.generated,
        status: j.status || '',
        stale: Array.isArray(j.stale) ? j.stale.length : 0,
        unverified: Array.isArray(j.unverified) ? j.unverified.length : 0,
        venues: vs.length };
    });
    state.generated = data.generated;
    return areas.concat(extra);
  }

  async function loadAreas(areasPromise){
    // No fallback path: if same-origin areas.json fails, the site itself is broken or
    // the visitor is offline on first visit, and the boot's catch says so. The old
    // XML/CORS-proxy chain could not have helped in either case — see IDEAS.
    const all = await fetchVenueLists(areasPromise);
    fillAreaSelect(all);
    renderHealth();
    areaSel.addEventListener('change', () => {
      state.area = areaSel.value; prefs.set({area: state.area});
      state.chains = null;
      syncFav(); loadSchedule();
    });
  }

  /* ---------- schedule ---------- */
  const pad = n => String(n).padStart(2,'0');

  // Jump to a date and keep the chip row in sync, whether it is a chip or the picker.
  function selectDay(iso){
    state.dateStr = iso;
    state.revealed.clear();
    prefs.set({ day: iso });
    [...daysEl.children].forEach(c => c.classList.remove('active'));
    if(dayBtns[iso]){
      resetCalChip();
      dayBtns[iso].classList.add('active');
    } else if(calChip){
      calChip.innerHTML = `<small>${fiDay[dowOf(iso)]}</small><b>${dmOf(iso)}</b>`;
      calChip.classList.add('active');
    }
    return loadSchedule();
  }

  // Combined city view: fetch each venue in the city and fold them into one payload.
  // eventId is rewritten to the merge key so grouping, the sheet and the URL hash all
  // keep working unchanged.
  async function loadCity(city){
    const ids = cityGroups[city] || [];
    // Remembered so the next boot can prefetch these files before the venue lists
    // arrive; validated against the live cityGroups then, like any stored value.
    prefs.set({ cityIds: Object.assign({}, prefs.get().cityIds, { [city]: ids }) });
    const parts = await Promise.all(ids.map(async id => {
      try { return await fetchJSON(`data/area-${id}.json`); }
      catch(_) { return null; }
    }));
    const shows = [], dates = new Set();
    // The expected ids stay the source of truth. A venue whose file fails was skipped
    // silently, so a city could render a confident, complete-looking programme that was
    // missing a whole cinema -- and the one place that would have shown it, the health
    // line, is per provider, not per venue. Named here so the view can say so.
    const missing = [];
    let generated = '', oldest = '';
    parts.forEach((p, i) => {
      if(!p){
        const mv = venueIndex[ids[i]] || {};
        missing.push(mv.short || mv.name || ids[i]);
        return;
      }
      const v = venueIndex[ids[i]] || {};
      // `generated` is the oldest of the parts so the stale banner reflects the weakest
      // link. Carry the provider it came from too: the banner used to look the name up
      // from venueIndex[state.area], which has no entry for a `city:` key, so it fell
      // through to Finnkino and blamed the chain that refreshes most often.
      if(!generated || (p.generated && p.generated < generated)){
        generated = p.generated || '';
        oldest = v.provider || '';
      }
      (p.dates || []).forEach(d => dates.add(d));
      for(const s of (p.shows || [])){
        shows.push({ ...s, eventId: mergeKey(s.title), _eid: s.eventId,
                     venueShort: v.short || s.theatre, venueLabel: v.label || v.short || s.theatre,
                     provider: s.provider || v.provider });
      }
    });
    mergeIds(shows);
    const list = [...dates].sort();
    return { generated, oldest, dates: list, horizon: list[list.length-1] || '', shows,
             missing, expected: ids.length };
  }

  // Two signals say "same film" and neither is complete on its own, so treat both as
  // links rather than picking one. The title key merges chains that agree on the title;
  // the TMDB id merges chains that do not ("Mutiny" vs "Mutiny - Lavastettu
  // syylliseksi"). Choosing the id when present *unmerged* pairs that used to work:
  // "Maailman rikkain nainen" resolved an id at Gilda and none at Finnkino, so one row
  // was keyed by id and its twin by title. Union them and take the group root.
  function mergeIds(shows){
    const parent = new Map();
    const find = k => { while(parent.get(k) !== k) { parent.set(k, parent.get(parent.get(k))); k = parent.get(k); } return k; };
    const add = k => { if(!parent.has(k)) parent.set(k, k); return k; };
    const union = (a, b) => { a = find(add(a)); b = find(add(b)); if(a !== b) parent.set(b, a); };
    for(const s of shows){
      add(s.eventId);
      if(s.tmdbId) union(s.eventId, `tmdb:${s.tmdbId}`);
    }
    for(const s of shows) s.eventId = find(s.eventId);
  }

  async function loadSchedule(){
    main.innerHTML = `<div class="status"><div class="reel"></div>${L[state.lang].loadingSchedule}</div>`;
    try {
      if(!jsonCache[state.area]){
        jsonCache[state.area] = state.area.startsWith('city:')
          ? await loadCity(state.area.slice(5))
          : await fetchJSON(`data/area-${state.area}.json`);
        lastLoad = Date.now();   // only a real fetch counts; a cache hit proves nothing
      }
      const cache = jsonCache[state.area];
      if(cache.generated) state.generated = cache.generated;
      state.genProvider = cache.oldest || (venueIndex[state.area] || {}).provider || '';
      state.dates = Array.isArray(cache.dates) ? cache.dates : null;
      state.horizon = cache.horizon || '';
      state.missing = Array.isArray(cache.missing) ? cache.missing : [];
      state.expected = cache.expected || 0;
      state.shows = cache.shows
        .map(s => ({ ...s, start: new Date(s.start) }))
        .filter(s => fiDate(s.start) === state.dateStr);
      // Late evening with nothing left today: move to the next day that has shows.
      if(!state.advanced && state.dateStr === fiToday() && !state.shows.length){
        const next = (state.dates || []).find(x => x > state.dateStr);
        if(next){
          state.advanced = true;
          selectDay(next);
          return;
        }
      }
      render();
      renderHealth();
      renderStatus();
      // The example is drawn from the shows now on screen, so it is refreshed with them
      // rather than only at startup or on a language switch.
      if(searchEl && !searchEl.value) searchEl.placeholder = searchHint();
    } catch(e){
      main.innerHTML = netErrorHtml(e);
    }
  }

  // Stale banner and footer credit. Pulled out of loadSchedule so applyLang can
  // redraw them: they carry translated strings and used to stay stale until reload.
  function renderStatus(){
    // Painted before the `generated` guard below: a city where every part failed has no
    // timestamp at all, and that is precisely the case that must not render as an
    // ordinary empty day.
    const partEl = document.querySelector('#partial');
    if(partEl){
      const n = (state.missing || []).length;
      if(n){
        const T = L[state.lang];
        partEl.textContent = T.partialCity
          .replace('{n}', (state.expected || n) - n).replace('{m}', state.expected || n)
          + ' ' + T.partialMissing.replace('{names}', state.missing.join(', '));
        partEl.style.display = 'block';
      } else {
        partEl.style.display = 'none';
      }
    }
    const staleEl = document.querySelector('#stale');
    if(!staleEl || !state.generated) return;
    const ageH = (Date.now() - new Date(state.generated).getTime()) / 36e5;
    if(ageH > STALE_H){
      // Name the provider: every source runs on its own schedule. In a combined city
      // view that is whichever part loadCity found oldest, not the venue key.
      const prov = state.genProvider || (venueIndex[state.area] || {}).provider;
      const nm = (SOURCE[prov] || SOURCE.finnkino)[0];
      staleEl.textContent = `\u26a0 ${nm}: ${L[state.lang].staleOne} `
        + `(${Math.round(ageH)} ${L[state.lang].hours})`;
      staleEl.style.display = 'block';
    } else {
      staleEl.style.display = 'none';
    }
    const t = new Date(state.generated);
    const combined = state.area.startsWith('city:');
    const v = venueIndex[state.area] || {};
    const [src, host] = combined
      ? [L[state.lang].manySources, '']
      : (SOURCE[v.provider] || SOURCE.finnkino);
    const stamp = t.toLocaleString('fi-FI',
      {day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
    // book mode per provider: door = sold at the door, reserve = free seat
    // reservation rather than payment. From the registry, not from an id test.
    const bk = BOOK[v.provider] || 'buy';
    const T = L[state.lang];
    const act = (combined ? T.actCombined
      : bk === 'door' ? T.actDoor
      : bk === 'reserve' ? T.actReserve
      : bk === 'list' ? T.actList
      : T.actBuy).replace('{host}', host);
    // `footer` now wraps three lines, so this writes to the credit line rather than
    // replacing the whole block. Host dropped from the label: `act` already ends in it
    // for every book mode that names one, and printing "Finnkino ... finnkino.fi" twice
    // was half of what made this line long.
    const creditEl = document.querySelector('#credit');
    if(creditEl) creditEl.textContent = `${T.dataLabel}: ${src} · ${T.updated} ${stamp} · ${act}`;
  }

  // Separate from the footer because renderStatus() returns early until schedule data
  // has loaded, and the one line a cinema comes here for must not depend on that. The
  // Finnish version is also in the static markup, the way the footer's is, so a broken
  // script still leaves the address on the page. Both strings are ours, not a
  // provider's, so there is nothing to escape.
  // Accessible names were a mix of hard-coded English ("Choose theatre") and hard-coded
  // Finnish ("Sulje"), so a screen reader heard two languages at once and neither
  // followed the toggle. Everything the toggle can reach has to be redrawn by
  // applyLang(), and an aria-label is no different from a visible one.
  function applyAriaLabels(){
    const T = L[state.lang];
    const set = (sel, txt) => { const el = document.querySelector(sel);
                                if(el) el.setAttribute('aria-label', txt); };
    set('#themeToggle', T.aTheme);
    set('#areaSelect', T.aVenue);
    set('#search', T.aSearch);
    set('#days', T.aDays);
    set('#viewSeg', T.aView);
    set('#langSeg', T.aLang);
    const themeBtn = document.querySelector('#themeToggle');
    if(themeBtn) themeBtn.title = T.aTheme;
  }

  function renderContact(){
    document.querySelector('#contact').innerHTML =
      `${L[state.lang].contact} · <a href="mailto:${CONTACT}">${CONTACT}</a>`;
    const src = document.querySelector('#source');
    if(src) src.innerHTML = `${L[state.lang].source}: `
      + `<a href="${SOURCE_URL}" rel="noopener">${SOURCE_URL.replace('https://', '')}</a>`
      + ` · ${LICENCE}`;
  }

  /* ---------- render ---------- */
  // What the search box matches: the title, the original title, and the genres — in
  // *both* languages, so "comedy" finds a film the Finnish UI labels Komedia and vice
  // versa. Genre ids are checked through the same id -> name maps the card renders from,
  // with the provider's own genre string as the fallback for films TMDB never matched.
  // Punctuation and spacing are not part of what anyone means by a title: nobody types
  // "Spider-Man" with the hyphen in the right place, and "spiderman", "spider man" and
  // "spider-man" are one search. Diacritics fold too, so "katyrit" finds "Kätyrit".
  // Everything non-alphanumeric is removed from both sides rather than replaced with a
  // space, so the query need not guess the separator either.
  // The example in the placeholder is the film with the most showtimes on screen — a
  // decent "what is big right now" signal that costs nothing and never goes stale, unlike
  // a hardcoded title. Shortened at a colon so "Spider-Man: Brand New Day" becomes
  // "Spider-Man", which is what someone would actually type.
  function popularTitle(){
    const count = new Map();
    for(const s of state.shows){
      if(!s.title) continue;
      count.set(s.title, (count.get(s.title) || 0) + 1);
    }
    let best = '', n = 1;
    for(const [t, c] of count) if(c > n) { best = t; n = c; }
    const short = best.split(/\s*[:–]\s*/)[0].trim();
    return short.length >= 3 ? short : '';
  }
  function searchHint(){
    const ex = popularTitle();
    return ex ? `${L[state.lang].searchEg} ${ex} ${L[state.lang].searchOr}` : L[state.lang].filter;
  }

  const searchKey = x => (x || '').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '');

  // Chips cost permanent horizontal space, so only the two or three biggest intents get
  // one. Everything else belongs here, where it costs nothing: `method` carries the
  // format and event vocabulary every provider publishes -- IMAX, LUXE, iSense, Prime,
  // Plus, Senioribio, Perheleffa, Espoo Ciné, Kuvaileva tekstitys -- and the two rating
  // fields make age limits findable. Kuvaileva tekstitys is the case that settles the
  // argument: 10 showtimes, so it can never justify a chip, and the people who need it
  // had no way to find it at all. `rating` and `age` go in as written ("K-18"); the
  // collapsed form searchKey builds means "k18" and "k-18" both match.
  function haystack(s){
    if(s._hay) return s._hay;
    const parts = [s.title || '', s.original || '', s.genres || '',
                   s.method || '', s.rating || '', s.age || ''];
    const ids = Array.isArray(s.gids) ? s.gids : [];
    if(ids.length && genreNames){
      for(const lang of ['fi', 'en']){
        const map = genreNames[lang];
        if(map) for(const id of ids) if(map[id]) parts.push(map[id]);
      }
    }
    // Both forms: the spaced one so a two-word query still reads naturally, and the
    // collapsed one so punctuation and spacing stop mattering.
    return (s._hay = parts.join(' ').toLowerCase() + ' ' + parts.map(searchKey).join(' '));
  }

  function passFilters(s){
    const q = state.filter.trim().toLowerCase();
    if(q && !haystack(s).includes(q) && !haystack(s).includes(searchKey(q))) return false;
    if(state.fLang && !/FI(?:-[A-Z]{2})?-A/.test(s.lang || '')) return false;
    // `Anniskelu` in `method` covers two different things, because fetch_data maps both
    // of Finnkino's attributes onto that one word: `annisk_k18` is an anniskelunäytös
    // (drinks, 18+, sets `age`), plain `anniskelu` is an anniskelualuesali, a room that
    // is permanently licensed. Finnkino states the rest of the rule outright and IDEAS
    // records it: in those rooms **alcohol is not served at S/7 family films**. So a
    // children's film in a licensed room carries the tag and is not a bar screening --
    // 18 showtimes across 6 films. Excluding them is reading the documented rule, not
    // inferring one. The direction matters too: promising a bar that will not be there
    // is the same class of error as the BioRex K-18 inference that told people a
    // screening was closed when it was not.
    if(state.fAnnis){
      if(!/anniskelu/i.test(s.method || '')) return false;
      if(s.age !== 'K-18' && (s.rating === 'S' || s.rating === 'K-7')) return false;
    }
    // Rating first, so the filter can never admit a restricted film — the cinema
    // enforces the age limit at the door and this is only a browse aid. Genre ids then
    // remove the merely-unrestricted: documentaries and dramas. Whitelisting Animation
    // and Family alone was tried and rejected — TMDB tags Marsupilami as Adventure,
    // Comedy, so a K-7 family comedy would have vanished from the filter. A film with no
    // ids stays on rating alone.
    if(state.fKids){
      if(!(s.rating === 'S' || s.rating === 'K-7')) return false;
      // The *screening's* own limit outranks the film's rating: an S-rated film in an
      // Annisk_K18 screening is one minors cannot attend, and the gate above only reads
      // the film. Five showtimes are in that state today and all five happen to be
      // caught by the genre rule below, so nothing leaks right now -- by luck, not by
      // this rule. The comment above promises errors land on "boring for a child" and
      // never on "unsuitable"; without this line that promise is not kept.
      if(s.age && s.age !== 'S' && s.age !== 'K-7') return false;
      const g = Array.isArray(s.gids) ? s.gids : [];
      if(g.length && !g.includes(16) && !g.includes(10751)
         && (g.includes(99) || g.includes(18))) return false;
    }
    if(state.chains && s.provider && !state.chains.has(s.provider)) return false;
    return true;
  }

  function renderTimes(){
    const now = new Date();
    const rows = state.shows.filter(passFilters).sort((a,b) => a.start - b.start);
    const timesLegend = labelVenues(state.shows) ? chainLegend(state.shows, 'top') : '';
    if(!rows.length){ main.innerHTML = timesLegend + `<div class="status">${emptyMsg()}${nextDayLink()}</div>`; return; }
    // The film cards label the venue and tint by chain in a combined view; this list
    // never did, so "Sali 14" named a room in one of five cinemas, with no colour and no
    // cinema, under a legend it had no connection to. The stub is a fixed 158 px ticket
    // and its label column is ~75 px, so "Kinopalatsi · Sali 14" would truncate to
    // "Kinopalat…" and lose both halves. The venue goes on the meta line instead, which
    // has the full row width, and the stub carries the chain tint.
    const multi = labelVenues(state.shows);
    const tinted = multi;
    main.innerHTML = rows.map(s => {
      const past = s.start < now;
      const t = fiTime(s.start);
      const cls = past ? ' past' : (s.soldOut ? ' sold' : '');
      const where = venueName(s);
      const tint = tinted && s.provider ? ` chain-${esc(s.provider)}` : '';
      const venue = multi && where ? `<span class="theatre-tag">${esc(where)}</span>` : '';
      return `<div class="trow">
        <a class="stub${cls}${tint}" style="--notch:${past?52:56}px" href="${safeUrl(s.url)}" target="_blank" rel="noopener">
          <span class="time">${t}</span><span class="aud"><span class="loc">${esc(s.aud)}${s.soldOut && !past ? ' · ' + L[state.lang].soldout : ''}</span>${glyphRow((s.method||'').split(' · ').map(glyphOf).join('') + ageGlyph(s))}</span></a>
        <a class="tinfo" href="#m=${encodeURIComponent(s.eventId)}" data-id="${esc(s.eventId)}"><b>${esc(disp(s))}</b>
          <small>${[venue, esc(s.rating), s.len ? esc(s.len)+' '+L[state.lang].min : '', esc(s.method), esc(langTxt(s.lang))].filter(Boolean).join(' · ')}</small></a>
      </div>`;
    }).join('');
  }

  // Filters beat everything; past the published horizon is not the same as a quiet day.
  // "Tripla" does not tell you it is BioRex, so a combined list needs a chain key.
  // In the list the chain key doubles as a filter; in the sheet it stays a plain key.
  function chainLegend(shows, extraClass){
    const chains = [...new Set(shows.map(s => s.provider).filter(Boolean))].sort();
    if(chains.length < 2) return '';
    const interactive = (extraClass || '').includes('top');
    if(!interactive){
      return `<div class="legend ${extraClass || ''}">${chains
        .map(c => `<span class="lg chain-${esc(c)}">${esc((SOURCE[c] || [c])[0])}</span>`).join('')}</div>`;
    }
    // "Kaikki" only appears while something is filtered: an always-on reset that never
    // does anything is just noise in the row.
    const reset = state.chains
      ? `<button class="lg-btn lg-all" data-chain="*">${L[state.lang].allChains}</button>` : '';
    return `<div class="legend top" role="group" aria-label="${esc(L[state.lang].aChains)}">${chains
      .map(c => {
        const on = !state.chains || state.chains.has(c);
        return `<button class="lg-btn chain-${esc(c)}${on ? ' on' : ''}" data-chain="${esc(c)}"
                  aria-pressed="${on}">${esc((SOURCE[c] || [c])[0])}</button>`;
      }).join('') + reset}</div>`;
  }

  // Additive filter: from the default (no selection, everything shown) the first click
  // isolates that chain rather than hiding it, then each further click adds one. Clicking
  // the last remaining chain off, or selecting them all, means "no filter" again.
  function toggleChain(c, all){
    if(c === '*'){ state.chains = null; render(); return; }
    const set = state.chains ? new Set(state.chains) : new Set();
    set.has(c) ? set.delete(c) : set.add(c);
    state.chains = (set.size === 0 || set.size === all.length) ? null : set;
    render();
  }
  main.addEventListener('click', e => {
    const goto = e.target.closest('[data-goto]');
    if(goto){ selectDay(goto.dataset.goto); return; }
    const rev = e.target.closest('[data-reveal]');
    if(rev){
      const id = rev.dataset.reveal;
      state.revealed.has(id) ? state.revealed.delete(id) : state.revealed.add(id);
      render();
      return;
    }
    const b = e.target.closest('.lg-btn');
    if(!b) return;
    const all = [...new Set(state.shows.map(s => s.provider).filter(Boolean))].sort();
    toggleChain(b.dataset.chain, all);
  });

  function emptyMsg(){
    const t = L[state.lang];
    if(state.filter || state.fLang || state.fKids || state.fAnnis) return t.nomatch;
    if(state.horizon && state.dateStr > state.horizon) return t.notpublished;
    if(state.dateStr === fiToday()) return t.nomore;
    return t.noshows;
  }
  // Long horizons are sparse, so an empty day should point at the next real one instead
  // of leaving the visitor to hunt through the picker.
  function nextDayLink(){
    if(state.filter || state.fLang || state.fKids || state.fAnnis) return '';
    const today = fiToday();
    const next = (state.dates || []).find(d => d > state.dateStr && d >= today);
    if(!next) return '';
    return `<button class="nextday" data-goto="${next}">${L[state.lang].nextShows}`
      + ` &rarr; ${fiDay[dowOf(next)]} ${dmOf(next)}</button>`;
  }

  // Whether a showtime needs its venue spelled out. It must depend on the *view*, not on
  // how many venues happen to have shows on the day being looked at: a combined city view
  // showing a single 14:00 with no venue and a blank auditorium (single-screen houses
  // render one) tells the visitor nothing at all.
  // An age limit that belongs to the screening rather than the film: a licensed bar
  // auditorium is 18+ even when the film is K-12. It has to sit on the showtime, since
  // one film at one venue can have both kinds on the same day.
  const ageOf = s => (s.age && s.age !== s.rating) ? s.age : '';
  const ageChip = s => ageOf(s) ? `<span class="agelim">${esc(ageOf(s))}</span>` : '';
  // Glyphs for the two tags that repeat on every stub. Everything else stays a word:
  // LUXE, iSense and IMAX are brand names people already read, and an invented icon for
  // each would need its own legend entry to say less than the word does.
  const GLYPH = { anniskelu: ['A', 'Anniskelu'] };
  // A stub label was reading "Tennispalatsi · LUXE 8 · 2D · LUXE": the room name already
  // carries the format, and 2D is on nearly every screening, so it says nothing. Drop a
  // tag the auditorium name already contains, and drop 2D outright — the exceptions
  // (IMAX, 3D, iSense) are what a visitor is actually looking for.
  const stubTags = (tags, aud) => tags.filter(t =>
    t && !/^2d$/i.test(t) && !(aud || '').toLowerCase().includes(t.toLowerCase()));
  const glyphRow = html => html ? `<span class="glyphs">${html}</span>` : '';
  // Premiere date, from films.json (Finnkino only — nobody else publishes one, and a
  // guessed premiere is worse than none). Shown while it is still ahead, because that is
  // when it changes a decision: tickets go on sale days before a film opens, so a
  // bookable showtime can sit in front of an opening night. Once the film has opened the
  // badge is noise and disappears.
  const premiereOf = m => {
    const f = filmEntry(m);
    const rd = f && f.rd;
    if(!rd || rd < fiToday()) return '';
    const [y, mo, d] = rd.split('-');
    return `${+d}.${+mo}.`;
  };
  // Score as a ring: arc length for a glance, the number for the actual value, and the
  // vote count beside it because 7.1 from 41 votes and 7.1 from 15 000 are not the same
  // claim. `thin` dims a rating resting on a handful of votes rather than hiding it.
  const VOTE_SOLID = 25;
  const shortVotes = n => n >= 1000 ? `${(n / 1000).toFixed(n < 10000 ? 1 : 0)}k` : `${n}`;
  const scoreRing = m => {
    const v = m.tmdb;
    if(!v) return '';
    const n = m.votes || 0;
    const thin = n && n < VOTE_SOLID ? ' thin' : '';
    const lbl = n ? `${v} · ${n} ${L[state.lang].votes}` : `${v}`;
    return `<span class="ring${thin}" style="--v:${Math.round(v * 10)}" title="${esc(lbl)}"`
      + ` aria-label="${esc(lbl)}"><b>${esc(v)}</b></span>`
      + (n ? `<span class="votes">${esc(shortVotes(n))}</span>` : '');
  };

  const premiereChip = m => {
    const d = premiereOf(m);
    return d ? `<span class="fmt prem">${L[state.lang].premiere} ${d}</span>` : '';
  };
  const glyphOf = tag => {
    const g = GLYPH[(tag || '').toLowerCase()];
    return g ? `<span class="gl" title="${g[1]}" aria-label="${g[1]}">${g[0]}</span>` : '';
  };
  const ageGlyph = s => {
    const a = ageOf(s);
    if(!a) return '';
    const n = a.replace(/[^0-9]/g, '') || a;
    return `<span class="gl age" title="${esc(a)}" aria-label="${esc(a)}">${esc(n)}+</span>`;
  };
  // Only rendered when the day's shows actually carry these, so it never explains
  // something that is not on screen.
  function tagKey(shows){
    const hasA = shows.some(s => /anniskelu/i.test(s.method || ''));
    const hasAge = shows.some(s => ageOf(s));
    if(!hasA && !hasAge) return '';
    const bits = [];
    if(hasA) bits.push(`<span><span class="gl">A</span>${L[state.lang].keyAnniskelu}</span>`);
    if(hasAge) bits.push(`<span><span class="gl age">18+</span>${L[state.lang].keyAge}</span>`);
    return `<div class="tagkey">${bits.join('')}</div>`;
  }

  // The chain tint is on for every stub in a combined view, including a day served by a
  // single chain. It was briefly gated on two chains being present, because colour with
  // no legend explained nothing — but that was the wrong end of the problem: the stub
  // label was the thing failing to name the chain, and it now does. With the meaning
  // carried by words, colour is a scanning aid, and it only becomes one if it is always
  // there to be learned. The legend keeps its own rule and stays hidden below two chains,
  // where it would be a filter with nothing to filter.
  //
  // In a combined view a stub must name the *cinema*, not the district. "Punavuori",
  // "Kallio", "Tripla", "Redi" and "Kamppi" are all bare venue shorts, and on their own
  // they say nothing about which chain — Punavuori is a neighbourhood of Helsinki, not a
  // cinema. The chain colour used to fill that gap, which broke the app's own rule that
  // colour never carries meaning alone, and fell apart entirely on a day served by one
  // chain, where there is no legend and no tint. So the label carries the chain:
  // "Riviera Punavuori". labelOf() already omits the prefix when the short starts with
  // the chain name, so Finnkino venues do not become "Finnkino Finnkino Itis".
  const venueName = s => s.venueLabel || s.venueShort || (s.theatre || '').split(',')[0];

  const labelVenues = shows =>
    (state.area || '').startsWith('city:') || new Set(shows.map(s => s.theatre)).size > 1;

  function render(){
    if(state.view === 'times'){ renderTimes(); return; }
    const now = new Date();
    const byEvent = new Map();
    // Facts about the *film* are folded from every showtime it has, filtered or not, so
    // they do not move when a filter changes which chain's screenings survive. Chains
    // disagree: Finnkino calls "Laula minulle Arja" "Dokumentti, Kotimainen" and Gilda
    // calls it "Dokumentti", so with "Suom. puhe" on — which drops Finnkino's subtitled
    // screenings — the genres used to change under the visitor. `lang` is deliberately
    // NOT in this list: it belongs to the screening, and showing "tekstit suomi/ruotsi"
    // from a screening the filter just removed would be wrong.
    const FILM_FIELDS = ['tmdb','votes','tr','img','len','genres','rating','original','gids'];
    const filmFacts = new Map();
    for(const s of state.shows){
      let g = filmFacts.get(s.eventId);
      if(!g) filmFacts.set(s.eventId, g = {});
      for(const f of FILM_FIELDS){
        // Longest wins for genres: "first non-empty" made the richer of two disagreeing
        // strings a matter of which venue happened to load first.
        if(f === 'genres'){
          if((s[f] || '').trim().length > (g[f] || '').trim().length) g[f] = s[f];
        } else if(!g[f] && s[f]) g[f] = s[f];
      }
    }
    for(const s of state.shows){
      if(!passFilters(s)) continue;
      if(!byEvent.has(s.eventId)) byEvent.set(s.eventId, { ...s, times:[] });
      const m = byEvent.get(s.eventId);
      Object.assign(m, filmFacts.get(s.eventId) || {});
      // Per-screening, so still folded from what survived the filter.
      if(!m.lang && s.lang) m.lang = s.lang;
      m.times.push(s);
    }
    const movies = [...byEvent.values()].sort((a,b)=>coll.compare(a.title, b.title));

    if(!movies.length){
      main.innerHTML = `<div class="status">${emptyMsg()}${nextDayLink()}</div>`;
      return;
    }

    const multiTheatre = labelVenues(state.shows);
    const tintedList = multiTheatre;
    // Same title at two chains is one film: sort by the earliest showtime overall.
    if(multiTheatre) movies.forEach(m => m.times.sort((a,b)=>a.start-b.start));

    const listLegend = multiTheatre ? chainLegend(state.shows, 'top') : '';
    // A film whose every screening has passed is not the same as one still to come. Rather
    // than dimming it in place, where it reads as a broken card, group them at the end
    // under one heading. Said once, not annotated on every card.
    const spent = m => m.times.every(t => t.start < now);
    const live = movies.filter(m => !spent(m));
    const over = movies.filter(spent);
    const card = m => {
      const title = disp(m);
      const hue = [...m.title].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0, 7) % 360;
      const initials = (title.match(/\p{L}+|\d+/gu) || ['?']).slice(0,2).map(w=>w[0]).join('').toUpperCase();
      const tile = `<div class="poster blank" style="background:linear-gradient(160deg,hsl(${hue} 45% 32%),hsl(${(hue+45)%360} 50% 16%));color:hsl(${hue} 75% 82%)">${initials}</div>`;
      const posterUrl = safeAssetUrl(m.img);
      const poster = posterUrl
        ? `<img class="poster" src="${posterUrl}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.f" data-f='${tile.replace(/'/g,"&#39;")}'>`
        : tile;
      const stubClass = multiTheatre ? 'stubs grid' : 'stubs';
      // method is per *showtime*, so a pill at film level claimed something about every
      // screening: 47 film/day combinations mix an Anniskelu screening with normal ones
      // at one venue, and the card used to inherit the first showtime's tags. Tags every
      // showtime shares stay on the card; the rest move onto the stub they belong to,
      // rather than vanishing — one IMAX screening among 2D ones must still say so.
      const tagsOf = t => (t.method || '').split(' · ').filter(Boolean);
      const tagSets = m.times.map(t => new Set(tagsOf(t)));
      const common = [...(tagSets[0] || [])].filter(f => tagSets.every(set => set.has(f)));
      // Past times are hidden behind a compact stub rather than a global toggle: it costs
      // no header space and only appears on the cards that have any. If *every* time has
      // passed they stay visible, since an empty card would read as a bug.
      const sorted = m.times.sort((a,b)=>a.start-b.start);
      const ahead = sorted.filter(t => t.start >= now);
      const gone = sorted.filter(t => t.start < now);
      const open = state.revealed.has(m.eventId);
      const shown = (!ahead.length || open) ? sorted : ahead;
      const stubs = shown.map(t => {
        const clock = fiTime(t.start);
        const past = t.start < now;
        const cls = past ? ' past' : (t.soldOut ? ' sold' : '');
        const where = venueName(t);
        const ownTags = stubTags(tagsOf(t).filter(f => !common.includes(f)), t.aud);
        const own = ownTags.filter(f => !glyphOf(f)).join(' · ');
        const glyphs = ownTags.map(glyphOf).join('') + ageGlyph(t);
        const loc = [(multiTheatre ? (t.aud ? `${where} · ${t.aud}` : where) : t.aud), own]
          .filter(Boolean).join(' · ')
          + (t.soldOut && !past ? ' · ' + L[state.lang].soldout : '');
        const tint = tintedList && t.provider ? ` chain-${esc(t.provider)}` : '';
        return `<a class="stub${cls}${tint}" style="--notch:${past?52:56}px" href="${safeUrl(t.url)}" target="_blank" rel="noopener" title="Buy tickets — ${esc([loc, ageOf(t)].filter(Boolean).join(' · '))}">
                  <span class="time">${clock}</span><span class="aud"><span class="loc">${esc(loc)}</span>${glyphRow(glyphs)}</span>
                </a>`;
      }).join('');
      const fmts = common.map(f => `<span class="fmt">${esc(f)}</span>`).join('');
      const meta1 = [
        scoreRing(m),
        m.rating ? `<span class="rating">${esc(m.rating)}</span>` : '',
        premiereChip(m),
        fmts
      ].filter(Boolean).join('');
      const price = priceLabel(m.times);
      // The past-times toggle sits on the meta line, not in the stub grid: a ticket-shaped
      // cell that is not a ticket reads as a broken showtime.
      const pastToggle = (gone.length && ahead.length)
        ? `<button class="pastlink" data-reveal="${esc(m.eventId)}" aria-expanded="${open}">`
          + (open ? L[state.lang].hidePast : `+${gone.length} ${L[state.lang].showPast}`)
          + `</button>`
        : '';
      const meta2 = [
        genresOf(m) ? `<span>${esc(genresOf(m))}</span>` : '',
        m.len ? `<span>${esc(m.len)} min</span>` : '',
        m.lang ? `<span>${esc(langTxt(m.lang))}</span>` : '',
        price ? `<span>${price}</span>` : '',
        pastToggle
      ].filter(Boolean).join('');
      return `<article class="movie" data-id="${esc(m.eventId)}">
                ${poster}
                <div class="info">
                  <h2 class="title"><a class="tlink" href="#m=${encodeURIComponent(m.eventId)}">${esc(title)}</a></h2>
                  <div class="meta1">${meta1}</div>
                  ${meta2 ? `<div class="meta2">${meta2}</div>` : ''}
                  <div class="${stubClass}">${stubs}</div>
                </div>
              </article>`;
    };
    // Nothing left today: say so where the list would have been, and offer the next day.
    const noneLeft = !live.length
      ? `<div class="status">${L[state.lang].nomore}${nextDayLink()}</div>` : '';
    const overHead = over.length
      ? `<div class="daydone">${L[state.lang].alreadyShown}</div>` : '';
    main.innerHTML = listLegend + noneLeft + live.map(card).join('')
      + overHead + over.map(card).join('');
  }

  // render() rebuilds the whole list through innerHTML, which is ~90 cards in a combined
  // city view. Per keystroke that stutters on a mid-range phone, and the frames in
  // between are thrown away anyway. 120 ms is under the point where the list feels
  // detached from the typing and still collapses a fast burst into one render. Keyed DOM
  // reuse would be the real fix and is not worth it at this list size.
  let searchTimer = null;
  searchEl.oninput = () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.filter = searchEl.value; render(); }, 120);
  };

  /* ---------- movie sheet ---------- */
  const sheetEl = document.querySelector('#sheet'), overlayEl = document.querySelector('#overlay');

  // Modal lifecycle. The sheet was hidden with a CSS transform only, so it stayed in the
  // focus order and in the accessibility tree the whole time, permanently announcing
  // itself as an open dialog. `inert` is used rather than `hidden` because the sheet
  // animates in and out and `display:none` would kill the transition; it removes the
  // subtree from focus and from assistive tech in one attribute.
  //
  // Real modality means the *background* is inert while the sheet is open, which is what
  // stops Tab walking behind it. These are the roots outside the dialog.
  const BEHIND = () => [document.querySelector('header'), main,
                        document.querySelector('footer'), document.querySelector('#tagkey'),
                        document.querySelector('#stale'), document.querySelector('#partial')];
  let lastTrigger = null;
  function rememberTrigger(el){
    lastTrigger = el && el.closest ? (el.closest('a.tlink, a.tinfo') || el) : el;
  }
  function setInert(el, on){ if(el) el.inert = on; }
  function sheetKeydown(e){ if(e.key === 'Escape'){ e.preventDefault(); closeSheet(); } }
  async function showSheet(fid){
    await ensureFilms();
    const all = (jsonCache[state.area] && jsonCache[state.area].shows || [])
      .filter(s => s.eventId === fid).map(s => ({...s, start:new Date(s.start)}))
      .sort((a,b) => a.start - b.start);
    const sample = all[0] || state.shows.find(s => s.eventId === fid) || {};
    // In a combined view eventId is the cross-chain merge key, so films.json (keyed by
    // Finnkino's filmId) has to be looked up through the show's own id.
    const native = all.map(s => s._eid).find(id => id && films[id]) || sample._eid;
    let f = films[fid] || films[native] || {};
    if(!f.s && sample.title){
      const ex = await ensureExtraFilms();
      const hit = ex[normTitle(sample.title)];
      if(hit) f = { ...f, s: hit.s, tr: f.tr || hit.tr };
    }
    const lang = state.lang;
    const title = (lang==='en' ? ((f.t&&f.t.en)||f.o||sample.original)
                               : (f.t&&f.t.fi)) || sample.title || '';
    // TMDB has a Finnish overview for only some films, so fall back either way rather
    // than showing nothing.
    const syn = (f.s && (lang==='en' ? (f.s.en || f.s.fi) : (f.s.fi || f.s.en))) || '';
    const fmts = (sample.method || '').split(' · ').filter(Boolean)
      .map(x => `<span class="fmt">${esc(x)}</span>`).join('');
    const sheetPrice = priceLabel(all);
    const meta1 = [
      scoreRing(sample),
      sample.rating ? `<span class="rating">${esc(sample.rating)}</span>` : '',
      premiereChip({ ...sample, times: all }),
      sample.len ? `<span class="fmt">${esc(sample.len)} ${L[lang].min}</span>` : '',
      sheetPrice ? `<span class="fmt">${sheetPrice}</span>` : '',
      fmts
    ].filter(Boolean).join('');
    const byDay = new Map();
    const now = new Date();
    for(const s of all){
      const iso = fiDate(s.start);
      const k = `${fiDay[dowOf(iso)]} ${dmOf(iso)}`;
      if(!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(s);
    }
    // Across venues, "Sali 7" alone says nothing about which cinema: label the venue and
    // tint by chain, exactly as the main list does.
    const multi = labelVenues(all);
    const days = [...byDay.entries()].map(([k, arr]) =>
      `<h3>${k}</h3><div class="${multi ? 'stubs grid' : 'stubs'}">` +
      arr.map(s => {
        const past = s.start < now;
        const clock = fiTime(s.start);
        const cls = past ? ' past' : (s.soldOut ? ' sold' : '');
        const where = venueName(s);
        const loc = multi ? (s.aud ? `${where} · ${s.aud}` : where) : s.aud;
        const tint = multi && s.provider ? ` chain-${esc(s.provider)}` : '';
        return `<a class="stub${cls}${tint}" style="--notch:${past?52:56}px" href="${safeUrl(s.url)}" target="_blank" rel="noopener" title="${esc([loc, ageOf(s)].filter(Boolean).join(' · '))}">
                  <span class="time">${clock}</span><span class="aud"><span class="loc">${esc(loc)}</span>${glyphRow((s.method||'').split(' · ').map(glyphOf).join('') + ageGlyph(s))}</span></a>`;
      }).join('') + '</div>').join('');
    const legend = multi ? chainLegend(all) : '';
    const sheetPoster = safeAssetUrl(sample.img);
    const poster = sheetPoster ? `<img class="poster" src="${sheetPoster}" alt="">` : '';
    sheetEl.innerHTML = `
      <div class="grab" aria-hidden="true"></div>
      <button class="sheet-close" type="button" aria-label="${esc(L[lang].aClose)}">✕</button>
      <div class="sheet-head">${poster}
        <div><div class="sheet-title" id="sheetTitle">${esc(title)}</div>
          <div class="meta1" style="margin-top:8px">${meta1}</div>
          ${genresOf(sample) ? `<div class="meta2">${esc(genresOf(sample))}</div>` : ''}
          ${safeUrl(f.tr || sample.tr) ? `<a class="trailer" href="${safeUrl(f.tr || sample.tr)}" target="_blank" rel="noopener">${L[lang].trailer}</a>` : ''}
        </div></div>
      <div class="sheet-body">${legend}
        ${syn ? `<p class="syn">${esc(syn)}</p>` : ''}
        <div class="sheet-days">${days}</div>
      </div>`;
    sheetEl.querySelector('.sheet-close').onclick = closeSheet;
    document.body.classList.add('sheet-open');
    // Order matters: un-inert before focusing, or the focus call is a no-op.
    sheetEl.inert = false;
    sheetEl.removeAttribute('aria-hidden');
    BEHIND().forEach(el => setInert(el, true));
    document.addEventListener('keydown', sheetKeydown);
    const closeBtn = sheetEl.querySelector('.sheet-close');
    if(closeBtn) closeBtn.focus();
  }
  // Setting location.hash = '' counts as navigating to the top of the document, which
  // scrolled the list back up. Strip the fragment without navigating instead.
  function closeSheet(){
    const y = window.scrollY;
    if(location.hash) history.replaceState(null, '', location.pathname + location.search);
    hideSheet();
    if(window.scrollY !== y) window.scrollTo(0, y);
  }

  function hideSheet(){
    const wasOpen = document.body.classList.contains('sheet-open');
    document.body.classList.remove('sheet-open');
    sheetEl.classList.remove('dragging');
    sheetEl.style.transform = '';
    if(overlayEl) overlayEl.style.opacity = '';
    document.removeEventListener('keydown', sheetKeydown);
    BEHIND().forEach(el => setInert(el, false));
    sheetEl.inert = true;
    sheetEl.setAttribute('aria-hidden', 'true');
    // Back to the control that opened it, but only if it is still on the page: the list
    // is rebuilt through innerHTML on every render, and a stale node would swallow the
    // focus silently. Only on a real close, so arriving on a hash-less URL does not
    // yank focus somewhere unexpected.
    if(wasOpen && lastTrigger && document.contains(lastTrigger)){
      lastTrigger.focus();
    }
    lastTrigger = null;
  }

  // Drag the header down to dismiss: past ~110 px, or a quick flick, closes it.
  // Bottom-sheet layout only; the desktop modal is centred and has no such gesture.
  (function enableDragDismiss(){
    let y0 = 0, dy = 0, t0 = 0, active = false;
    const mobile = () => window.matchMedia('(max-width:699px)').matches;
    const head = () => sheetEl.querySelector('.sheet-head') || sheetEl.querySelector('.grab');

    sheetEl.addEventListener('pointerdown', e => {
      if(!mobile()) return;
      const h = head();
      const onHandle = !!e.target.closest('.grab');
      if(!onHandle && !(h && h.contains(e.target))) return;
      if(e.target.closest('.sheet-close, a')) return;
      active = true; y0 = e.clientY; dy = 0; t0 = performance.now();
      sheetEl.classList.add('dragging');
      sheetEl.setPointerCapture(e.pointerId);
    });

    sheetEl.addEventListener('pointermove', e => {
      if(!active) return;
      dy = Math.max(0, e.clientY - y0);
      sheetEl.style.transform = `translateY(${dy}px)`;
      if(overlayEl) overlayEl.style.opacity = String(Math.max(0, 1 - dy / 320));
    });

    const end = e => {
      if(!active) return;
      active = false;
      sheetEl.classList.remove('dragging');
      const v = dy / Math.max(1, performance.now() - t0);   // px per ms
      if(dy > 110 || v > 0.6){
        closeSheet();
      } else {
        sheetEl.style.transform = '';
        if(overlayEl) overlayEl.style.opacity = '';
      }
    };
    sheetEl.addEventListener('pointerup', end);
    sheetEl.addEventListener('pointercancel', end);
  })();
  function syncSheet(){
    const m = location.hash.match(/m=(.+)$/);
    if(m){
      let id = m[1];
      try { id = decodeURIComponent(id); } catch(_) {}
      showSheet(id);
    } else hideSheet();
  }
  window.addEventListener('hashchange', syncSheet);
  matchMedia('(max-width:560px)').addEventListener('change', () => { if(state.area) syncFav(); });
  overlayEl.onclick = closeSheet;
  main.addEventListener('click', e => {
    // Controls inside a card must not also open the movie sheet. This used to test only
    // `a.stub`, so the past-times toggle (a button) opened the sheet on every click.
    if(e.target.closest('a.stub, [data-reveal], [data-goto], .lg-btn')) return;
    // The title and the times-view row are real links now, so let the browser navigate:
    // handling them here as well would set the same hash twice and, more to the point,
    // would mean the keyboard path and the mouse path ran different code.
    if(e.target.closest('a.tlink, a.tinfo')){ rememberTrigger(e.target); return; }
    const el = e.target.closest('article.movie, .tinfo');
    if(el){
      rememberTrigger(el.querySelector('a.tlink') || el);
      location.hash = 'm=' + encodeURIComponent(el.dataset.id);
    }
  });

  /* ---------- language ---------- */
  const langSeg = document.querySelector('#langSeg');
  // Rendered rather than written into the markup so the pressed state has exactly one
  // source of truth, and so applyLang() cannot drift from what is on screen.
  function drawLangSeg(){
    langSeg.innerHTML = LANGS.map(code =>
      `<button type="button" data-lang="${code}" aria-pressed="${code === state.lang}"`
      + ` lang="${code}">${code.toUpperCase()}</button>`).join('');
  }
  function applyLang(){
    drawLangSeg();
    coll = new Intl.Collator(COLLATE[state.lang]);
    // Screen readers and hyphenation both key off this, and it was never updated when
    // the app had two languages either.
    document.documentElement.lang = state.lang;
    fiDay = L[state.lang].days;
    searchEl.placeholder = searchHint();
    buildDays();
    syncTools();
    // The venue picker, the health line and the footer are built once per load and
    // all carry translated text, so they need an explicit redraw here.
    if(allVenues.length){ buildAreaOptions(); areaSel.value = state.area; }
    render();
    renderHealth();
    renderStatus();
    renderContact();
    applyAriaLabels();
    if(document.body.classList.contains('sheet-open')) syncSheet();
  }
  state.lang = LANGS.includes(prefs.get().lang) ? prefs.get().lang : 'fi';
  renderContact();
  applyAriaLabels();
  langSeg.onclick = async e => {
    const b = e.target.closest('button[data-lang]');
    if(!b || b.dataset.lang === state.lang) return;
    state.lang = b.dataset.lang;
    prefs.set({lang: state.lang});
    // Only English needs films.json, for the English titles Finnkino publishes. Swedish
    // falls back to the Finnish title on purpose: that is the name printed on the ticket
    // and on the cinema's own page, so an English one would send a reader looking for a
    // film under a name nothing local uses. See IDEAS.
    if(state.lang === 'en') await ensureFilms();
    applyLang();
  };

  /* ---------- view + filter toggles ---------- */
  const segM = document.querySelector('#segMovies'), segT = document.querySelector('#segTimes');
  const chipLang = document.querySelector('#chipLang'), chipKids = document.querySelector('#chipKids');
  const chipAnnis = document.querySelector('#chipAnnis');
  function syncTools(){
    syncFav();
    segM.classList.toggle('on', state.view === 'movies');
    segT.classList.toggle('on', state.view === 'times');
    segM.setAttribute('aria-pressed', String(state.view === 'movies'));
    segT.setAttribute('aria-pressed', String(state.view === 'times'));
    chipLang.setAttribute('aria-pressed', String(!!state.fLang));
    chipKids.setAttribute('aria-pressed', String(!!state.fKids));
    chipAnnis.setAttribute('aria-pressed', String(!!state.fAnnis));
    chipLang.classList.toggle('on', state.fLang);
    chipKids.classList.toggle('on', state.fKids);
    chipAnnis.classList.toggle('on', state.fAnnis);
    segM.textContent = L[state.lang].movies; segT.textContent = L[state.lang].times;
    chipLang.textContent = L[state.lang].flang; chipKids.textContent = L[state.lang].fkids;
    chipAnnis.textContent = L[state.lang].fannis;
  }
  segM.onclick = () => { state.view = 'movies'; prefs.set({view:'movies'}); syncTools(); render(); };
  segT.onclick = () => { state.view = 'times';  prefs.set({view:'times'});  syncTools(); render(); };
  chipLang.onclick = () => { state.fLang = !state.fLang; prefs.set({fLang:state.fLang}); syncTools(); render(); };
  // Lapsille and Anniskelu turn each other off. Not an arbitrary rule: the two overlap
  // on 22 of 3059 showtimes, five of which state a K-18 limit on the screening itself,
  // and of the six films in the overlap exactly one is a children's film. "A kids' film
  // in a licensed auditorium" is a real thing but a rare one, and leaving both on mostly
  // produces an empty list from two chips that each looked like they should have worked.
  // Turning the other off says which one won, where an empty result would not.
  chipKids.onclick = () => {
    state.fKids = !state.fKids;
    if(state.fKids) state.fAnnis = false;
    prefs.set({fKids:state.fKids, fAnnis:state.fAnnis}); syncTools(); render();
  };
  chipAnnis.onclick = () => {
    state.fAnnis = !state.fAnnis;
    if(state.fAnnis) state.fKids = false;
    prefs.set({fAnnis:state.fAnnis, fKids:state.fKids}); syncTools(); render();
  };
  const pr = prefs.get();
  state.view = pr.view === 'times' ? 'times' : 'movies';
  state.fLang = !!pr.fLang; state.fKids = !!pr.fKids; state.fAnnis = !!pr.fAnnis;
  // A stored pair from before the two became exclusive, or a hand-edited one. Kids wins:
  // it is the filter whose failure mode matters.
  if(state.fKids) state.fAnnis = false;
  syncTools();

  /* ---------- refresh on resume ---------- */
  // An installed PWA is resumed, not reloaded, so boot runs once and everything it
  // fetched stays frozen. Only the date rollover used to force a refetch, which meant a
  // phone opened in the evening showed the morning's schedule and a source line counting
  // upward -- "Finnkino 6h" -- while a desktop tab, reloaded, read 0h off the same repo.
  // The ages were honest: the app really was holding six-hour-old showtimes, sold-out
  // flags and all.
  //
  // REFRESH_MS is 10 minutes because GitHub Pages serves data with max-age=600; refetching
  // more eagerly than that would be answered from the HTTP cache anyway. providerMeta is
  // refreshed through fetchVenueLists rather than loadAreas so the venue picker is left
  // alone.
  const REFRESH_MS = 10 * 60 * 1000;
  let builtFor = fiToday();
  async function refreshAll({ rollover }){
    if(rollover){
      builtFor = fiToday();
      state.advanced = false;
      buildDays();
    }
    Object.keys(jsonCache).forEach(k => delete jsonCache[k]);
    try {
      await fetchVenueLists();       // ages and horizons, without touching the picker
      renderHealth();
    } catch(_){ /* schedule still worth refreshing; the ages just stay put */ }
    await loadSchedule();
  }
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState !== 'visible') return;
    const rollover = fiToday() !== builtFor;
    if(rollover || Date.now() - lastLoad > REFRESH_MS){
      refreshAll({ rollover });
    } else {
      render(); // refresh past-time dimming after shorter naps
    }
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    // The SW hands back cached data JSON at once and refreshes it behind (see sw.js).
    // When a refresh lands, swap the fresh bytes in without a spinner: re-read through
    // the SW (instant -- it is the copy just cached), compare `generated`, and only a
    // real change re-derives. The cooldown stops the loop this would otherwise be:
    // the re-read triggers background refreshes of its own, which message again.
    let swrLast = 0;
    navigator.serviceWorker.addEventListener('message', async ev => {
      const path = ((ev.data || {}).fresh || '');
      const m = path.match(/\/data\/area-(.+)\.json$/);
      if(!m || !jsonCache[state.area]) return;
      const hit = state.area === m[1] ||
        (state.area.startsWith('city:') && (cityGroups[state.area.slice(5)] || []).includes(m[1]));
      if(!hit || Date.now() - swrLast < 60000) return;
      swrLast = Date.now();
      try {
        const fresh = state.area.startsWith('city:')
          ? await loadCity(state.area.slice(5))
          : await fetchJSON(path.slice(1));
        if(fresh.generated && fresh.generated !== jsonCache[state.area].generated){
          jsonCache[state.area] = fresh;
          lastLoad = Date.now();   // the refresh was a real network fetch, seconds ago
          loadSchedule();          // warm cache: runs synchronously to render, no spinner
        }
      } catch(_){ /* next visit gets it */ }
    });
  }

  /* ---------- init ---------- */
  (async () => {
    try {
      // Start every knowable fetch now. The venue lists are needed on every boot and
      // their names come from the provider ids; the schedule file comes from the same
      // prefs the restore below will read (?area= beats them, same as in the restore).
      {
        const pr = prefs.get();
        for(const p of PROV_FALLBACK) if(p.id !== 'finnkino') prefetch(`data/venues-${p.id}.json`);
        let target = '';
        try { target = new URLSearchParams(location.search).get('area') || ''; } catch(_){}
        target = target || pr.fav || pr.area || '';
        if(target.startsWith('city:')){
          for(const id of (pr.cityIds || {})[target.slice(5)] || []) prefetch(`data/area-${id}.json`);
        } else if(target){
          prefetch(`data/area-${target}.json`);
        }
      }
      // The static markup says this in Finnish, the default; EN prefs re-say it here
      // before the first fetch resolves.
      if(state.lang !== 'fi')   // static markup is Finnish; restate it for sv/en
        main.innerHTML = `<div class="status"><div class="reel"></div>${L[state.lang].loadingTheatres}</div>`;
      buildDays();
      // Genre names are cosmetic: genresOf falls back to provider strings until the map
      // arrives, and ensureGenres invalidates every _hay on arrival, so this never
      // belongs on the critical path.
      ensureGenres();
      // areas.json downloads while providers.json is applied. loadProviders must finish
      // before loadAreas: the venues loop iterates PROVIDERS and fillAreaSelect labels
      // venues from it, and the hardcoded fallback may lag the registry.
      const areasP = fetchJSON('data/areas.json');
      areasP.catch(() => {});   // handled inside loadAreas; this only silences the
                                // transient unhandled-rejection the pre-start would log
      await loadProviders();
      await loadAreas(areasP);
      if(state.lang === 'en'){ await ensureFilms(); }
      drawLangSeg();
      coll = new Intl.Collator(COLLATE[state.lang]);
      document.documentElement.lang = state.lang;
      fiDay = L[state.lang].days;
      searchEl.placeholder = searchHint();
      buildDays();
      await loadSchedule();
    } catch(e){
      main.innerHTML = netErrorHtml(e);
    }
  })();
})();
</script>
</body>
</html>

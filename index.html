<meta name="theme-color" content="#0D0E12">
<!-- Installed on iOS, the default status-bar treatment is a system material that
     blurs whatever the page's top edge holds. black-translucent is the only style

     safe-area insets become non-zero, and the fixed strip in the CSS paints a flat
     background behind the clock instead of the blur. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Crawler and share-preview metadata. Deliberately carries no venue or city count:
     those live in README and IDEAS and would be a third place to keep in step. The
     chains change far less often. og:image is the 512 icon, the only image on this
     origin; a purpose-built 1200x630 card would preview better. -->
<meta name="description" content="Suomen elokuvateatterien näytösajat yhdessä paikassa: Finnkino, BioRex, Riviera, Savon Kinot, Kinoset ja muut. Valitse teatteri ja päivä.">

<meta property="og:description" content="Suomen elokuvateatterien näytösajat yhdessä paikassa. Valitse teatteri ja päivä.">
<meta property="og:url" content="https://leffavuoro.fi/">

<meta name="twitter:image" content="https://leffavuoro.fi/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Archivo, self-hosted. It used to come from fonts.googleapis.com, which meant
     Google saw every visitor's IP on every load -- the last third-party request on
     this origin now that posters are mirrored. Same two woff2 subsets Google serves
     to a modern browser, same unicode-ranges, so latin-ext is still only fetched by
     a page that needs it. Licence in fonts/OFL.txt. Only latin is preloaded: it
     covers Finnish and Swedish, and preloading both would download 86 kB most
     visitors never use. */
  @font-face{font-family:'Archivo';font-style:normal;
    font-weight:100 900;font-stretch:62% 125%;font-display:swap;
    src:url(fonts/archivo-latin-ext.woff2) format('woff2');
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
  @font-face{font-family:'Archivo';font-style:normal;
    font-weight:100 900;font-stretch:62% 125%;font-display:swap;
    src:url(fonts/archivo-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --ink:#16181D; --muted:#5C6470;
    --line:#E3E6EB; --accent:#B8860B; --accent-soft:#F4E9CE;
    /* The accent is tuned to carry a 3 px border and a focus ring, where 3:1 is the
       bar. As small text on --bg it measures 3.04:1 and fails AA, so text that wants
       to look accent-coloured uses --accent-text instead: same hue, darkened until it
       clears 4.5:1 on both --bg and --surface. Borders, rings and the wordmark stay on
       --accent, which is what those numbers were chosen for. */
    --accent-text:#8A6508;
    /* Accent on an --ink background -- only the selected day chip. It is the inverse
       surface, so it needs the opposite polarity from --accent-text and cannot share
       it: light theme reads a dark gold on near-black, dark theme on near-white. */
    --accent-on-ink:#B8860B;
    --chip-bg:#FFFFFF; --chip-hover:#16181D; --chip-hover-ink:#F6F7F9;
    --shadow:0 1px 3px rgba(22,24,29,.06);
    --past:#AEB4BE;
  }
  [data-theme="dark"]{
    --bg:#0D0E12; --surface:#16181F; --ink:#EDEDEA; --muted:#8B93A1;
    --line:#262A33; --accent:#E8B84B; --accent-soft:#2A2415;
    --accent-text:#E8B84B;
    --accent-on-ink:#8A6508;
    --chip-bg:#1C1F28; --chip-hover:#E8B84B; --chip-hover-ink:#0D0E12;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --past:#4A4F5A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* Announced, never seen. Not display:none and not visibility:hidden -- both remove the
     node from the accessibility tree, which is the one thing this element exists for. */
  .sr-only{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
    border:0;
  }
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    transition:background .25s,color .25s;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ===== Header ===== */
  /* The whole header used to be sticky, so the logo, language toggle and theme button
     held 58 px of every screen for the entire length of a 45-card list. They are the one
     row a reader scrolling films has no use for. Sticking the *controls* instead lets
     that row scroll away as ordinary content while the picker, search, dates and filters
     stay pinned.
     Deliberately no JavaScript, no scroll listener and no height constant: the wrapper
     pins itself at top:0, so nothing has to know how tall the branding row is, and
     nothing can drift when that row changes. Nothing resizes either, so the list never
     shifts under the reader -- the header's flow height is identical before and after.
     Scrolling back to the top brings the row back by itself, because it is just content. */
  header{
    z-index:50;
    background:var(--bg);
    transition:background .25s;
  }
  .pinned{
    position:sticky; top:0; z-index:50;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  /* Installed on an iPhone, the page runs edge-to-edge under the transparent status
     bar, and scrolling content showed through it as a blur across the top of the
     screen. A fixed strip the height of the inset paints the page background behind
     the status bar at all times -- it cannot ride on the sticky row, because sticky
     is bound to its parent and stops covering once the header scrolls away. The
     header pads down past the inset at rest, and the full-screen venue sheet does the
     same so its search row clears the notch. env() is zero everywhere without a
     notch, so nothing moves on any other device. */
  @supports (padding: env(safe-area-inset-top)){
    body::before{
      content:""; position:fixed; top:0; left:0; right:0; z-index:45;
      height:env(safe-area-inset-top); background:var(--bg);
      pointer-events:none;
    }
    header{padding-top:env(safe-area-inset-top)}
    .pinned{top:env(safe-area-inset-top)}
    .vsheet{padding-top:env(safe-area-inset-top)}
  }
  .bar{
    max-width:1100px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; gap:16px;
  }
  .logo{
    font-stretch:125%; font-weight:900; letter-spacing:.16em;
    text-transform:uppercase; font-size:1.05rem; user-select:none;
    white-space:nowrap;
  }
  @media (max-width:520px){
    .logo{font-size:.82rem; letter-spacing:.08em}
  }
  /* At 320 the wordmark, three language segments and the theme circle do not all fit at
     the 520px sizes. Measured: 103px + 86px + 38px + gaps against 292px of usable row. */
  @media (max-width:360px){
    .bar{gap:8px}
    .logo{font-size:.66rem; letter-spacing:.04em}
    .langseg button{padding:0 7px; font-size:.7rem; letter-spacing:0}
  }
  .logo span{color:var(--accent)}
  .bar .spacer{flex:1}
  #themeToggle{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    /* flex-shrink:0, or the language control squeezes this circle into an oval. It was
       only ever safe because nothing else shared the row. */
    flex:0 0 38px;
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    font-size:1rem; line-height:1; display:grid; place-items:center;
    transition:border-color .15s, transform .15s;
  }
  #themeToggle:hover{border-color:var(--accent); transform:rotate(15deg)}
  #themeToggle:focus-visible, .day:focus-visible, .stub:focus-visible,
  input:focus-visible, .tlink:focus-visible, .tinfo:focus-visible, .sheet-close:focus-visible,
  button:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ===== Controls ===== */
  .controls{
    max-width:1100px; margin:0 auto; padding:16px 20px 12px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  /* Form controls carry no shadow: a border on a flat surface is affordance enough,
     and the drop shadows were the one treatment making the header read as a generic
     component library rather than a timetable. The shadow stays on stubs (the thing
     you tap) and posters (imagery). */
  #areaSelect, .search{
    font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 14px;
  }
  #areaSelect{cursor:pointer; max-width:280px; display:inline-flex; align-items:center;
    gap:8px; text-align:left}
  #areaSelect .vlbl{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap}
  /* A drawn chevron, not the ▾ glyph: iOS renders the glyph small whatever the
     font-size says, and it was reported unreadable twice. */
  #areaSelect .vchev{color:var(--muted); flex:0 0 auto; display:inline-flex}
  #areaSelect:hover, .fav:hover{border-color:var(--muted)}
  .fav{
    font:inherit; font-size:1.15rem; line-height:1; cursor:pointer;
    color:var(--muted); background:var(--surface);
    border:1px solid var(--line); border-radius:10px;
    padding:8px 12px;
  }
  .fav[aria-pressed="true"]{color:var(--accent-text); border-color:var(--accent)}
  .fav.labelled{display:inline-flex; align-items:center; gap:6px; color:var(--ink)}
  .fav .fav-cta{font-size:.78rem; font-weight:600; white-space:nowrap}
  /* Chain hint in combined views. The venue name carries the meaning; this only helps
     scanning, so it is never the sole signal. */
  /* --chain is set per chain by a <style> generated from data/providers.json.
     Not --accent: that is already the theme colour. */
  .stub[class*="chain-"]{border-left:3px solid var(--chain, var(--line))}

  /* Venue picker sheet. The trigger keeps the old select's face; the list is a dialog
     because a native select cannot carry a search field. Same modal lifecycle as the
     movie sheet and the month picker (BEHIND/inert), full-screen on mobile with the
     search pinned on top so the on-screen keyboard covers venues, never the field. */
  .vwrap{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; display:none}
  .vwrap.open{display:block}
  .vsheet{position:absolute; inset:0; background:var(--bg); display:flex;
    flex-direction:column}
  @media(min-width:700px){
    .vsheet{inset:auto; left:50%; top:7vh; transform:translateX(-50%);
      width:min(480px,92vw); max-height:80vh; border:1px solid var(--line);
      border-radius:14px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.25)}
  }
  .vhead{display:flex; gap:8px; padding:12px; border-bottom:1px solid var(--line);
    background:var(--surface)}
  .vfind{flex:1; display:flex; align-items:center; gap:8px; background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:9px 12px}
  /* The inner input suppresses its own outline, which also suppressed the global
     input:focus-visible rule (same 0,1,1 specificity, later in the sheet) -- so the
     field that desktop autofocuses had no visible focus at all. The ring belongs on
     the visible control, which is this container. */
  .vfind:focus-within{border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent-soft)}
  .vfind input{flex:1; min-width:0; font:inherit; color:var(--ink); background:none;
    border:0; outline:none; padding:0}
  .vfind input::placeholder{color:var(--muted)}
  .vfind .vglass{color:var(--muted); flex:0 0 auto}
  .vclose{font:inherit; font-size:1rem; color:var(--muted); background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer}
  .vclose:hover{border-color:var(--muted)}
  /* No top padding: the city headers are sticky, and rows scrolled past them showed
     through a padding-height slit between the search head and the stuck header. The
     headers' own padding provides the breathing room instead. */
  .vlist{flex:1; overflow-y:auto; padding:0 12px 24px; overscroll-behavior:contain}
  .vcity{position:sticky; top:0; z-index:1; background:var(--bg); color:var(--muted);
    font-size:.76rem; text-transform:uppercase; letter-spacing:.06em; padding:14px 4px 5px}
  .vrow{display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    font:inherit; color:var(--ink); background:none; border:0; border-radius:9px;
    padding:9px 8px; cursor:pointer}
  .vrow:hover{background:var(--accent-soft)}
  .vrow[aria-current="true"]{box-shadow:inset 0 0 0 1px var(--accent)}
  .vrow .vdot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;
    background:var(--chain, var(--line))}
  .vrow .vtxt{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap}
  .vrow .vtxt small{color:var(--muted)}
  .vrow mark{background:none; color:var(--accent-text); font-weight:700}
  .vrow.vall .vtxt{font-weight:600}
  .vnone{display:none; color:var(--muted); text-align:center; padding:36px 16px}
  .vnone.show{display:block}
  .search{flex:1; min-width:160px}
  .search::placeholder{color:var(--muted)}

  .days{
    max-width:1100px; margin:0 auto; padding:0 20px 16px;
    display:flex; gap:6px;
  }
  /* min-width:max-content, not 0. `flex:1 1 0` hands every chip an equal sixth, and the
     six labels are nothing like equal: "Huomenna" is eight characters and "La" is two, so
     the sixth that suits the short ones starves the long one. Below about 374px even the
     small label size needs more than its share. max-content lets the one chip that is
     long take what it needs and leaves the other five sharing the rest, so the row stays
     visually even at every width where it can be -- measured spread is 0px from 375px up
     and 10.7px at 320px, which is the one width where something has to give. */
  .day{
    flex:1 1 0; min-width:max-content; border:1px solid var(--line);
    background:var(--surface);
    border-radius:10px; padding:7px 2px; cursor:pointer; font:inherit;
    color:var(--muted); text-align:center; transition:all .15s;
    position:relative; overflow:hidden;
    /* 44px is the tap-target floor. Two lines of small type plus the padding come to
       42.5px on a phone, so this adds the last 1.5px and does nothing on desktop, where
       the same box already measures 47px. min-height rather than more padding: padding
       would have to differ per breakpoint to land on the same number, and the shortfall
       is not the same at every size. */
    min-height:44px;
  }
  .day:hover:not(.active){border-color:var(--muted)}
  /* nowrap + overflow:hidden clipped "Huomenna" mid-glyph at 320px; an ellipsis at
     least says the label continues. */
  .day b, .day small{overflow:hidden; text-overflow:ellipsis}
  .day b{display:block; color:var(--ink); font-weight:700; font-size:.85rem; white-space:nowrap}
  .day small{display:block; font-size:.74rem; font-weight:600; letter-spacing:.01em; white-space:nowrap}
  /* Custom month picker: <input type=date> cannot dim individual days, and with
     horizons out to three months most days have no screening at all. */
  .cal-wrap{
    position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .cal{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.5); padding:14px; width:min(340px,100%);
  }
  .cal-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
  .cal-head b{font-size:.95rem; text-transform:capitalize}
  .cal-nav{
    font:inherit; font-size:1.1rem; line-height:1; cursor:pointer; color:var(--ink);
    background:var(--chip-bg); border:1px solid var(--line); border-radius:8px;
    padding:4px 12px;
  }
  .cal-nav[disabled]{opacity:.3; cursor:default}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center}
  .cal-dow{font-size:.68rem; font-weight:700; color:var(--muted); padding-bottom:4px}
  .cal-day{
    font:inherit; font-size:.85rem; padding:7px 0; border-radius:8px;
    border:1px solid transparent; background:none; color:var(--muted);
  }
  .cal-day.has{
    cursor:pointer; color:var(--ink); font-weight:700;
    background:var(--chip-bg); border-color:var(--line);
  }
  .cal-day.has:hover{border-color:var(--muted)}
  .cal-day.off{opacity:.28}
  .cal-day.pad{opacity:0}
  .cal-day.sel{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .cal-note{display:block; margin-top:10px; font-size:.7rem; color:var(--muted); text-align:center}
  /* Past showtimes are hidden by default. The toggle lives on the meta line, so it
     costs no header space and no slot in the showtime grid. */
  .pastlink{
    font:inherit; font-size:inherit; cursor:pointer; padding:0;
    background:none; border:0; border-bottom:1px dotted currentColor;
    color:var(--muted);
  }
  .pastlink:hover{color:var(--ink)}
  .daydone{
    max-width:1100px; margin:26px auto 4px; padding:0 0 8px;
    border-bottom:1px solid var(--line);
    font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
  }
  .nextday{
    /* Own line: inline-block left it stranded beside the message with a wide gap. */
    display:block; width:fit-content; margin:14px auto 0;
    font:inherit; font-size:.85rem; font-weight:600;
    cursor:pointer; color:var(--ink); background:var(--chip-bg);
    border:1px solid var(--line); border-radius:999px; padding:8px 16px;
  }
  .day.active{background:var(--ink); border-color:var(--ink)}
  .day.active b{color:var(--bg)}
  .day.active small{color:var(--accent-on-ink)}

  /* ===== Movie list ===== */
  main{max-width:1100px; margin:0 auto; padding:8px 20px 80px}
  .status{padding:60px 0; text-align:center; color:var(--muted)}
  .status .reel{
    width:34px;height:34px;margin:0 auto 16px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .movie{
    display:flex; gap:18px; padding:20px 0;
    border-bottom:1px solid var(--line);
    /* Offscreen cards skip layout and paint. render() rebuilds the whole list through
       innerHTML (a decision recorded in IDEAS), so on a long day every card used to be
       laid out on every keystroke and day tap; with ~5 of 45 cards visible this cuts
       most of that. auto remembers the real height once a card has been on screen; the
       173px estimate only sizes the scrollbar before then. */
    content-visibility:auto; contain-intrinsic-size:auto 173px;
  }
  .poster{
    flex:0 0 92px; width:92px; height:132px; border-radius:8px;
    object-fit:cover; background:var(--surface); box-shadow:var(--shadow);
  }
  .poster.blank{display:grid;place-items:center;font-weight:800;font-size:1.5rem;letter-spacing:.04em;border:1px solid var(--line)}
  .info{flex:1; min-width:0}
  /* -.01em: Archivo at 800 tracks a touch loose at heading size; pulling it in makes
     the title read as display type against the untracked meta lines below it. */
  .title{font-size:1.15rem; font-weight:800; line-height:1.25; letter-spacing:-.01em}
  /* The trigger is a link because opening the sheet is hash navigation. It has to look
     like the heading it is, so only the focus ring gives it away. */
  .tlink{text-decoration:none; color:inherit; border-radius:3px}
  .tlink:hover, .tinfo:hover b{
    text-decoration:underline; text-decoration-thickness:1px;
    text-decoration-color:var(--muted); text-underline-offset:3px;
  }
  .meta1{
    /* 10px columns: the unboxed tags lean on whitespace where the border used to
       separate them. */
    margin-top:7px; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center;
    font-size:.82rem;
  }
  .meta2{
    margin-top:5px; color:var(--muted); font-size:.8rem;
    display:flex; flex-wrap:wrap; gap:4px 14px;
  }
  .rating{
    display:inline-block; border:1px solid var(--line); border-radius:5px;
    padding:1px 7px; font-weight:700; font-size:.72rem; color:var(--ink);
    background:var(--surface);
  }
  /* Format, runtime and method tags are passive metadata, not controls. Boxing them
     made them read as buttons beside the stubs; small uppercase type separated by the
     row gap says "tag" on its own. The age rating keeps its box: it is an official
     classification and the chip shape is what distinguishes it from the free-form tags. */
  .fmt{
    display:inline-block; padding:1px 0; font-size:.72rem;
    color:var(--muted); font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  }
  .fmt.prem{color:var(--accent-text); font-weight:700}
  /* A limit the *screening* imposes, not the film's classification: a licensed bar
     auditorium is 18+ even when the film is K-12. Deliberately not red and not KAVI's
     official symbol -- that artwork means a legal age rating, which this is not, and a
     red chip inside a stub whose left rule is already Finnkino orange or Kotkan Leffat
     crimson would compete with the one thing colour does here. Separated by shape and
     weight instead, so it also survives greyscale and colourblind vision. */
  /* Two glyphs, no more. A stub's label column is about 75 px and truncates, so
     "Anniskelu" costs a third of it; the word survives on the card, where there is room.
     Monochrome and drawn with currentColor on purpose: the chain rule is the only thing
     in a stub allowed to carry colour. Never a glyph alone -- each one has a title and an
     aria-label with the Finnish word, and the legend spells both out. */
  .gl{
    display:inline-grid; place-items:center; flex:0 0 auto;
    width:15px; height:15px; border-radius:50%;
    border:1px solid currentColor; color:var(--ink);
    font-size:.55rem; font-weight:800; letter-spacing:0; line-height:1;
  }
  .gl.age{width:auto; min-width:15px; padding:0 3px; border-radius:8px}
  .stub .gl{color:var(--muted)}
  .stub:hover .gl{color:inherit}
  .tagkey{display:inline-flex; flex-wrap:wrap; gap:10px; align-items:center;
    font-size:.7rem; color:var(--muted); margin-left:10px;
    padding-left:10px; border-left:1px solid var(--line)}
  @media (max-width:560px){
    .tagkey{margin-left:0; padding-left:0; border-left:0; margin-top:6px}
  }
  .tagkey .gl{color:var(--muted); margin-right:4px}
  .agelim{
    display:inline-block; margin-left:6px; border:1px solid var(--line);
    border-radius:4px; padding:0 4px; font-size:.66rem; font-weight:800;
    letter-spacing:.03em; color:var(--ink); background:var(--surface);
    white-space:nowrap; vertical-align:1px;
  }
  .stub:hover .agelim{color:inherit; border-color:currentColor; background:transparent; opacity:.85}

  /* Three languages do not fit a toggle that shows the one you would switch *to*: with
     two you can infer where you are, with three you cannot, and reaching the third is
     two taps with nothing saying so. Same segmented control as Leffat/Ajat (shared 8px
     radius), so it is a pattern already on the page rather than a new one.
     flex:0 0 auto is load-bearing. The control clips its overflow, so under flex
     pressure it does not push the row wide, it silently eats "EN". */
  .langseg{
    display:flex; flex:0 0 auto; overflow:hidden;
    border:1px solid var(--line); border-radius:8px; background:var(--surface);
  }
  .langseg button{
    border:0; background:transparent; color:var(--muted); cursor:pointer;
    font:inherit; font-weight:800; font-size:.74rem; letter-spacing:.06em;
    padding:0 10px; height:36px;
  }
  .langseg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
  .langseg button:hover:not([aria-pressed="true"]){color:var(--ink)}
  .movie{cursor:pointer}

  #overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0;
    pointer-events:none; transition:opacity .25s; z-index:90}
  #sheet{position:fixed; left:0; right:0; bottom:0; max-height:86vh; overflow:hidden;
    display:flex; flex-direction:column;
    background:var(--bg); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; transform:translateY(102%);
    transition:transform .28s cubic-bezier(.3,.8,.3,1); z-index:100;
    padding:18px 0 0; max-width:720px; margin:0 auto;}
  body.sheet-open #overlay{opacity:1; pointer-events:auto}
  body.sheet-open #sheet{transform:none}
  @media (min-width:700px){
    #sheet{
      bottom:auto; top:50%; left:50%; right:auto;
      width:min(680px, 92vw); max-height:82vh;
      border:1px solid var(--line); border-radius:18px;
      box-shadow:0 24px 80px rgba(0,0,0,.45);
      transform:translate(-50%,-46%); opacity:0; pointer-events:none;
      transition:transform .22s ease, opacity .22s ease;
    }
    body.sheet-open #sheet{transform:translate(-50%,-50%); opacity:1; pointer-events:auto}
  }
  .sheet-close{position:absolute; top:12px; right:14px; width:34px; height:34px;
    border-radius:50%; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); font-size:1rem; cursor:pointer}
  .sheet-head{display:flex; gap:16px; align-items:flex-start;
    flex:0 0 auto; padding:0 20px 14px}
  /* Drag-to-dismiss: only the bottom-sheet layout gets a grab handle. */
  .grab{display:none}
  @media (max-width:699px){
    .grab{
      display:block; width:38px; height:4px; border-radius:2px;
      background:var(--line); margin:0 auto 10px; flex:0 0 auto;
    }
    .sheet-head{touch-action:none; cursor:grab}
    #sheet.dragging{transition:none}
  }
  .sheet-body{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; padding:0 20px 28px;
    border-top:1px solid var(--line)}
  .sheet-body > .syn:first-child{margin-top:14px}
  /* The chain key has to stay put while the day list scrolls: a long film has 40+ stubs
     over several days, and the colour on a stub means nothing once the key has scrolled
     away. Negative margins span the body's 20 px padding so the sticky strip reaches
     both edges instead of leaving a gutter the stubs slide through. */
  .sheet-body > .legend{
    position:sticky; top:0; z-index:2;
    margin:0 -20px; padding:10px 20px;
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .sheet-body > .legend + .syn{margin-top:14px}
  .sheet-head .poster{flex:0 0 104px; width:104px; height:150px}
  .sheet-title{font-size:1.25rem; font-weight:800; line-height:1.2; padding-right:36px; letter-spacing:-.01em}
  .syn{margin-top:14px; line-height:1.6; font-size:.92rem; color:var(--ink)}
  .trailer{display:inline-block; margin-top:12px; color:var(--accent-text); font-weight:700;
    text-decoration:none; font-size:.88rem}
  .sheet-days{margin-top:6px}
  .sheet-days h3{margin:16px 0 8px; font-size:.75rem; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em; font-weight:700}

  /* Ticket stubs -- the signature */
  .stubs{margin-top:12px; display:flex; flex-wrap:wrap; gap:8px}
  /* A ticket needs about 240 px before a second column is worth having: 64 px of time,
     up to 75 px of "alkaen 10€", and 90 px for the cinema's name to keep its words. The
     film sheet is where this bit -- 335 px wide at 375, so minmax(168px) gave two 163 px
     columns and "Cinema Orion" beside a floor price broke letter by letter over nine
     lines; 520 px gave three columns and 1 px of details. min(240px,100%) is what keeps
     a track from exceeding a container narrower than 240. Measured 2026-09-02. */
  .stubs.grid{
    display:grid; gap:8px;
    grid-template-columns:repeat(auto-fill, minmax(min(240px, 100%), 1fr));
  }
  /* The combined view's ticket. Same component as the row stub, adapted: a fixed time
     compartment on the left spanning the full height, the details compartment beside it
     wrapping as it needs, the price at the trailing edge. The seam is the details
     compartment's dashed left border and sits at --tw; the notches are placed from the
     same variable, so the perforation and the divider share one x by construction.
     Until 2026-09-02 the notches were hidden here ("the perforation reads wrong on a
     stacked stub"), which left the chain rule carrying the whole ticket affordance --
     see IDEAS. 64 px is 12 + 41.8 + 10: the row stub's own padding around a tabular
     "00:00" at .92rem, measured. */
  .stubs.grid .stub{
    --tw:64px;
    display:grid; grid-template-columns:var(--tw) minmax(0,1fr) auto;
    grid-template-areas:"time aud price"; align-items:stretch; min-height:40px;
  }
  .stubs.grid .stub .time{grid-area:time; display:flex; align-items:center; padding:0 10px 0 12px}
  .stubs.grid .stub .aud{
    grid-area:aud; max-width:none; min-width:0;
    display:flex; flex-wrap:wrap; align-items:center; align-content:center; gap:2px 6px;
    padding:6px 8px 6px 10px; border-left:1px dashed var(--line);
  }
  /* min-width:0 and overflow-wrap: a grid item's default minimum is its content, so one
     unbreakable "Tennispalatsi" in a narrow column would push past its compartment and
     run under the price. Long words break instead of crossing the seam or the price. */
  .stubs.grid .stub .aud .loc{white-space:normal; overflow:visible; text-overflow:clip; overflow-wrap:anywhere; min-width:0}
  .stubs.grid .stub .glyphs{align-self:center; padding-top:0}
  .stubs.grid .stub .price{
    grid-area:price; flex:none; width:auto; align-self:stretch;
    display:flex; align-items:center; padding:0 10px 0 4px; border-left:0;
    font-size:.72rem; color:var(--muted); white-space:nowrap;
  }
  .stubs.grid .stub .price:empty{display:none}
  .stubs.grid .stub::before,.stubs.grid .stub::after{left:calc(var(--tw) - 4px); right:auto}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; font-size:.72rem; color:var(--muted)}
  .legend .lg{padding-left:8px; border-left:3px solid var(--line)}
  .legend .lg-btn{
    font:inherit; font-size:.74rem; font-weight:600; cursor:pointer;
    color:var(--muted); background:var(--surface);
    border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:0 999px 999px 0; padding:5px 12px 5px 9px;
    transition:color .15s, background .15s, opacity .15s;
  }
  .legend .lg-btn.on{color:var(--ink); background:var(--chip-bg)}
  .legend .lg-btn:not(.on){opacity:.5}
  .legend .lg-btn:hover{color:var(--ink); opacity:1}
  .legend .lg[class*="chain-"],
  .legend .lg-btn[class*="chain-"]{border-left-color:var(--chain, var(--line))}
  .legend .lg-btn.lg-all{
    border-left-width:1px; border-radius:999px; color:var(--ink); opacity:1;
    background:var(--chip-bg);
  }
  .legend.top{max-width:1100px; margin:0 auto; padding:0 20px 4px}
  .stub{
    --r:7px; --pw:56px;
    display:inline-flex; align-items:center; text-decoration:none; min-height:40px;
    background:var(--chip-bg); border:1px solid var(--line);
    border-radius:var(--r); box-shadow:var(--shadow);
    font-variant-numeric:tabular-nums;
    transition:background .15s,color .15s,border-color .15s,transform .1s;
    position:relative; overflow:hidden;
  }
  .stub .time{padding:7px 10px 7px 12px; font-weight:800; font-size:.92rem}
  .stub .aud{
    padding:7px 12px 7px 10px; font-size:.72rem; color:var(--muted);
    max-width:130px;
    display:flex; align-items:center; gap:6px; min-width:0;
  }
  /* Glyphs sit in their own column, pushed right and never wrapping with the label:
     trailing them after variable-length text put them in a different place on every
     stub, and on a two-line label they dropped onto a line of their own. */
  .stub .glyphs{margin-left:auto; flex:0 0 auto; display:flex; align-items:center; gap:3px}
  /* The room name truncates; the age chip never does. It is the one part of a stub a
     visitor cannot afford to have eaten by an ellipsis. */
  .stub .aud .loc{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .stub .aud .agelim{flex:0 0 auto}
  /* The price compartment: the tear-off end of the ticket. A fixed --pw wide whether or
     not the cinema publishes a price, so every ticket in a row has the same silhouette
     and an unpriced one simply has a blank stub -- never a dash, "free" or a zero. The
     dashed seam is its left border and the notches sit on that same x, from the same
     variable. Ink, bold, .78rem: read as a fact of the ticket, a step below the .92rem
     time and never a badge. "alkaen 10€" wraps to two lines inside the compartment. */
  .stub .price{
    flex:0 0 var(--pw); width:var(--pw); box-sizing:border-box; align-self:stretch;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
    border-left:1px dashed var(--line); text-align:center; white-space:normal;
    font-size:.78rem; font-weight:700; line-height:1.1; color:var(--ink);
  }
  .stub:hover .price,.stub:active .price{color:var(--chip-hover-ink)}
  /* perforation notches, centred on the seam */
  .stub::before,.stub::after{
    content:""; position:absolute; width:8px; height:8px; border-radius:50%;
    background:var(--bg); border:1px solid var(--line); left:auto; right:calc(var(--pw) - 4px);
  }
  .stub::before{top:-5px}.stub::after{bottom:-5px}
  .stub:hover{background:var(--chip-hover); color:var(--chip-hover-ink); border-color:var(--chip-hover); transform:translateY(-1px)}
  .stub:hover .aud{color:var(--chip-hover-ink); opacity:.75}
  /* :active mirrors :hover so a touch tap flashes the same inversion -- hover alone
     never fires on touch -- and the lift settles back for a pressed feel. */
  .stub:active{background:var(--chip-hover); color:var(--chip-hover-ink); border-color:var(--chip-hover); transform:none}
  .stub:active .aud{color:var(--chip-hover-ink); opacity:.75}
  .stub.past{opacity:.45; pointer-events:none}
  .stub.sold{opacity:.55; pointer-events:none; filter:grayscale(1)}
  .stub.sold .time{text-decoration:line-through}
  .stub.past .time{color:var(--past)}

  .theatre-tag{color:var(--accent-text); font-weight:600}
  .tmdb{color:var(--accent-text); font-weight:700}
  /* Score ring. The arc length carries the score and the number inside repeats it, so
     it survives greyscale and colourblind vision -- which is why it is one hue rather
     than TMDB's green/amber/red: this app already spends colour on chain identity, and
     a second colour language competing with it would cost more than it explains.
     Deliberately not a copy of TMDB's widget either; we use their data, not their
     badge, and looking like their component would imply an endorsement we do not have. */
  .ring{
    --v:0; position:relative; flex:0 0 auto;
    width:30px; height:30px; border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--v) * 3.6deg), var(--line) 0);
    display:grid; place-items:center;
  }
  .ring::before{
    content:""; position:absolute; inset:3px; border-radius:50%; background:var(--bg);
  }
  .ring b{position:relative; font-size:.68rem; font-weight:800; color:var(--ink); line-height:1}
  .ring.thin{opacity:.55}
  .votes{color:var(--muted); font-size:.7rem; font-weight:600}
  .sheet-head .ring{width:38px; height:38px}
  .sheet-head .ring b{font-size:.82rem}

  .tools{
    max-width:1100px; margin:0 auto; padding:0 20px 14px;
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  /* 8px on both segmented controls (this and .langseg): after the pill retreat on the
     filter chips, the two full capsules were the odd ones out. The inner segments keep
     no radius of their own -- overflow:hidden clips them to the container's corners. */
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
  .seg button{border:0; background:transparent; padding:7px 14px; font:inherit; font-size:.78rem; font-weight:700; color:var(--muted); cursor:pointer}
  .seg button.on{background:var(--ink); color:var(--bg)}
  .seg button:hover:not(.on){color:var(--ink)}
  /* Secondary filters sit a step below the Leffat/Ajat segment: same height, but the
     7px corner (the stub radius) instead of the full pill, so the row reads as one
     primary control plus quiet toggles rather than four equal capsules. */
  .chip{border:1px solid var(--line); background:var(--surface); border-radius:7px;
    padding:7px 12px; font:inherit; font-size:.78rem; font-weight:600; color:var(--muted); cursor:pointer; transition:all .15s}
  .chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .chip:hover:not(.on){color:var(--ink); border-color:var(--muted)}

  .trow{display:flex; align-items:center; gap:14px; padding:9px 0; border-bottom:1px solid var(--line)}
  /* The ticket in this list is time and price only: 62 + 56 + 2 = 120 px by construction,
     no floor and no cap, so every row's title starts at one x. Until 2026-09-03 it carried
     the room and grew to its label, 158 to 220 px: three widths in one list, and 119 px
     left for the title at 375. The room, the venue and the screening's age limit are on
     the meta line, where the room never breaks across lines. */
  .trow .stub{flex:0 0 auto; width:auto}
  .trow .stub .time{flex:0 0 62px; text-align:center; padding:7px 4px 7px 8px}
  .tinfo{min-width:0; cursor:pointer; text-decoration:none; color:inherit; display:block;
         border-radius:3px}
  .tinfo b{display:block; font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tinfo small{color:var(--muted); font-size:.75rem}
  .tinfo small .room{white-space:nowrap}

  #stale{
    display:none; max-width:1060px; margin:12px auto 0; padding:10px 14px;
    border:1px solid var(--accent); background:var(--accent-soft); color:var(--ink);
    border-radius:10px; font-size:.85rem;
  }
  #partial{
    display:none; max-width:1060px; margin:12px auto 0; padding:10px 14px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:10px; font-size:.85rem;
  }
  @media (max-width:1100px){ #stale, #partial{margin:12px 20px 0} }

  footer{
    max-width:1100px; margin:0 auto; padding:20px 20px 24px; color:var(--muted);
    font-size:.75rem; border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:6px;
  }
  footer a{color:inherit}
  /* The per-source ages are a diagnostic. On a normal day they are eleven rows saying
     the same thing, so the summary carries the one bit that matters and the list sits
     behind a disclosure. <details> rather than a scripted toggle: it is keyboard
     operable and announced correctly without any code. */
  #fresh summary{
    cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px;
    width:fit-content; border-radius:4px;
  }
  #fresh summary::-webkit-details-marker{display:none}
  #fresh summary::after{content:'\25be'; font-size:.85em; opacity:.7}
  #fresh[open] summary::after{content:'\25b4'}
  #fresh summary:hover{color:var(--ink)}
  #fresh summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  #fresh summary.bad{color:var(--accent-text); font-weight:700}
  #sources{
    padding:8px 0 2px; display:flex; flex-wrap:wrap; gap:4px 10px; font-size:.72rem;
  }
  #sources .src{white-space:nowrap}
  #sources .src.bad{color:var(--accent-text); font-weight:700}
  /* The marker carries the degraded state on a row whose age is still fine, so it is
     the accent colour rather than dimmed. The row itself stays readable: the data is
     not old, one of its cinemas simply did not refresh. */
  #sources .part{color:var(--accent-text); cursor:help}
  #sources .src.part-bad{color:var(--ink)}
  #tagkey{
    max-width:1100px; margin:0 auto; padding:20px 20px 0; color:var(--muted);
    font-size:.72rem;
  }

  @media (max-width:560px){
    .poster{flex-basis:72px; width:72px; height:104px}
    .title{font-size:1.02rem}
    /* Venue picker and its star share one row; search gets the next. Setting the select to
       width:100% pushed the star onto a row of its own and wasted ~60px of height. */
    .controls{padding:10px 14px 8px; gap:8px}
    #areaSelect{max-width:none; flex:1 1 auto; width:auto; min-width:0}
    .fav{flex:0 0 auto; padding:8px 11px}
    .search{flex:1 1 100%; width:100%; min-width:0}
    /* Tighter vertical rhythm: the header used to fill most of a phone screen. */
    .bar{padding:10px 14px; gap:10px}
    .langseg button{padding:0 8px; font-size:.72rem; letter-spacing:.03em}
    .days{padding:0 14px 8px; gap:6px}
    .tools{padding:0 14px 10px; gap:6px}
    .day{padding:6px 1px}
    .day b{font-size:.8rem}
    .day small{font-size:.66rem; letter-spacing:0}
    /* 2px each side. Measured: with 11px the Anniskelu chip overflowed the row by
       exactly 6px and wrapped to a second line at 375px; at 9px the four chips and the
       segment fit on one, 335px of 347px usable. */
    .seg button, .chip{padding:6px 9px; font-size:.74rem}
    #tagkey{padding:14px 14px 0}
    footer{padding:14px 14px 18px}
  }
  /* 410, not 400, and the ten pixels are the whole of a bug. The label steps up from
     .6rem to .66rem above this line, but a .66rem "Huomenna" measures 53.43px and a chip
     does not offer that much until the viewport reaches 403px -- so 401 and 402 got the
     bigger font in a column still too narrow for it, and ellipsised. An iPhone 17 is 402
     CSS pixels wide and landed exactly in the gap. .6rem needs 48.57px and fits from
     374px up, so the smaller size carries the whole band below 410 with room to spare. */
  @media (max-width:410px){
    .day small{font-size:.6rem}
    .day b{font-size:.76rem}
    /* And a pixel out of the gap. At 375px -- iPhone SE, mini, and the narrowest
       common phone -- a 6px gap leaves "Huomenna" 48.83px against the 48.57px it needs:
       a quarter of a pixel, which is inside the rounding noise that produced this bug in
       the first place. 5px turns that margin into 1.10px and costs a pixel of air
       between chips on small screens only. */
    .days{gap:5px}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">Leffavuoro<span>.</span></div>
    <div class="spacer"></div>
    <div id="langSeg" class="langseg" role="group" aria-label="Kieli"></div>
    <button id="themeToggle" type="button" title="Vaihda teemaa" aria-label="Vaihda vaalean ja tumman teeman välillä">◐</button>
  </div>
  <div class="pinned">
  <div class="controls">
    <button id="areaSelect" type="button" aria-haspopup="dialog" aria-expanded="false"
            aria-label="Valitse teatteri"><span class="vlbl"></span><span class="vchev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5.2 7 9.2 11 5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
    <button id="favBtn" class="fav" aria-pressed="false" title="Oma teatteri">☆</button>
    <input class="search" id="search" type="search" placeholder="Etsi esim. Dune tai komedia" aria-label="Suodata elokuvia nimen tai genren mukaan">
  </div>
  <div class="days" id="days" role="group"></div>
  <div class="tools">
    <div class="seg" id="viewSeg" role="group">
      <button id="segMovies" class="on">Leffat</button><button id="segTimes">Ajat</button>
    </div>
    <button class="chip" id="chipLang">Suom. puhe</button>
    <button class="chip" id="chipKids">Lapsille</button>
    <button class="chip" id="chipAnnis">Anniskelu</button>
  </div>
  </div>
</header>

<div id="stale" role="status"></div>
<div id="partial" role="status"></div>

<div id="overlay"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" inert aria-hidden="true"></div>

<div id="vwrap" class="vwrap">
  <div class="vsheet" role="dialog" aria-modal="true" aria-label="Valitse teatteri">
    <div class="vhead">
      <span class="vfind">

    // the Finnish distributor title is the one on the ticket and on the cinema's page.

  // had to be clamped to the chip range on every rebuild, so once horizons ran months out
  // (Gilda into December) picking a far date and then reloading -- or just toggling the
  // language, which rebuilds the row -- silently landed on today+13 with an empty list and
  // nothing on screen to explain it. An old `dayIdx` pref is ignored, which falls back to

  function savedDay(){

    // but the saved date was inside somebody's horizon when it was picked, and a date past
    // this venue's own horizon already has its own empty state ("ohjelmistoa ei ole vielä

      const iso = addDays(base, i);
      const b = document.createElement('button');
      b.className = 'day'; b.type = 'button';
      const lbl = i===0 ? L[state.lang].today : (i===1 ? L[state.lang].tomorrow : fiDay[dowOf(iso)]);
      b.innerHTML = `<small>${lbl}</small><b>${dmOf(iso)}</b>`;
      b.onclick = () => { state.dateStr = iso; state.advanced = true; prefs.set({day:iso});
                          resetCalChip(); activate(b); loadSchedule(); };
      dayBtns[iso] = b;
      if(iso === saved){ b.classList.add('active'); b.setAttribute('aria-current', 'date');
                         state.dateStr = iso; }
      daysEl.appendChild(b);
    }
    // Calendar chip: opens the custom month picker (see openCal).
    // Not a tab under any reading: it opens the month picker, which is a dialog.
    const cal = document.createElement('button');
    cal.className = 'day'; cal.type = 'button';
    cal.setAttribute('aria-haspopup', 'dialog');
    cal.setAttribute('aria-expanded', 'false');
    cal.innerHTML = `<small>${L[state.lang].other}</small><b>📅</b>`;
    calChip = cal;
    cal.onclick = openCal;
    if(!dayBtns[saved]){
      state.dateStr = saved;
      cal.innerHTML = `<small>${fiDay[dowOf(saved)]}</small><b>${dmOf(saved)}</b>`;
      cal.classList.add('active');
    }
    daysEl.appendChild(cal);
  }

  /* ---------- month picker ---------- */
  // `dates` per venue is sparse (Gilda publishes 20 dates across 14 weeks), and a native
  // date input cannot disable individual days, so picking one was mostly a miss.
  const ymOf = iso => iso.slice(0, 7);
  const ymAdd = (ym, k) => {
    const [y, m] = ym.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1 + k, 1)).toISOString().slice(0, 7);
  };
  let calMonth = null;
  // The calendar chip shows the picked date while that date is the one being viewed, and
  // goes back to the 📅 face as soon as a quick chip takes over. Leaving the date on it
  // was a lie: the chip read "La 19.9." but tapping it opened the picker, because it is
  // the picker button, not a shortcut back to that date.
  function resetCalChip(){
    if(!calChip) return;
    calChip.innerHTML = `<small>${L[state.lang].other}</small><b>\u{1F4C5}</b>`;
    calChip.classList.remove('active');
  }
  // The picker declares role="dialog" aria-modal="true", and that is a promise, not a
  // style: the background has to be inert while it is open, focus has to move into it,
  // and closing has to hand focus back. It reuses the movie sheet's lifecycle (BEHIND /
  // setInert) rather than a second mechanism doing almost the same thing. Unlike the
  // sheet the wrap is created and removed per open, so there is no inert/aria-hidden
  // state to manage on the dialog itself.
  function closeCal(){
    const w = document.querySelector('.cal-wrap');
    if(w) w.remove();
    if(calChip) calChip.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', calKey);
    if(!w) return;                       // the cleanup call at the top of openCal
    BEHIND().forEach(el => setInert(el, false));
    // Back to the chip that opened it. selectDay mutates the existing chips rather
    // than rebuilding the row, so the node is still live on the date-picked path too.
    if(calChip && document.contains(calChip)) calChip.focus();
  }
  function calKey(e){ if(e.key === 'Escape'){ e.preventDefault(); closeCal(); } }
  function openCal(){
    closeCal();
    if(calChip) calChip.setAttribute('aria-expanded', 'true');
    const base = fiToday();
    const max = state.horizon || addDays(base, 13);
    calMonth = ymOf(state.dateStr > base ? state.dateStr : base);
    const wrap = document.createElement('div');
    wrap.className = 'cal-wrap';
    wrap.innerHTML = '<div class="cal" role="dialog" aria-modal="true" aria-labelledby="calTitle"></div>';
    wrap.addEventListener('click', e => { if(e.target === wrap) closeCal(); });
    document.body.appendChild(wrap);
    document.addEventListener('keydown', calKey);
    drawCal(base, max);
    BEHIND().forEach(el => setInert(el, true));
    const first = wrap.querySelector('button.cal-day.sel')
               || wrap.querySelector('button.cal-day')
               || wrap.querySelector('.cal-nav:not([disabled])');
    if(first) first.focus();
  }
  // --- calCell: pure, extracted verbatim by tests/cal_cell_harness.js ---
  // The selected day used to be the `sel` class and nothing else, so the chosen date was
  // visible and nowhere in the accessibility tree: a screen reader read the grid as
  // "1, 2, 3" with no way to hear which one is current. The day chips outside the picker
  // already say `aria-current="date"`, so the calendar now says the same thing.
  //
  // Only on the button. A day with no showtimes renders as a <span>, is not a control and
  // cannot be the selected date, so marking it current would announce a state for
  // something that has none.
  function calCell(d, iso, has, selIso){
    const sel = iso === selIso;
    const cls = 'cal-day' + (has ? ' has' : ' off') + (sel ? ' sel' : '');
    return has
      ? `<button class="${cls}" data-day="${iso}"${sel ? ' aria-current="date"' : ''}>${d}</button>`
      : `<span class="${cls}">${d}</span>`;
  }
  // --- end calCell ---

  function drawCal(base, max){
    const el = document.querySelector('.cal');
    if(!el) return;
    // No dates loaded yet: allow the whole range rather than locking the user out.
    const avail = (Array.isArray(state.dates) && state.dates.length) ? new Set(state.dates) : null;
    const [y, m] = calMonth.split('-').map(Number);
    const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;   // Monday first
    const title = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString(
      { fi:'fi-FI', sv:'sv-FI', en:'en-GB' }[state.lang], { month:'long', year:'numeric', timeZone:'UTC' });
    const dow = [1,2,3,4,5,6,0].map(i => `<span class="cal-dow">${fiDay[i]}</span>`).join('');
    let cells = '';
    for(let i = 0; i < lead; i++) cells += '<span class="cal-day pad"></span>';
    for(let d = 1; d <= days; d++){
      const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const has = iso >= base && iso <= max && (!avail || avail.has(iso));
      cells += calCell(d, iso, has, state.dateStr);
    }
    const prevOk = ymAdd(calMonth, -1) >= ymOf(base);
    const nextOk = ymAdd(calMonth, 1) <= ymOf(max);
    el.innerHTML = `<div class="cal-head">
        <button class="cal-nav" type="button" data-mon="-1"${prevOk ? '' : ' disabled'} aria-label="${esc(L[state.lang].aPrevMonth)}">&lsaquo;</button>
        <b id="calTitle">${title}</b>
        <button class="cal-nav" type="button" data-mon="1"${nextOk ? '' : ' disabled'} aria-label="${esc(L[state.lang].aNextMonth)}">&rsaquo;</button>
      </div>
      <div class="cal-grid">${dow}${cells}</div>
      ${avail ? `<small class="cal-note">${L[state.lang].onlyDays}</small>` : ''}`;
    el.onclick = e => {
      const nav = e.target.closest('.cal-nav');
      if(nav && !nav.disabled){
        const dir = nav.dataset.mon;
        calMonth = ymAdd(calMonth, +dir); drawCal(base, max);
        // The redraw replaced the node under focus, which would drop focus to <body>
        // with the background inert. Same direction if it is still enabled, else the
        // other arrow, else a day.
        const next = el.querySelector(`.cal-nav[data-mon="${dir}"]:not([disabled])`)
                  || el.querySelector('.cal-nav:not([disabled])')
                  || el.querySelector('button.cal-day');
        if(next) next.focus();
        return;
      }
      const day = e.target.closest('[data-day]');
      if(day){ closeCal(); selectDay(day.dataset.day); }
    };
  }

  // Each provider updates on its own schedule, so show every source's age. A scraper that
  // silently stops is otherwise invisible unless you happen to pick one of its venues.
  const STALE_H = 8;
  // The route a cinema uses to ask a question or to be taken out. The pipeline's
  // User-Agent points every provider at this site, so the site has to answer. Plain
  // text on purpose: obfuscating it against scrapers also hides it from the reader it
  // exists for, and a contact route nobody can copy is not one.
  const CONTACT = 'leffavuoro@gmail.com';
  // AGPL section 13 makes a network-deployed *modified* version offer its source, so
  // this is not an obligation on the original. It is here because the clause is
  // toothless without an example: a forker who never saw a source link has no idea one
  // is expected. The licence's own how-to-apply text suggests exactly this for a web
  // application.
  const SOURCE_URL = 'https://github.com/Shady-Dev/kino';
  const LICENCE = 'AGPL-3.0';
  function ageHours(iso){
    const t = iso ? new Date(iso).getTime() : NaN;
    return isNaN(t) ? null : (Date.now() - t) / 36e5;
  }
  // --- healthState: pure, extracted verbatim by tests/health_state_harness.js ---
  // Age alone was the whole test, so a provider that failed to refresh one venue read as
  // healthy for as long as the venue it kept was under STALE_H -- the summary said every
  // source was up to date while the expanded row beside it said (1/12). A partial refresh
  // is a degraded state the moment it happens, independent of how old the retained data
  // is, because it is a statement about *this run* rather than about the data's age.
  //
  // Order is by severity, and `behind` outranks `partial`: a provider that is both has
  // the worse problem, and saying so twice in one summary line would not fit anyway.
  // `partial` is kept distinct from `behind` rather than folded into it, because data two
  // hours old is not behind and calling it that is the kind of false alarm that teaches
  // people to ignore the line.
  // `pending` sits below `partial`, and only the adapter can grant it: run.py writes a
  // venue into `pending` only when the module vouches that its empty answer is positive
  // evidence (EMPTY_VENUES_CONFIRMED) -- a cinema with no programme at the moment, one
  // that has not started, like Kino Metso Tikkakoski publishing into late October from
  // day one, or a touring cinema's town between visits, like Muurame the day after its
  // last screening (since 2026-09-05; before that an ended programme was kept and read
  // "did not refresh" for weeks). A month of that over a quiet town would be the false
  // alarm that teaches people to ignore the line. `unverified` stays partial: run.py
  // cannot tell "added before its programme" from "a parse that has never worked", and
  // the ambiguous case must stay visible.
  function healthState(m, ageH){
    if(!m) return 'gone';
    if(m.gone) return 'gone';
    if(ageH === null || ageH > STALE_H) return 'behind';
    if(m.stale > 0 || m.unverified > 0 || m.status === 'partial') return 'partial';
    if(m.pending > 0) return 'pending';
    return 'ok';
  }
  // --- end healthState ---
  function renderHealth(){
    const el = document.querySelector('#sources');
    if(!el) return;
    const names = Object.keys(providerMeta);
    if(!names.length){ el.textContent = ''; return; }
    const state_ = {};
    const parts = names.map(p => {
      const m = providerMeta[p], h = ageHours(m.oldest || m.generated);
      const st = healthState(m, h);
      state_[p] = st;
      const nm = esc((SOURCE[p] || [p])[0]);
      // Its venue file did not load at all. Distinct from `?`, which means a file
      // arrived carrying a timestamp that could not be read.
      if(st === 'gone') return `<span class="src bad">\u26a0 ${nm} ${L[state.lang].unavailable}</span>`;
      if(h === null) return `<span class="src bad">${nm} ?</span>`;
      const cls = st === 'behind' ? 'src bad' : (st === 'partial' ? 'src part-bad' : 'src');
      const mark = st === 'behind' ? '\u26a0 ' : '';
      // Without this a chain whose age comes from one stale cinema reads as if the
      // whole chain were down. The count says how many venues are not fully live, and
      // the title names each kind by what is true of it -- stale, never-yet-answered
      // and not-yet-programmed are three different facts, not one "did not refresh".
      const T = L[state.lang];
      const nS = m.stale || 0, nU = m.unverified || 0, nP = m.pending || 0;
      const n = nS + nU + nP;
      const kinds = [];
      if(nS) kinds.push(T.partialOf.replace('{n}', nS).replace('{m}', m.venues));
      if(nU) kinds.push(T.unverifiedOf.replace('{n}', nU).replace('{m}', m.venues));
      if(nP) kinds.push(T.pendingOf.replace('{n}', nP).replace('{m}', m.venues));
      const part = n
        ? ` <span class="part" title="${esc(kinds.join(' \u00b7 '))}">(${n}/${m.venues})</span>`
        : '';
      return `<span class="${cls}">${mark}${nm} ${Math.round(h)}${T.hours}${part}</span>`;
    });
    // The key lives here rather than under the chain legend: it is reference material,
    // not something to scan past on the way to a showtime, and the word it decodes is
    // already on the card, in the times meta line and in the sheet. A second key row
    // above the list read as clutter.
    el.innerHTML = parts.join(' · ');

    // The summary names the sources that are behind rather than counting them. A count
    // makes you open the disclosure to learn anything; a name is the answer. Truncated
    // past three, because at that point the shape of the problem is "most of them" and
    // the list is one click away.
    const nameOf = p => (SOURCE[p] || [p])[0];
    const behind = names.filter(p => state_[p] === 'behind' || state_[p] === 'gone').map(nameOf);
    const partial = names.filter(p => state_[p] === 'partial').map(nameOf);
    const pending = names.filter(p => state_[p] === 'pending');
    const sum = document.querySelector('#freshSum');
    if(sum){
      const T = L[state.lang];
      const list = xs => xs.slice(0, 3).join(', ') + (xs.length > 3 ? ` +${xs.length - 3}` : '');
      if(behind.length){
        sum.textContent = `\u26a0 ${T.behind}: ${esc(list(behind))}`;
        sum.className = 'bad';
      } else if(partial.length){
        // Named separately rather than folded into `behind`. The data is not old; one of
        // this chain's cinemas did not refresh on the last run, which is a different
        // thing and deserves different words.
        sum.textContent = `\u26a0 ${T.partialSources}: ${esc(list(partial))}`;
        sum.className = 'bad';
      } else if(pending.length){
        // Quiet, no warning mark: the fetch is fresh and the adapter confirmed the
        // programme has not started. Named by venue rather than chain, because "Kino
        // Metso" reads as the whole chain when only Tikkakoski is waiting on its
        // October premiere.
        const vnames = pending.flatMap(p => (providerMeta[p].pendingIds || []))
          .map(id => (venueIndex[id] && venueIndex[id].label) || id);
        sum.textContent = `${T.noProgYet}: ${list(vnames)}`;
        sum.className = '';
      } else {
        sum.textContent = T.allFresh.replace('{m}', names.length);
        sum.className = '';
      }
    }
    const tk = document.querySelector('#tagkey');
    if(tk) tk.innerHTML = tagKey(state.shows || []);
  }

  // Format the cheapest positive price, preserving a provider-supplied floor.
  // --- priceLabel: pure, extracted verbatim by tests/price_label_harness.js ---
  // parseFloat reads a leading number and nothing else, so a provider that publishes
  // its own floor -- Cinema Orion writes "alkaen 10\u20ac" -- came back NaN, was filtered
  // out as unpriced, and rendered no price at all. That was 23 of Orion's 29
  // price-bearing showtimes on 2026-09-01, and the six that did show were the ones
  // whose string happened to start with a digit.
  //
  // Two separate questions, and the old code only asked one. *What* the cheapest price
  // is: the first number anywhere in the string, because no price string in the
  // committed data carries a second one (checked across all 1043). And *whether* it is
  // a floor: either this row list holds two different amounts, or a source string says
  // so itself. The second test is on shape rather than on the word -- whatever is left
  // once the number, the currency and the spacing are gone -- because the word is in
  // the provider's language and there are three of those.
  //
  // The sign is inside the match on purpose. Leaving it out let "-5\u20ac" match as 5 and
  // pass the `v > 0` guard the old code used it for, turning a rejected price into an
  // accepted one; a test caught that, reading the diff did not.
  function priceLabel(rows){
    let floor = false;
    const vals = [];
    for(const r of rows){
      const raw = String(r.price || '').replace(',', '.');
      const m = raw.match(/[-+]?\d+(?:\.\d+)?/);
      if(!m) continue;
      const v = parseFloat(m[0]);
      if(isNaN(v) || v <= 0) continue;
      if(/[^\d\s.,\u20ac$\u00a3]/.test(raw.replace(m[0], ''))) floor = true;
      vals.push(v);
    }
    if(!vals.length) return '';
    const lo = Math.min(...vals), hi = Math.max(...vals);
    // Finnish typography: a comma decimal and a non-breaking space before the sign,
    // "10,50 €". Swedish and English keep the source's "10.50€".
    const fi = state.lang === 'fi';
    const fmt = v => {
      const n = Math.round(v * 100) % 100 === 0 ? String(Math.round(v)) : v.toFixed(2);
      return fi ? n.replace('.', ',') + '\u00a0\u20ac' : n + '\u20ac';
    };
    return (lo === hi && !floor) ? fmt(lo) : `${L[state.lang].from} ${fmt(lo)}`;
  }
  // --- end priceLabel ---

  const favBtn = $('#favBtn');
  // Nothing about a bare star says "this venue opens next time", so label it until the
  // user has set one. Short label on phones, full sentence on desktop.
  function syncFav(){
    const t = L[state.lang];
    const anyFav = !!prefs.get().fav;
    const on = prefs.get().fav === state.area;
    const label = window.matchMedia('(max-width:560px)').matches ? t.favCta : t.favCtaLong;
    favBtn.innerHTML = on
      ? '\u2605'
      : (anyFav ? '\u2606' : `\u2606 <span class="fav-cta">${label}</span>`);
    favBtn.classList.toggle('labelled', !on && !anyFav);
    favBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    favBtn.title = on ? t.favOn : t.favOff;
    favBtn.setAttribute('aria-label', on ? t.favOn : t.favOff);
  }
  favBtn.onclick = () => {
    const on = prefs.get().fav === state.area;
    prefs.set({ fav: on ? '' : state.area });
    syncFav();
  };

  function netErrorHtml(e){
    return `<div class="status">${L[state.lang].loadFail}<br><small>${esc(e.message||e)}</small></div>`;
  }
  // --- url sinks: pure, extracted verbatim by tests/safe_url_harness.js ---
  // A URL parser deletes ASCII tab, LF and CR from anywhere in a URL and strips the
  // control characters off its ends, so the string a browser follows is not always the
  // string tested here. `java<LF>script:alert(1)` carries no scheme past the match
  // below -- `[a-z0-9+.-]*` stops at the LF -- so it was returned as a scheme-less
  // relative URL and resolved to javascript: on the click. Four payloads got in that
  // way: LF, CR, tab, and a leading NUL, which `trim()` does not remove either.
  // Rejected rather than stripped clean: cleaning would have to reproduce the parser's
  // removal rules exactly for the tested string and the emitted one to stay the same
  // string, and being wrong about that is how this hole opened in the first place.
  // No provider URL has ever carried one -- `trim()` still absorbs the stray newline
  // an adapter leaves on the end.
  const CTRL = /[\u0000-\u001F\u007F]/;
  // Every provider string crosses an innerHTML boundary somewhere, and every adapter
  // strips tags *then* unescapes, so a source page's entities arrive here as live HTML
  // metacharacters -- a stored-XSS surface fed by nine third-party sites, and a rendering
  // bug on harmless titles ("Movie &lt;3"). Escape at the sink, never in the adapters:
  // the verbatim title is the key for normTitle(), films-extra.json and tmdb-aliases.
  const esc = v => String(v ?? '').replace(/[&<>"']/g,
    ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  // href/src values also come from provider JSON. esc() stops attribute breakout; this
  // additionally rejects any scheme that is not http(s), so a hostile booking URL cannot
  // be javascript: or data:. Scheme-less (repo-relative poster paths) stays allowed.
  // Two different questions, and one answer was being used for both. A ticket or
  // trailer URL is *meant* to leave this origin, so http(s) and relative are all fine.
  // A poster is not: an <img> is a request the browser makes on its own, and the
  // README's claim that a page load makes no third-party requests rests on every
  // poster being local. safeUrl said yes to `https://third-party/x.jpg` in both roles.
  const safeUrl = u => {
    u = String(u || '').trim();
    if(!u) return '';
    if(CTRL.test(u)) return '';
    const m = u.match(/^([a-z][a-z0-9+.\-]*):/i);
    return (!m || /^https?$/i.test(m[1])) ? esc(u) : '';
  };
  // Same-origin, and inside the mirror directory. Deliberately a path allowlist rather
  // than an origin check: `mirror_posters.py` leaves a hot-linked URL in the data when a
  // download fails, on purpose, so that a third party's uptime cannot stop the pipeline
  // publishing showtimes. That makes the privacy invariant something the client has to
  // hold on its own rather than something it inherits from the pipeline behaving. Every
  // poster reference in the committed data is `data/posters/` today (3157 of them,
  // counted 2026-08-30), so the rule costs nothing and catches the day one is not.
  const ASSET_DIR = 'data/posters/';
  const safeAssetUrl = u => {
    u = String(u || '').trim();
    if(!u) return '';
    if(CTRL.test(u)) return '';
    if(/^[a-z][a-z0-9+.\-]*:/i.test(u) || u.startsWith('//')) return '';
    return u.replace(/^\.?\//, '').startsWith(ASSET_DIR) ? esc(u) : '';
  };
  // --- end url sinks ---
  const jsonCache = {};
  let lastLoad = 0;      // when the schedule last came off the network; see refreshAll
  const FETCH_MS = 8000;
  // Boot-time speculation: every URL the boot will need is derivable before any
  // response arrives, so those requests can start in parallel instead of in three
  // serial waves (providers -> venue lists -> schedule). A prefetched promise is
  // consumed once by the fetchJSON call that would have made the same request; a
  // wrong guess (venue changed on another device, stale city ids) is one wasted
  // request and the normal path fetches as before.
  const prefetched = new Map();
  function prefetch(path){
    if(prefetched.has(path)) return;
    const p = fetchJSON(path);
    p.catch(() => {});            // not consumed is not an error
    prefetched.set(path, p);
  }

  async function fetchJSON(path){
    if(prefetched.has(path)){
      const p = prefetched.get(path);
      prefetched.delete(path);
      return p;
    }
    // No cache-buster: GitHub Pages serves max-age=600 and data updates 4x/day, so a
    // schedule up to 10 min stale is immaterial and the stale banner covers the
    // pathological case. The buster made every fetch a unique URL, so the SW cached a
    // fresh copy of every file per app open (tens of MB on a phone, evicted only on a
    // CACHE bump) and the HTTP cache never served anything.
    //
    // fetch() has no timeout of its own, so a connection that opens and then stalls --
    // the normal shape of a phone leaving coverage -- never settles and never rejects:
    // the spinner spins until the app is closed, with no error and nothing to retry.
    // Abort at FETCH_MS so the catch in the caller can draw netErrorHtml instead.
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), FETCH_MS);
    try {
      const r = await fetch(path, { signal: ac.signal });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally {
      clearTimeout(t);
    }
  }

  const LANGS = ['fi','sv','en'];
  // Swedish names for the cities we cover. Display only: cityGroups is keyed by the
  // Finnish name and so is the `city:` value in prefs and in the ?area= links the
  // generated pages carry, so translating the key would break every deep link. Cities
  // with no established Swedish name keep the Finnish one, which is also what
  // Finland-Swedish usage does for monolingual municipalities.
  const CITY_SV = {
    Espoo:'Esbo', Helsinki:'Helsingfors', Hyvinkää:'Hyvinge', Hämeenlinna:'Tavastehus',
    Iisalmi:'Idensalmi', Kajaani:'Kajana', Kokkola:'Karleby', Lahti:'Lahtis',
    Lappeenranta:'Villmanstrand', Oulu:'Uleåborg', Pietarsaari:'Jakobstad',
    Pori:'Björneborg', Porvoo:'Borgå', Raisio:'Reso', Savonlinna:'Nyslott',
    Tampere:'Tammerfors', Tornio:'Torneå', Turku:'Åbo', Vaasa:'Vasa', Vantaa:'Vanda'
  };
  const cityLabel = c => (state.lang === 'sv' && CITY_SV[c]) || c;

  // Sorting followed Finnish collation in every language, which was a recorded gap for
  // English and would have been a worse one for Swedish. One collator per language,
  // rebuilt on switch. Measured as free: Intl.Collator and localeCompare cost the same
  // on a 45-title sort, V8 caches it either way.
  const COLLATE = { fi:'fi', sv:'sv-FI', en:'en' };
  let coll = new Intl.Collator(COLLATE.fi);

  // Finnkino names carry the city as the last word ("Plevna Tampere"); BioRex ships city
  // explicitly. Group by city, since people pick a place before they pick a chain.
  function cityOf(a){
    if(a.city) return a.city;
    const w = (a.name || '').trim().split(/\s+/);
    return w.length > 1 ? w[w.length-1] : (a.name || '');
  }
  // "Itis Helsinki" never says Finnkino, so prefix the chain and drop the city -- the
  // optgroup label already carries the city. BioRex names are already chain-prefixed.
  // Every provider-specific string and colour comes from data/providers.json, which
  // the pipeline generates from scripts/providers/registry.py. Adding a provider is a
  // registry entry plus an adapter: no edit in this file. The fallback keeps the app
  // usable when that file is missing (first deploy, or an old service worker).
  const PROV_FALLBACK = [
    { id:'finnkino',     label:'Finnkino',      host:'finnkino.fi',       accent:'#E4551F', book:'buy' },
    { id:'biorex',       label:'BioRex',        host:'biorex.fi',         accent:'#1273D4', book:'buy' },
    { id:'kinoset',      label:'Kinoset',       host:'kinoset.fi',        accent:'#0E9B63', book:'reserve' },
    { id:'kotkanleffat', label:'Kotkan Leffat', host:'kotkanleffat.fi',   accent:'#C42749', book:'buy' },
    { id:'riviera',      label:'Riviera',       host:'rivieracinemas.fi', accent:'#0C6464', book:'buy' },
    { id:'gilda',        label:'Gilda',         host:'gilda.fi',          accent:'#D62D8F', book:'buy' },
    { id:'savonkinot',   label:'Savon Kinot',   host:'savonkinot.fi',     accent:'#0C8FA8', book:'buy' },
    { id:'orion',        label:'Cinema Orion',  host:'cinemaorion.fi',    accent:'#4E7A16', book:'buy' },
    { id:'engel',        label:'Kino Engel',    host:'kinoengel.fi',      accent:'#B47ACC', book:'buy' },
    { id:'biorexkokkola',label:'Bio Rex Kokkola',host:'biorex.org',       accent:'#006655', book:'buy' },
    { id:'kinoakseli',   label:'Kino Akseli',   host:'kinoakseli.fi',     accent:'#B8801A', book:'door' }
  ];
  let PROVIDERS = [];
  const CHAIN = {}, SOURCE = {}, BOOK = {};
  function applyProviders(list){
    PROVIDERS = (Array.isArray(list) && list.length) ? list : PROV_FALLBACK;
    for(const o of [CHAIN, SOURCE, BOOK]) for(const k of Object.keys(o)) delete o[k];
    for(const p of PROVIDERS){
      if(!p || !p.id) continue;
      CHAIN[p.id] = p.label || p.id;
      SOURCE[p.id] = [p.label || p.id, p.host || ''];
      BOOK[p.id] = p.book || 'buy';
    }
    let el = document.getElementById('chainpal');
    if(!el){ el = document.createElement('style'); el.id = 'chainpal'; document.head.appendChild(el); }
    el.textContent = PROVIDERS.filter(p => p && p.id && p.accent)
      .map(p => `.chain-${p.id}{--chain:${p.accent}}`).join('');
  }
  applyProviders(null);
  async function loadProviders(){
    try { applyProviders((await fetchJSON('data/providers.json')).providers); }
    catch(_){ applyProviders(null); }   // fallback already applied; stay quiet
  }
  function shortOf(a){
    if(a.short) return a.short;
    const city = cityOf(a);
    const n = (a.name || '').trim();
    return n.endsWith(' ' + city) ? n.slice(0, -(city.length + 1)).trim() : n;
  }
  function labelOf(a){
    const chain = CHAIN[a.provider] || '';
    const short = shortOf(a);
    return (chain && !short.startsWith(chain)) ? `${chain} ${short}` : short;
  }
  // Split out of fillAreaSelect: the language toggle has to relabel the picker
  // ("Kaikki Helsinki" / "All in Helsinki") without resetting the selected venue.
  function buildAreaOptions(){
    const byCity = new Map();
    for(const a of allVenues){
      const c = cityOf(a);
      if(!byCity.has(c)) byCity.set(c, []);
      byCity.get(c).push(a);
    }
    cityOrder = [...byCity.keys()].sort((x,y)=>coll.compare(cityLabel(x), cityLabel(y)));
    cityGroups = {};
    cityVenues = {};
    for(const c of cityOrder){
      cityVenues[c] = byCity.get(c).slice().sort((x,y)=>coll.compare(labelOf(x), labelOf(y)));
      cityGroups[c] = cityVenues[c].map(a => a.id);
    }
    syncVenueBtn();
  }

  /* ---------- venue picker ---------- */
  // The old control was a native <select>: free platform UI, but nowhere to hang a
  // search field over 70 venues. The trigger keeps the select's face and its place in
  // the row; the list is a dialog on the same modal lifecycle as the movie sheet and
  // the month picker (BEHIND/inert). Cities with more than one screen keep their
  // combined entry at the top of their group, exactly as the optgroups had it.
  const vwrap = $('#vwrap'), vlist = $('#vlist'), vq = $('#vq'), vnone = $('#vnone');
  // --- venue picker model: pure, extracted verbatim by tests/venue_picker_harness.js ---
  // NFD + strip combining marks: "jarvela" finds Järvelä. The stripped string is the
  // same length as the NFC original, so match offsets index the original for <mark>.
  function vfold(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function vhl(label, q, esc){
    if(!q) return esc(label);
    const i = vfold(label).indexOf(vfold(q));
    if(i < 0) return esc(label);
    return esc(label.slice(0, i)) + '<mark>' + esc(label.slice(i, i + q.length))
         + '</mark>' + esc(label.slice(i + q.length));
  }
  // The flat list the sheet renders, decided away from the DOM so it can be tested.
  // ctx: {T, fav, area, cityOrder, cityVenues, venueIndex, labelOf, cityLabel, cityOf}.
  // Two rules Enter depends on, because Enter picks the FIRST row:
  // - A combined "Kaikki {city}" row appears only when nothing is searched or the query
  //   matches the row's own text or its city -- never merely because a venue in that
  //   city matched. Searching "itis" must put Finnkino Itis first, not Kaikki Helsinki.
  // - A venue matches on its label, its raw city name and the display city name, so in
  //   Swedish both "Turku" and "Åbo" find a Turku venue.
  function venueRows(q, ctx){
    const T = ctx.T;
    const allLabel = c => `${T.allIn.replace('{city}', ctx.cityLabel(c))} (${ctx.cityVenues[c].length})`;
    const hitAll = c => !q || vfold(`${allLabel(c)} ${c}`).includes(vfold(q));
    const hitVenue = (a, c) =>
      !q || vfold(`${ctx.labelOf(a)} ${c} ${ctx.cityLabel(c)}`).includes(vfold(q));
    const rows = [];
    const fav = ctx.fav;
    if(fav && fav.startsWith('city:')){
      const c = fav.slice(5);
      if((ctx.cityVenues[c] || []).length > 1 && hitAll(c)){
        rows.push({kind:'head', text:T.vOwn});
        rows.push({kind:'all', id:fav, label:allLabel(c), current:ctx.area === fav});
      }
    } else if(fav && ctx.venueIndex[fav]){
      const a = ctx.venueIndex[fav];
      if(hitVenue(a, ctx.cityOf(a))){
        rows.push({kind:'head', text:T.vOwn});
        rows.push({kind:'venue', id:a.id, provider:a.provider,
                   label:ctx.labelOf(a), current:ctx.area === a.id});
      }
    }
    for(const c of ctx.cityOrder){
      const vs = ctx.cityVenues[c].filter(a => hitVenue(a, c));
      const showAll = ctx.cityVenues[c].length > 1 && hitAll(c);
      if(!vs.length && !showAll) continue;
      rows.push({kind:'head', text:ctx.cityLabel(c)});
      if(showAll) rows.push({kind:'all', id:'city:' + c, label:allLabel(c),
                             current:ctx.area === 'city:' + c});
      for(const a of vs) rows.push({kind:'venue', id:a.id, provider:a.provider,
                                    label:ctx.labelOf(a), current:ctx.area === a.id});
    }
    return rows;
  }
  // --- end venue picker model ---
  function vDraw(){
    const q = vq.value.trim();
    const rows = venueRows(q, {
      T: L[state.lang], fav: prefs.get().fav, area: state.area,
      cityOrder, cityVenues, venueIndex, labelOf, cityLabel, cityOf,
    });
    let html = '';
    for(const r of rows){
      if(r.kind === 'head'){ html += `<div class="vcity">${esc(r.text)}</div>`; continue; }
      const cls = r.kind === 'all' ? 'vrow vall' : `vrow chain-${esc(r.provider)}`;
      html += `<button class="${cls}" type="button" data-id="${esc(r.id)}"`
        + ` aria-current="${r.current ? 'true' : 'false'}">`
        + `<span class="vdot"></span><span class="vtxt">${vhl(r.label, q, esc)}</span></button>`;
    }
    vlist.innerHTML = html;
    vnone.classList.toggle('show', !html);
  }
  function vKey(e){
    if(e.key === 'Escape'){
      e.preventDefault();
      if(vq.value){ vq.value = ''; vDraw(); vq.focus(); } else closeVenueSheet();
      return;
    }
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      const rows = [...vlist.querySelectorAll('.vrow')];
      if(!rows.length) return;
      e.preventDefault();
      const i = rows.indexOf(document.activeElement);
      const j = i < 0 ? (e.key === 'ArrowDown' ? 0 : rows.length - 1)
                      : Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)));
      rows[j].focus();
    }
    if(e.key === 'Enter' && document.activeElement === vq){
      const first = vlist.querySelector('.vrow');
      if(first){ e.preventDefault(); first.click(); }
    }
  }
  function openVenueSheet(){
    if(!allVenues.length) return;
    vq.value = '';
    vDraw();
    vwrap.classList.add('open');
    areaSel.setAttribute('aria-expanded', 'true');
    BEHIND().forEach(el => setInert(el, true));
    document.addEventListener('keydown', vKey);

<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kino — Finnkino Schedule</title>
<meta name="theme-color" content="#0D0E12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --ink:#16181D; --muted:#5C6470;
    --line:#E3E6EB; --accent:#B8860B; --accent-soft:#F4E9CE;
    --chip-bg:#FFFFFF; --chip-hover:#16181D; --chip-hover-ink:#F6F7F9;
    --shadow:0 1px 3px rgba(22,24,29,.06);
    --past:#AEB4BE;
  }
  [data-theme="dark"]{
    --bg:#0D0E12; --surface:#16181F; --ink:#EDEDEA; --muted:#8B93A1;
    --line:#262A33; --accent:#E8B84B; --accent-soft:#2A2415;
    --chip-bg:#1C1F28; --chip-hover:#E8B84B; --chip-hover-ink:#0D0E12;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --past:#4A4F5A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    transition:background .25s,color .25s;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    transition:background .25s;
  }
  .bar{
    max-width:1100px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; gap:16px;
  }
  .logo{
    font-stretch:125%; font-weight:900; letter-spacing:.18em;
    text-transform:uppercase; font-size:1.05rem; user-select:none;
  }
  .logo span{color:var(--accent)}
  .bar .spacer{flex:1}
  #themeToggle{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    font-size:1rem; line-height:1; display:grid; place-items:center;
    transition:border-color .15s, transform .15s;
  }
  #themeToggle:hover{border-color:var(--accent); transform:rotate(15deg)}
  #themeToggle:focus-visible, .day:focus-visible, .stub:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ===== Controls ===== */
  .controls{
    max-width:1100px; margin:0 auto; padding:16px 20px 12px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  select, .search{
    font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; box-shadow:var(--shadow);
  }
  select{cursor:pointer; max-width:280px}

  /* themed dropdown on Chromium (progressive enhancement) */
  select, ::picker(select){appearance:base-select}
  ::picker(select){
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
    padding:6px; margin-top:6px;
  }
  select option{
    padding:9px 12px; border-radius:8px; font:inherit;
    background:var(--surface); color:var(--ink); cursor:pointer;
  }
  select option:hover, select option:focus{background:var(--accent-soft)}
  select option:checked{color:var(--accent); font-weight:700}
  select option::checkmark{color:var(--accent)}
  select optgroup{font:inherit; color:var(--muted); padding:6px 8px 2px}
  .search{flex:1; min-width:160px}
  .search::placeholder{color:var(--muted)}

  .days{
    max-width:1100px; margin:0 auto; padding:0 20px 16px;
    display:flex; gap:6px;
  }
  .day{
    flex:1 1 0; min-width:0; border:1px solid var(--line); background:var(--surface);
    border-radius:10px; padding:7px 2px; cursor:pointer; font:inherit;
    color:var(--muted); text-align:center; transition:all .15s;
    position:relative; overflow:hidden;
  }
  .day b{display:block; color:var(--ink); font-weight:700; font-size:.85rem; white-space:nowrap}
  .day small{font-size:.74rem; font-weight:600; letter-spacing:.01em; white-space:nowrap}
  .day input[type=date]{position:absolute; inset:0; opacity:0; width:100%; height:100%; border:0; padding:0}
  .day.active{background:var(--ink); border-color:var(--ink)}
  .day.active b{color:var(--bg)}
  .day.active small{color:var(--accent)}

  /* ===== Movie list ===== */
  main{max-width:1100px; margin:0 auto; padding:8px 20px 80px}
  .status{padding:60px 0; text-align:center; color:var(--muted)}
  .status .reel{
    width:34px;height:34px;margin:0 auto 16px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .movie{
    display:flex; gap:18px; padding:20px 0;
    border-bottom:1px solid var(--line);
  }
  .poster{
    flex:0 0 92px; width:92px; height:132px; border-radius:8px;
    object-fit:cover; background:var(--surface); box-shadow:var(--shadow);
  }
  .poster.blank{display:grid;place-items:center;font-weight:800;font-size:1.5rem;letter-spacing:.04em;border:1px solid var(--line)}
  .info{flex:1; min-width:0}
  .title{font-size:1.15rem; font-weight:800; line-height:1.25}
  .meta1{
    margin-top:7px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center;
    font-size:.82rem;
  }
  .meta2{
    margin-top:5px; color:var(--muted); font-size:.8rem;
    display:flex; flex-wrap:wrap; gap:4px 14px;
  }
  .rating, .fmt{
    display:inline-block; border:1px solid var(--line); border-radius:5px;
    padding:1px 7px; font-weight:700; font-size:.72rem; color:var(--ink);
    background:var(--surface);
  }
  .fmt{color:var(--muted); font-weight:600; letter-spacing:.05em; text-transform:uppercase}

  #langToggle{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    height:38px; padding:0 13px; border-radius:19px; cursor:pointer;
    font:inherit; font-weight:800; font-size:.78rem; letter-spacing:.08em;
  }
  #langToggle:hover{border-color:var(--accent)}
  .movie{cursor:pointer}

  #overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0;
    pointer-events:none; transition:opacity .25s; z-index:90}
  #sheet{position:fixed; left:0; right:0; bottom:0; max-height:86vh; overflow:hidden;
    display:flex; flex-direction:column;
    background:var(--bg); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; transform:translateY(102%);
    transition:transform .28s cubic-bezier(.3,.8,.3,1); z-index:100;
    padding:18px 0 0; max-width:720px; margin:0 auto;}
  body.sheet-open #overlay{opacity:1; pointer-events:auto}
  body.sheet-open #sheet{transform:none}
  @media (min-width:700px){
    #sheet{
      bottom:auto; top:50%; left:50%; right:auto;
      width:min(680px, 92vw); max-height:82vh;
      border:1px solid var(--line); border-radius:18px;
      box-shadow:0 24px 80px rgba(0,0,0,.45);
      transform:translate(-50%,-46%); opacity:0; pointer-events:none;
      transition:transform .22s ease, opacity .22s ease;
    }
    body.sheet-open #sheet{transform:translate(-50%,-50%); opacity:1; pointer-events:auto}
  }
  .sheet-close{position:absolute; top:12px; right:14px; width:34px; height:34px;
    border-radius:50%; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); font-size:1rem; cursor:pointer}
  .sheet-head{display:flex; gap:16px; align-items:flex-start;
    flex:0 0 auto; padding:0 20px 14px}
  .sheet-body{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; padding:0 20px 28px;
    border-top:1px solid var(--line)}
  .sheet-body > .syn:first-child{margin-top:14px}
  .sheet-head .poster{flex:0 0 104px; width:104px; height:150px}
  .sheet-title{font-size:1.25rem; font-weight:800; line-height:1.2; padding-right:36px}
  .syn{margin-top:14px; line-height:1.6; font-size:.92rem; color:var(--ink)}
  .trailer{display:inline-block; margin-top:12px; color:var(--accent); font-weight:700;
    text-decoration:none; font-size:.88rem}
  .sheet-days{margin-top:6px}
  .sheet-days h3{margin:16px 0 8px; font-size:.75rem; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em; font-weight:700}

  /* Ticket stubs — the signature */
  .stubs{margin-top:12px; display:flex; flex-wrap:wrap; gap:8px}
  .stub{
    --r:7px;
    display:inline-flex; align-items:center; text-decoration:none;
    background:var(--chip-bg); border:1px solid var(--line);
    border-radius:var(--r); box-shadow:var(--shadow);
    font-variant-numeric:tabular-nums;
    transition:background .15s,color .15s,border-color .15s,transform .1s;
    position:relative; overflow:hidden;
  }
  .stub .time{padding:7px 10px 7px 12px; font-weight:800; font-size:.92rem}
  .stub .aud{
    padding:7px 12px 7px 10px; font-size:.72rem; color:var(--muted);
    border-left:1px dashed var(--line); max-width:130px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* perforation notches */
  .stub::before,.stub::after{
    content:""; position:absolute; width:8px; height:8px; border-radius:50%;
    background:var(--bg); border:1px solid var(--line); left:var(--notch);
  }
  .stub::before{top:-5px}.stub::after{bottom:-5px}
  .stub:hover{background:var(--chip-hover); color:var(--chip-hover-ink); border-color:var(--chip-hover); transform:translateY(-1px)}
  .stub:hover .aud{color:var(--chip-hover-ink); opacity:.75}
  .stub.past{opacity:.45; pointer-events:none}
  .stub.sold{opacity:.55; pointer-events:none; filter:grayscale(1)}
  .stub.sold .time{text-decoration:line-through}
  .stub.past .time{color:var(--past)}

  .theatre-tag{color:var(--accent); font-weight:600}
  .tmdb{color:var(--accent); font-weight:700}

  .tools{
    max-width:1100px; margin:0 auto; padding:0 20px 14px;
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  .seg{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface)}
  .seg button{border:0; background:transparent; padding:7px 14px; font:inherit; font-size:.78rem; font-weight:700; color:var(--muted); cursor:pointer}
  .seg button.on{background:var(--ink); color:var(--bg)}
  .chip{border:1px solid var(--line); background:var(--surface); border-radius:999px;
    padding:7px 13px; font:inherit; font-size:.78rem; font-weight:600; color:var(--muted); cursor:pointer; transition:all .15s}
  .chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

  .trow{display:flex; align-items:center; gap:14px; padding:9px 0; border-bottom:1px solid var(--line)}
  .trow .stub{flex:0 0 158px; width:158px; min-width:0}
  .trow .stub .time{flex:0 0 62px; text-align:center; padding:7px 4px 7px 8px}
  .trow .stub .aud{flex:1 1 0; min-width:0; max-width:none; text-align:left}
  .tinfo{min-width:0; cursor:pointer}
  .tinfo b{display:block; font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tinfo small{color:var(--muted); font-size:.75rem}

  #stale{
    display:none; max-width:1060px; margin:12px auto 0; padding:10px 14px;
    border:1px solid var(--accent); background:var(--accent-soft); color:var(--ink);
    border-radius:10px; font-size:.85rem;
  }
  @media (max-width:1100px){ #stale{margin:12px 20px 0} }

  footer{
    max-width:1100px; margin:0 auto; padding:24px 20px; color:var(--muted);
    font-size:.75rem; border-top:1px solid var(--line);
  }
  #sources{
    max-width:1100px; margin:0 auto; padding:20px 20px 0; color:var(--muted);
    font-size:.72rem; display:flex; flex-wrap:wrap; gap:4px 10px;
  }
  #sources .src{white-space:nowrap}
  #sources .src.bad{color:var(--accent); font-weight:700}

  @media (max-width:560px){
    .poster{flex-basis:72px; width:72px; height:104px}
    .title{font-size:1.02rem}
    .controls{padding-top:12px}
    select{max-width:100%; width:100%}
    .search{width:100%; flex:auto}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">Kino<span>.</span></div>
    <div class="spacer"></div>
    <button id="langToggle" aria-label="Vaihda kieli">EN</button>
    <button id="themeToggle" title="Switch theme" aria-label="Switch light/dark theme">◐</button>
  </div>
  <div class="controls">
    <select id="areaSelect" aria-label="Choose theatre"></select>
    <input class="search" id="search" type="search" placeholder="Filter by title…" aria-label="Filter movies by title">
  </div>
  <div class="days" id="days" role="tablist" aria-label="Choose date"></div>
  <div class="tools">
    <div class="seg" role="tablist">
      <button id="segMovies" class="on">Leffat</button><button id="segTimes">Ajat</button>
    </div>
    <button class="chip" id="chipLang">Suom. puhe</button>
    <button class="chip" id="chipKids">Lapsille</button>
  </div>
</header>

<div id="stale" role="status"></div>

<div id="overlay"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>

<main id="main">
  <div class="status"><div class="reel"></div>Loading theatres…</div>
</main>

<div id="sources"></div>
<footer>Schedule data: Finnkino open XML API · Tap a showtime to open ticket purchase on finnkino.fi</footer>

<script>
(() => {
  const API = 'https://www.finnkino.fi/xml';
  const PROXIES = [
    ['direct',     u => u],
    ['cloudflare', u => 'https://test.cors.workers.dev/?' + encodeURIComponent(u)],
    ['allorigins', u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)],
    ['codetabs',   u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)]
  ];
  let attempts = [];
  const $ = s => document.querySelector(s);
  const main = $('#main'), areaSel = $('#areaSelect'), daysEl = $('#days'), searchEl = $('#search');

  let state = { area:null, dateStr:'', shows:[], filter:'', lang:'fi', view:'movies',
                fLang:false, fKids:false, dates:null, horizon:'', advanced:false };
  let films = null;
  async function ensureFilms(){
    if(films !== null) return;
    try{ films = (await fetchJSON('data/films.json')).films || {}; }
    catch(e){ films = {}; }
  }
  const L = {
    fi:{ today:'Tänään', other:'Muu', days:['Su','Ma','Ti','Ke','To','Pe','La'],
         filter:'Suodata nimellä…', trailer:'▶ Katso traileri', min:'min',
         movies:'Leffat', times:'Ajat', flang:'Suom. puhe', fkids:'Lapsille',
         tomorrow:'Huomenna', from:'alkaen', sources:'Lähteet', hours:'h',
         nomatch:'Yksikään elokuva ei vastaa suodattimia.',
         nomore:'Ei enää näytöksiä tänään.',
         noshows:'Ei näytöksiä tänä päivänä valitussa teatterissa.',
         notpublished:'Ohjelmistoa ei ole vielä julkaistu tälle päivälle.' },
    en:{ today:'Today', other:'Other', days:['Su','Mo','Tu','We','Th','Fr','Sa'],
         filter:'Filter by title…', trailer:'▶ Watch trailer', min:'min',
         movies:'Movies', times:'By time', flang:'Finnish audio', fkids:'Kids',
         tomorrow:'Tomorrow', from:'from', sources:'Sources', hours:'h',
         nomatch:'No movies match your filters.',
         nomore:'No more shows today.',
         noshows:'No shows for this day at the selected theatre.',
         notpublished:'The schedule for this day has not been published yet.' }
  };
  const LN = {
    fi:{FI:'suom.', EN:'engl.', SE:'ruots.', JA:'jap.', FR:'ransk.'},
    en:{FI:'Finnish', EN:'English', SE:'Swedish', JA:'Japanese', FR:'French'}
  };
  const LW = { fi:{A:'puhe', S:'tekstit'}, en:{A:'audio', S:'subs'} };
  function langTxt(code){
    if(!code) return '';
    return code.split(/,\s*/).map(c => {
      const m = c.match(/^([A-Z]{2}(?:-[A-Z]{2})?)-(A|S)$/);
      if(!m) return '';
      const parts = m[1].split('-').map(x => (LN[state.lang][x] || x)).join('/');
      return parts + ' ' + LW[state.lang][m[2]];
    }).filter(Boolean).join(', ');
  }
  const disp = m => {
    if(state.lang === 'en' && films && films[m.eventId]){
      const f = films[m.eventId];
      return (f.t && f.t.en) || f.o || m.title;
    }
    return m.title;
  };

  /* ---------- theme ---------- */
  const store = { get k(){ try{return localStorage.getItem('kino-theme')}catch(e){return null} },
                  set k(v){ try{localStorage.setItem('kino-theme',v)}catch(e){} } };
  const applyTheme = t => document.documentElement.setAttribute('data-theme', t);
  applyTheme(store.k || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('#themeToggle').onclick = () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next); store.k = next;
  };

  /* ---------- fetch helpers (direct first, CORS proxy fallback) ---------- */
  async function fetchXML(url, expectTag){
    attempts = [];
    for(const [name, wrap] of PROXIES){
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 8000);
        const r = await fetch(wrap(url), { signal: ctrl.signal });
        clearTimeout(timer);
        if(!r.ok) throw new Error('HTTP ' + r.status);
        const text = await r.text();
        const doc = new DOMParser().parseFromString(text, 'text/xml');
        if(doc.querySelector('parsererror')) throw new Error('invalid XML');
        if(expectTag && !doc.querySelector(expectTag)) throw new Error('unexpected content');
        return doc;
      } catch(e){
        attempts.push(`${name} — ${e.name === 'AbortError' ? 'timeout' : (e.message || e)}`);
      }
    }
    throw new Error('all sources failed');
  }
  const txt = (node, tag) => { const n = node.querySelector(tag); return n ? n.textContent : ''; };

  /* ---------- persisted prefs ---------- */
  const prefs = {
    get(){ try{ return JSON.parse(localStorage.getItem('kino-prefs')||'{}'); }catch(e){ return {}; } },
    set(p){ try{ localStorage.setItem('kino-prefs', JSON.stringify(Object.assign(prefs.get(), p))); }catch(e){} }
  };

  /* ---------- date chips ---------- */
  let fiDay = L[state.lang].days;
  let calInput = null, calChip = null, dayBtns = {}, venueIndex = {}, providerMeta = {};
  const FI_TZ = 'Europe/Helsinki';
  const fiDayFmt  = new Intl.DateTimeFormat('sv-SE', { timeZone: FI_TZ });
  const fiTimeFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: FI_TZ, hour:'2-digit', minute:'2-digit' });
  const fiDate = d => fiDayFmt.format(d);            // Date -> 'YYYY-MM-DD' in Finland
  const fiTime = d => fiTimeFmt.format(d);           // Date -> 'HH:MM'  in Finland
  const fiToday = () => fiDate(new Date());
  const addDays = (iso, n) => { const t = new Date(iso + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
  const dowOf = iso => new Date(iso + 'T12:00:00Z').getUTCDay();
  const dmOf  = iso => { const [,m,d] = iso.split('-'); return `${+d}.${+m}.`; };
  const diffDays = (a,b) => Math.round((new Date(b+'T12:00:00Z') - new Date(a+'T12:00:00Z')) / 864e5);
  function buildDays(){
    daysEl.innerHTML = '';
    const base = fiToday();
    const savedIdx = Math.min(Math.max(prefs.get().dayIdx|0, 0), 13);
    const activate = el => { [...daysEl.children].forEach(c=>c.classList.remove('active')); el.classList.add('active'); };
    dayBtns = {};
    for(let i=0;i<5;i++){
      const iso = addDays(base, i);
      const b = document.createElement('button');
      b.className = 'day'; b.role = 'tab';
      const lbl = i===0 ? L[state.lang].today : (i===1 ? L[state.lang].tomorrow : fiDay[dowOf(iso)]);
      b.innerHTML = `<small>${lbl}</small><b>${dmOf(iso)}</b>`;
      b.onclick = () => { state.dateStr = iso; state.advanced = true; prefs.set({dayIdx:i}); activate(b); loadSchedule(); };
      dayBtns[iso] = b;
      if(i===savedIdx){ b.classList.add('active'); state.dateStr = iso; }
      daysEl.appendChild(b);
    }
    // calendar chip: native date picker, horizon = today..+6 (pipeline range)
    const cal = document.createElement('button');
    cal.className = 'day'; cal.role = 'tab';
    const calLabel = () => `<small>${L[state.lang].other}</small><b>📅</b>`;
    cal.innerHTML = calLabel();
    const inp = document.createElement('input');
    inp.type = 'date';
    inp.min = base;
    // Widened to +13; narrowed to the venue's real horizon once area data loads.
    inp.max = state.horizon || addDays(base, 13);
    calInput = inp;
    calChip = cal;
    inp.onchange = () => {
      if(!inp.value) return;
      state.dateStr = inp.value; state.advanced = true;
      prefs.set({dayIdx: diffDays(base, inp.value)});
      cal.innerHTML = `<small>${fiDay[dowOf(inp.value)]}</small><b>${dmOf(inp.value)}</b>`;
      cal.appendChild(inp);
      activate(cal); loadSchedule();
    };
    cal.appendChild(inp);
    cal.onclick = () => { try{ inp.showPicker(); }catch(e){ inp.click(); } };
    if(savedIdx >= 5){
      const iso = addDays(base, savedIdx);
      state.dateStr = iso;
      cal.innerHTML = `<small>${fiDay[dowOf(iso)]}</small><b>${dmOf(iso)}</b>`;
      cal.appendChild(inp);
      cal.classList.add('active');
    }
    daysEl.appendChild(cal);
  }

  // Each provider updates on its own schedule, so show every source's age. A scraper that
  // silently stops is otherwise invisible unless you happen to pick one of its venues.
  const STALE_H = 8;
  function ageHours(iso){
    const t = iso ? new Date(iso).getTime() : NaN;
    return isNaN(t) ? null : (Date.now() - t) / 36e5;
  }
  function renderHealth(){
    const el = document.querySelector('#sources');
    if(!el) return;
    const names = Object.keys(providerMeta);
    if(!names.length){ el.textContent = ''; return; }
    const parts = names.map(p => {
      const m = providerMeta[p], h = ageHours(m.generated);
      const nm = (SOURCE[p] || [p])[0];
      if(h === null) return `<span class="src bad">${nm} ?</span>`;
      const cls = h > STALE_H ? 'src bad' : 'src';
      const mark = h > STALE_H ? '\u26a0 ' : '';
      return `<span class="${cls}">${mark}${nm} ${Math.round(h)}${L[state.lang].hours}</span>`;
    });
    el.innerHTML = `${L[state.lang].sources}: ${parts.join(' · ')}`;
  }

  // "12€" -> 12. Only Kinoset and Kino Akseli publish prices so far.
  function priceLabel(rows){
    const vals = rows.map(r => parseFloat(String(r.price || '').replace(',', '.')))
      .filter(v => !isNaN(v) && v > 0);
    if(!vals.length) return '';
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const fmt = v => (Math.round(v * 100) % 100 === 0 ? String(Math.round(v)) : v.toFixed(2));
    return lo === hi ? `${fmt(lo)}\u20ac` : `${L[state.lang].from} ${fmt(lo)}\u20ac`;
  }

  function netErrorHtml(e){
    if(location.protocol === 'content:'){
      return `<div class="status"><b>Android is blocking network access.</b><br><br>
        This file was opened from the Downloads app (content:// address), which sandboxes the page and blocks all data fetching.<br><br>
        Open it via a file path instead — type this in Chrome's address bar:<br>
        <code>file:///sdcard/Download/finnkino.html</code><br><br>
        Or host the file (e.g. Netlify Drop, GitHub Pages) for a bookmarkable version.</div>`;
    }
    const log = attempts.length
      ? `<br><br><small style="text-align:left;display:inline-block">${attempts.map(a=>'· '+a).join('<br>')}</small>`
      : `<br><small>${e.message||e}</small>`;
    return `<div class="status">Couldn't load the schedule right now.${log}</div>`;
  }
  const jsonCache = {};
  async function fetchJSON(path){
    const r = await fetch(path + '?v=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  // Finnkino names carry the city as the last word ("Plevna Tampere"); BioRex ships city
  // explicitly. Group by city, since people pick a place before they pick a chain.
  function cityOf(a){
    if(a.city) return a.city;
    const w = (a.name || '').trim().split(/\s+/);
    return w.length > 1 ? w[w.length-1] : (a.name || '');
  }
  // "Itis Helsinki" never says Finnkino, so prefix the chain and drop the city — the
  // optgroup label already carries the city. BioRex names are already chain-prefixed.
  const CHAIN = { finnkino:'Finnkino', biorex:'BioRex', kinoakseli:'Kino Akseli',
                  kinoset:'Kinoset' };
  const SOURCE = { finnkino:['Finnkino','finnkino.fi'], biorex:['BioRex','biorex.fi'],
                   kinoakseli:['Kino Akseli','kinoakseli.fi'],
                   kinoset:['Kinoset','kinoset.fi'] };
  function shortOf(a){
    if(a.short) return a.short;
    const city = cityOf(a);
    const n = (a.name || '').trim();
    return n.endsWith(' ' + city) ? n.slice(0, -(city.length + 1)).trim() : n;
  }
  function labelOf(a){
    const chain = CHAIN[a.provider] || '';
    const short = shortOf(a);
    return (chain && !short.startsWith(chain)) ? `${chain} ${short}` : short;
  }
  function fillAreaSelect(areas){
    venueIndex = {};
    for(const a of areas) venueIndex[a.id] = Object.assign({}, a, { short: shortOf(a), label: labelOf(a) });
    const byCity = new Map();
    for(const a of areas){
      const c = cityOf(a);
      if(!byCity.has(c)) byCity.set(c, []);
      byCity.get(c).push(a);
    }
    const cities = [...byCity.keys()].sort((x,y)=>x.localeCompare(y,'fi'));
    const opt = a => `<option value="${a.id}">${labelOf(a)}</option>`;
    areaSel.innerHTML = cities.map(c =>
      `<optgroup label="${c}">${byCity.get(c)
        .sort((x,y)=>labelOf(x).localeCompare(labelOf(y),'fi')).map(opt).join('')}</optgroup>`).join('');
    const saved = prefs.get().area;
    state.area = (saved && areas.some(a => a.id === saved)) ? saved : areas[0].id;
    areaSel.value = state.area;
  }

  async function loadAreas(){
    try {
      const data = await fetchJSON('data/areas.json');
      const areas = (data.areas || []).filter(a => a.id && a.id !== '1029')
        .map(a => ({ ...a, provider:'finnkino' }));
      providerMeta = { finnkino: { generated: data.generated, venues: areas.length } };
      if(!areas.length) throw new Error('empty');
      // Extra providers, each optional: a missing or broken file must not take the app down.
      const extra = [];
      for(const prov of ['biorex','kinoakseli','kinoset']){
        try {
          const j = await fetchJSON(`data/venues-${prov}.json`);
          const vs = (j.venues || []).filter(v => v.id && v.name);
          for(const v of vs) extra.push({ ...v, provider: prov });
          if(vs.length) providerMeta[prov] = { generated: j.generated, venues: vs.length };
        } catch(_) {}
      }
      state.mode = 'json';
      state.generated = data.generated;
      fillAreaSelect(areas.concat(extra));
      renderHealth();
    } catch(_) {
      const xml = await fetchXML(API + '/TheatreAreas/', 'TheatreArea');
      const areas = [...xml.querySelectorAll('TheatreArea')].map(a => ({ id:txt(a,'ID'), name:txt(a,'Name') }))
                    .filter(a => a.id && a.id !== '1029');
      if(!areas.length) throw new Error('Theatre list came back empty');
      state.mode = 'xml';
      fillAreaSelect(areas);
    }
    areaSel.addEventListener('change', () => { state.area = areaSel.value; prefs.set({area: state.area}); loadSchedule(); });
  }

  /* ---------- schedule ---------- */
  const pad = n => String(n).padStart(2,'0');
  const apiDate = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;

  // Jump to a date and keep the chip row in sync, whether it is a chip or the picker.
  function selectDay(iso){
    state.dateStr = iso;
    const base = fiToday();
    prefs.set({ dayIdx: diffDays(base, iso) });
    [...daysEl.children].forEach(c => c.classList.remove('active'));
    if(dayBtns[iso]){
      dayBtns[iso].classList.add('active');
    } else if(calChip){
      calChip.innerHTML = `<small>${fiDay[dowOf(iso)]}</small><b>${dmOf(iso)}</b>`;
      if(calInput) calChip.appendChild(calInput);
      calChip.classList.add('active');
    }
    return loadSchedule();
  }

  async function loadSchedule(){
    main.innerHTML = '<div class="status"><div class="reel"></div>Loading schedule…</div>';
    try {
      if(state.mode === 'json'){
        if(!jsonCache[state.area]) jsonCache[state.area] = await fetchJSON(`data/area-${state.area}.json`);
        const cache = jsonCache[state.area];
        if(cache.generated) state.generated = cache.generated;
        state.dates = Array.isArray(cache.dates) ? cache.dates : null;
        state.horizon = cache.horizon || '';
        if(calInput && state.horizon) calInput.max = state.horizon;
        state.shows = cache.shows
          .map(s => ({ ...s, start: new Date(s.start) }))
          .filter(s => fiDate(s.start) === state.dateStr);
        // Late evening with nothing left today: move to the next day that has shows.
        if(!state.advanced && state.dateStr === fiToday() && !state.shows.length){
          const next = (state.dates || []).find(x => x > state.dateStr);
          if(next){
            state.advanced = true;
            selectDay(next);
            return;
          }
        }
      } else {
        const url = `${API}/Schedule/?area=${state.area}&dt=${apiDate(new Date(state.dateStr + 'T12:00:00'))}&nrOfDays=1`;
        const xml = await fetchXML(url, 'Schedule');
        state.shows = [...xml.querySelectorAll('Show')].map(s => ({
          eventId: txt(s,'EventID'),
          title: txt(s,'Title'),
          original: txt(s,'OriginalTitle'),
          len: txt(s,'LengthInMinutes'),
          rating: txt(s,'Rating'),
          genres: txt(s,'Genres'),
          method: txt(s,'PresentationMethodAndLanguage'),
          theatre: txt(s,'Theatre'),
          aud: txt(s,'TheatreAuditorium'),
          start: new Date(txt(s,'dttmShowStart')),
          url: txt(s,'ShowURL'),
          img: txt(s,'EventSmallImagePortrait') || txt(s,'EventMediumImagePortrait')
        }));
      }
      render();
      renderHealth();
      const staleEl = document.querySelector('#stale');
      if(state.generated){
        const ageH = (Date.now() - new Date(state.generated).getTime()) / 36e5;
        if(ageH > 8){
          staleEl.textContent = '\u26a0 Schedule data is ' + Math.round(ageH) + ' h old \u2014 the refresh pipeline likely needs a new token.';
          staleEl.style.display = 'block';
        } else {
          staleEl.style.display = 'none';
        }
        const t = new Date(state.generated);
        const v = venueIndex[state.area] || {};
        const [src, host] = SOURCE[v.provider] || SOURCE.finnkino;
        document.querySelector('footer').textContent =
          `Schedule data: ${src} · updated ${t.toLocaleString('fi-FI',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})} · Tap a showtime to buy tickets on ${host}`;
      }
    } catch(e){
      main.innerHTML = netErrorHtml(e);
    }
  }

  /* ---------- render ---------- */
  function passFilters(s){
    const q = state.filter.trim().toLowerCase();
    if(q && !s.title.toLowerCase().includes(q) && !(s.original||'').toLowerCase().includes(q)) return false;
    if(state.fLang && !/FI(?:-[A-Z]{2})?-A/.test(s.lang || '')) return false;
    if(state.fKids && !(s.rating === 'S' || s.rating === 'K-7')) return false;
    return true;
  }

  function renderTimes(){
    const now = new Date();
    const rows = state.shows.filter(passFilters).sort((a,b) => a.start - b.start);
    if(!rows.length){ main.innerHTML = `<div class="status">${emptyMsg()}</div>`; return; }
    main.innerHTML = rows.map(s => {
      const past = s.start < now;
      const t = fiTime(s.start);
      const cls = past ? ' past' : (s.soldOut ? ' sold' : '');
      return `<div class="trow">
        <a class="stub${cls}" style="--notch:${past?52:56}px" href="${s.url}" target="_blank" rel="noopener">
          <span class="time">${t}</span><span class="aud">${s.aud}${s.soldOut && !past ? ' · loppuunmyyty' : ''}</span></a>
        <div class="tinfo" data-id="${s.eventId}"><b>${disp(s)}</b>
          <small>${[s.rating, s.len ? s.len+' '+L[state.lang].min : '', s.method, langTxt(s.lang)].filter(Boolean).join(' · ')}</small></div>
      </div>`;
    }).join('');
  }

  // Filters beat everything; past the published horizon is not the same as a quiet day.
  function emptyMsg(){
    const t = L[state.lang];
    if(state.filter || state.fLang || state.fKids) return t.nomatch;
    if(state.horizon && state.dateStr > state.horizon) return t.notpublished;
    if(state.dateStr === fiToday()) return t.nomore;
    return t.noshows;
  }

  function render(){
    if(state.view === 'times'){ renderTimes(); return; }
    const now = new Date();
    const byEvent = new Map();
    for(const s of state.shows){
      if(!passFilters(s)) continue;
      if(!byEvent.has(s.eventId)) byEvent.set(s.eventId, { ...s, times:[] });
      byEvent.get(s.eventId).times.push(s);
    }
    const movies = [...byEvent.values()].sort((a,b)=>a.title.localeCompare(b.title,'fi'));

    if(!movies.length){
      main.innerHTML = `<div class="status">${emptyMsg()}</div>`;
      return;
    }

    const multiTheatre = new Set(state.shows.map(s=>s.theatre)).size > 1;

    main.innerHTML = movies.map(m => {
      const title = disp(m);
      const hue = [...m.title].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0, 7) % 360;
      const initials = (title.match(/\p{L}+|\d+/gu) || ['?']).slice(0,2).map(w=>w[0]).join('').toUpperCase();
      const tile = `<div class="poster blank" style="background:linear-gradient(160deg,hsl(${hue} 45% 32%),hsl(${(hue+45)%360} 50% 16%));color:hsl(${hue} 75% 82%)">${initials}</div>`;
      const poster = m.img
        ? `<img class="poster" src="${m.img}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.f" data-f='${tile.replace(/'/g,"&#39;")}'>`
        : tile;
      const stubs = m.times.sort((a,b)=>a.start-b.start).map(t => {
        const clock = fiTime(t.start);
        const past = t.start < now;
        const cls = past ? ' past' : (t.soldOut ? ' sold' : '');
        const loc = (multiTheatre ? `${t.theatre.split(',')[0]} · ${t.aud}` : t.aud) + (t.soldOut && !past ? ' · loppuunmyyty' : '');
        return `<a class="stub${cls}" style="--notch:${past?52:56}px" href="${t.url}" target="_blank" rel="noopener" title="Buy tickets — ${loc}">
                  <span class="time">${clock}</span><span class="aud">${loc}</span>
                </a>`;
      }).join('');
      const fmts = (m.method || '').split(' · ').filter(Boolean)
        .map(f => `<span class="fmt">${f}</span>`).join('');
      const meta1 = [
        m.tmdb ? `<span class="tmdb">★ ${m.tmdb}</span>` : '',
        m.rating ? `<span class="rating">${m.rating}</span>` : '',
        fmts
      ].filter(Boolean).join('');
      const price = priceLabel(m.times);
      const meta2 = [
        m.genres ? `<span>${m.genres.replace(/\s+,\s*/g, ', ').trim()}</span>` : '',
        m.len ? `<span>${m.len} min</span>` : '',
        m.lang ? `<span>${langTxt(m.lang)}</span>` : '',
        price ? `<span>${price}</span>` : ''
      ].filter(Boolean).join('');
      return `<article class="movie" data-id="${m.eventId}">
                ${poster}
                <div class="info">
                  <h2 class="title">${title}</h2>
                  <div class="meta1">${meta1}</div>
                  ${meta2 ? `<div class="meta2">${meta2}</div>` : ''}
                  <div class="stubs">${stubs}</div>
                </div>
              </article>`;
    }).join('');
  }

  searchEl.oninput = () => { state.filter = searchEl.value; render(); };

  /* ---------- movie sheet ---------- */
  const sheetEl = document.querySelector('#sheet'), overlayEl = document.querySelector('#overlay');
  async function showSheet(fid){
    await ensureFilms();
    const f = films[fid] || {};
    const all = (jsonCache[state.area] && jsonCache[state.area].shows || [])
      .filter(s => s.eventId === fid).map(s => ({...s, start:new Date(s.start)}))
      .sort((a,b) => a.start - b.start);
    const sample = all[0] || state.shows.find(s => s.eventId === fid) || {};
    const lang = state.lang;
    const title = (lang==='en' ? ((f.t&&f.t.en)||f.o) : (f.t&&f.t.fi)) || sample.title || '';
    const syn = (f.s && (lang==='en' ? (f.s.en || f.s.fi) : f.s.fi)) || '';
    const fmts = (sample.method || '').split(' · ').filter(Boolean)
      .map(x => `<span class="fmt">${x}</span>`).join('');
    const sheetPrice = priceLabel(all);
    const meta1 = [
      sample.tmdb ? `<span class="tmdb">★ ${sample.tmdb}</span>` : '',
      sample.rating ? `<span class="rating">${sample.rating}</span>` : '',
      sample.len ? `<span class="fmt">${sample.len} ${L[lang].min}</span>` : '',
      sheetPrice ? `<span class="fmt">${sheetPrice}</span>` : '',
      fmts
    ].filter(Boolean).join('');
    const byDay = new Map();
    const now = new Date();
    for(const s of all){
      const iso = fiDate(s.start);
      const k = `${fiDay[dowOf(iso)]} ${dmOf(iso)}`;
      if(!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(s);
    }
    const days = [...byDay.entries()].map(([k, arr]) => `<h3>${k}</h3><div class="stubs">` +
      arr.map(s => {
        const past = s.start < now;
        const clock = fiTime(s.start);
        const cls = past ? ' past' : (s.soldOut ? ' sold' : '');
        return `<a class="stub${cls}" style="--notch:${past?52:56}px" href="${s.url}" target="_blank" rel="noopener">
                  <span class="time">${clock}</span><span class="aud">${s.aud}</span></a>`;
      }).join('') + '</div>').join('');
    const poster = sample.img ? `<img class="poster" src="${sample.img}" alt="">` : '';
    sheetEl.innerHTML = `
      <button class="sheet-close" aria-label="Sulje">✕</button>
      <div class="sheet-head">${poster}
        <div><div class="sheet-title">${title}</div>
          <div class="meta1" style="margin-top:8px">${meta1}</div>
          ${sample.genres ? `<div class="meta2">${sample.genres.replace(/\s+,\s*/g, ', ')}</div>` : ''}
          ${f.tr ? `<a class="trailer" href="${f.tr}" target="_blank" rel="noopener">${L[lang].trailer}</a>` : ''}
        </div></div>
      <div class="sheet-body">
        ${syn ? `<p class="syn">${syn}</p>` : ''}
        <div class="sheet-days">${days}</div>
      </div>`;
    sheetEl.querySelector('.sheet-close').onclick = () => { location.hash = ''; };
    document.body.classList.add('sheet-open');
  }
  function hideSheet(){ document.body.classList.remove('sheet-open'); }
  function syncSheet(){
    const m = location.hash.match(/m=([\w-]+)/);
    if(m) showSheet(m[1]); else hideSheet();
  }
  window.addEventListener('hashchange', syncSheet);
  overlayEl.onclick = () => { location.hash = ''; };
  main.addEventListener('click', e => {
    if(e.target.closest('a.stub')) return;
    const el = e.target.closest('article.movie, .tinfo');
    if(el && state.mode === 'json') location.hash = 'm=' + el.dataset.id;
  });

  /* ---------- language toggle ---------- */
  const langBtn = document.querySelector('#langToggle');
  function applyLang(){
    langBtn.textContent = state.lang === 'fi' ? 'EN' : 'FI';
    fiDay = L[state.lang].days;
    searchEl.placeholder = L[state.lang].filter;
    buildDays();
    syncTools();
    render();
    if(document.body.classList.contains('sheet-open')) syncSheet();
  }
  state.lang = prefs.get().lang === 'en' ? 'en' : 'fi';
  langBtn.onclick = async () => {
    state.lang = state.lang === 'fi' ? 'en' : 'fi';
    prefs.set({lang: state.lang});
    await ensureFilms();
    applyLang();
  };

  /* ---------- view + filter toggles ---------- */
  const segM = document.querySelector('#segMovies'), segT = document.querySelector('#segTimes');
  const chipLang = document.querySelector('#chipLang'), chipKids = document.querySelector('#chipKids');
  function syncTools(){
    segM.classList.toggle('on', state.view === 'movies');
    segT.classList.toggle('on', state.view === 'times');
    chipLang.classList.toggle('on', state.fLang);
    chipKids.classList.toggle('on', state.fKids);
    segM.textContent = L[state.lang].movies; segT.textContent = L[state.lang].times;
    chipLang.textContent = L[state.lang].flang; chipKids.textContent = L[state.lang].fkids;
  }
  segM.onclick = () => { state.view = 'movies'; prefs.set({view:'movies'}); syncTools(); render(); };
  segT.onclick = () => { state.view = 'times';  prefs.set({view:'times'});  syncTools(); render(); };
  chipLang.onclick = () => { state.fLang = !state.fLang; prefs.set({fLang:state.fLang}); syncTools(); render(); };
  chipKids.onclick = () => { state.fKids = !state.fKids; prefs.set({fKids:state.fKids}); syncTools(); render(); };
  const pr = prefs.get();
  state.view = pr.view === 'times' ? 'times' : 'movies';
  state.fLang = !!pr.fLang; state.fKids = !!pr.fKids;
  syncTools();

  /* ---------- date rollover on resume ---------- */
  let builtFor = fiToday();
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState !== 'visible') return;
    if(fiToday() !== builtFor){
      builtFor = fiToday();
      state.advanced = false;
      jsonCache && Object.keys(jsonCache).forEach(k => delete jsonCache[k]);
      buildDays();
      loadSchedule();
    } else {
      render(); // refresh past-time dimming after shorter naps
    }
  });

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

  /* ---------- init ---------- */
  (async () => {
    try {
      buildDays();
      await loadAreas();
      if(state.lang === 'en'){ await ensureFilms(); }
      langBtn.textContent = state.lang === 'fi' ? 'EN' : 'FI';
      fiDay = L[state.lang].days;
      searchEl.placeholder = L[state.lang].filter;
      buildDays();
      await loadSchedule();
    } catch(e){
      main.innerHTML = netErrorHtml(e);
    }
  })();
})();
</script>
</body>
</html>

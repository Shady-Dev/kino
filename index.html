<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leffavuoro — elokuvat ja näytösajat</title>
<meta name="theme-color" content="#0D0E12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --ink:#16181D; --muted:#5C6470;
    --line:#E3E6EB; --accent:#B8860B; --accent-soft:#F4E9CE;
    --chip-bg:#FFFFFF; --chip-hover:#16181D; --chip-hover-ink:#F6F7F9;
    --shadow:0 1px 3px rgba(22,24,29,.06);
    --past:#AEB4BE;
  }
  [data-theme="dark"]{
    --bg:#0D0E12; --surface:#16181F; --ink:#EDEDEA; --muted:#8B93A1;
    --line:#262A33; --accent:#E8B84B; --accent-soft:#2A2415;
    --chip-bg:#1C1F28; --chip-hover:#E8B84B; --chip-hover-ink:#0D0E12;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --past:#4A4F5A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    transition:background .25s,color .25s;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    transition:background .25s;
  }
  .bar{
    max-width:1100px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; gap:16px;
  }
  .logo{
    font-stretch:125%; font-weight:900; letter-spacing:.16em;
    text-transform:uppercase; font-size:1.05rem; user-select:none;
    white-space:nowrap;
  }
  @media (max-width:520px){
    .logo{font-size:.82rem; letter-spacing:.08em}
  }
  .logo span{color:var(--accent)}
  .bar .spacer{flex:1}
  #themeToggle{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    font-size:1rem; line-height:1; display:grid; place-items:center;
    transition:border-color .15s, transform .15s;
  }
  #themeToggle:hover{border-color:var(--accent); transform:rotate(15deg)}
  #themeToggle:focus-visible, .day:focus-visible, .stub:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ===== Controls ===== */
  .controls{
    max-width:1100px; margin:0 auto; padding:16px 20px 12px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  select, .search{
    font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; box-shadow:var(--shadow);
  }
  select{cursor:pointer; max-width:280px}
  .fav{
    font:inherit; font-size:1.15rem; line-height:1; cursor:pointer;
    color:var(--muted); background:var(--surface);
    border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; box-shadow:var(--shadow);
  }
  .fav[aria-pressed="true"]{color:var(--accent); border-color:var(--accent)}
  .fav.labelled{display:inline-flex; align-items:center; gap:6px; color:var(--ink)}
  .fav .fav-cta{font-size:.78rem; font-weight:600; white-space:nowrap}
  /* Chain hint in combined views. The venue name carries the meaning; this only helps
     scanning, so it is never the sole signal. */
  /* --chain is set per chain by a <style> generated from data/providers.json.
     Not --accent: that is already the theme colour. */
  .stub[class*="chain-"]{border-left:3px solid var(--chain, var(--line))}

  /* themed dropdown on Chromium (progressive enhancement) */
  select, ::picker(select){appearance:base-select}
  ::picker(select){
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
    padding:6px; margin-top:6px;
  }
  select option{
    padding:9px 12px; border-radius:8px; font:inherit;
    background:var(--surface); color:var(--ink); cursor:pointer;
  }
  select option:hover, select option:focus{background:var(--accent-soft)}
  select option:checked{color:var(--accent); font-weight:700}
  select option::checkmark{color:var(--accent)}
  select optgroup{font:inherit; color:var(--muted); padding:6px 8px 2px}
  .search{flex:1; min-width:160px}
  .search::placeholder{color:var(--muted)}

  .days{
    max-width:1100px; margin:0 auto; padding:0 20px 16px;
    display:flex; gap:6px;
  }
  .day{
    flex:1 1 0; min-width:0; border:1px solid var(--line); background:var(--surface);
    border-radius:10px; padding:7px 2px; cursor:pointer; font:inherit;
    color:var(--muted); text-align:center; transition:all .15s;
    position:relative; overflow:hidden;
  }
  .day b{display:block; color:var(--ink); font-weight:700; font-size:.85rem; white-space:nowrap}
  .day small{font-size:.74rem; font-weight:600; letter-spacing:.01em; white-space:nowrap}
  /* Custom month picker: <input type=date> cannot dim individual days, and with
     horizons out to three months most days have no screening at all. */
  .cal-wrap{
    position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .cal{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.5); padding:14px; width:min(340px,100%);
  }
  .cal-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
  .cal-head b{font-size:.95rem; text-transform:capitalize}
  .cal-nav{
    font:inherit; font-size:1.1rem; line-height:1; cursor:pointer; color:var(--ink);
    background:var(--chip-bg); border:1px solid var(--line); border-radius:8px;
    padding:4px 12px;
  }
  .cal-nav[disabled]{opacity:.3; cursor:default}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center}
  .cal-dow{font-size:.68rem; font-weight:700; color:var(--muted); padding-bottom:4px}
  .cal-day{
    font:inherit; font-size:.85rem; padding:7px 0; border-radius:8px;
    border:1px solid transparent; background:none; color:var(--muted);
  }
  .cal-day.has{
    cursor:pointer; color:var(--ink); font-weight:700;
    background:var(--chip-bg); border-color:var(--line);
  }
  .cal-day.off{opacity:.28}
  .cal-day.pad{opacity:0}
  .cal-day.sel{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .cal-note{display:block; margin-top:10px; font-size:.7rem; color:var(--muted); text-align:center}
  /* Past showtimes are hidden by default. The toggle lives on the meta line, so it
     costs no header space and no slot in the showtime grid. */
  .pastlink{
    font:inherit; font-size:inherit; cursor:pointer; padding:0;
    background:none; border:0; border-bottom:1px dotted currentColor;
    color:var(--muted);
  }
  .pastlink:hover{color:var(--ink)}
  .daydone{
    max-width:1100px; margin:26px auto 4px; padding:0 0 8px;
    border-bottom:1px solid var(--line);
    font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
  }
  .nextday{
    /* Own line: inline-block left it stranded beside the message with a wide gap. */
    display:block; width:fit-content; margin:14px auto 0;
    font:inherit; font-size:.85rem; font-weight:600;
    cursor:pointer; color:var(--ink); background:var(--chip-bg);
    border:1px solid var(--line); border-radius:999px; padding:8px 16px;
  }
  .day.active{background:var(--ink); border-color:var(--ink)}
  .day.active b{color:var(--bg)}
  .day.active small{color:var(--accent)}

  /* ===== Movie list ===== */
  main{max-width:1100px; margin:0 auto; padding:8px 20px 80px}
  .status{padding:60px 0; text-align:center; color:var(--muted)}
  .status .reel{
    width:34px;height:34px;margin:0 auto 16px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .movie{
    display:flex; gap:18px; padding:20px 0;
    border-bottom:1px solid var(--line);
  }
  .poster{
    flex:0 0 92px; width:92px; height:132px; border-radius:8px;
    object-fit:cover; background:var(--surface); box-shadow:var(--shadow);
  }
  .poster.blank{display:grid;place-items:center;font-weight:800;font-size:1.5rem;letter-spacing:.04em;border:1px solid var(--line)}
  .info{flex:1; min-width:0}
  .title{font-size:1.15rem; font-weight:800; line-height:1.25}
  .meta1{
    margin-top:7px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center;
    font-size:.82rem;
  }
  .meta2{
    margin-top:5px; color:var(--muted); font-size:.8rem;
    display:flex; flex-wrap:wrap; gap:4px 14px;
  }
  .rating, .fmt{
    display:inline-block; border:1px solid var(--line); border-radius:5px;
    padding:1px 7px; font-weight:700; font-size:.72rem; color:var(--ink);
    background:var(--surface);
  }
  .fmt{color:var(--muted); font-weight:600; letter-spacing:.05em; text-transform:uppercase}
  .fmt.prem{color:var(--ink); border-color:var(--accent)}
  /* A limit the *screening* imposes, not the film's classification: a licensed bar
     auditorium is 18+ even when the film is K-12. Deliberately not red and not KAVI's
     official symbol — that artwork means a legal age rating, which this is not, and a
     red chip inside a stub whose left rule is already Finnkino orange or Kotkan Leffat
     crimson would compete with the one thing colour does here. Separated by shape and
     weight instead, so it also survives greyscale and colourblind vision. */
  /* Two glyphs, no more. A stub's label column is about 75 px and truncates, so
     "Anniskelu" costs a third of it; the word survives on the card, where there is room.
     Monochrome and drawn with currentColor on purpose: the chain rule is the only thing
     in a stub allowed to carry colour. Never a glyph alone — each one has a title and an
     aria-label with the Finnish word, and the legend spells both out. */
  .gl{
    display:inline-grid; place-items:center; flex:0 0 auto;
    width:15px; height:15px; border-radius:50%;
    border:1px solid currentColor; color:var(--ink);
    font-size:.55rem; font-weight:800; letter-spacing:0; line-height:1;
  }
  .gl.age{width:auto; min-width:15px; padding:0 3px; border-radius:8px}
  .stub .gl{color:var(--muted)}
  .stub:hover .gl{color:inherit}
  .tagkey{display:inline-flex; flex-wrap:wrap; gap:10px; align-items:center;
    font-size:.7rem; color:var(--muted); margin-left:10px;
    padding-left:10px; border-left:1px solid var(--line)}
  @media (max-width:560px){
    .tagkey{margin-left:0; padding-left:0; border-left:0; margin-top:6px}
  }
  .tagkey .gl{color:var(--muted); margin-right:4px}
  .agelim{
    display:inline-block; margin-left:6px; border:1px solid var(--line);
    border-radius:4px; padding:0 4px; font-size:.66rem; font-weight:800;
    letter-spacing:.03em; color:var(--ink); background:var(--surface);
    white-space:nowrap; vertical-align:1px;
  }
  .stub:hover .agelim{color:inherit; border-color:currentColor; background:transparent; opacity:.85}

  #langToggle{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    height:38px; padding:0 13px; border-radius:19px; cursor:pointer;
    font:inherit; font-weight:800; font-size:.78rem; letter-spacing:.08em;
  }
  #langToggle:hover{border-color:var(--accent)}
  .movie{cursor:pointer}

  #overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0;
    pointer-events:none; transition:opacity .25s; z-index:90}
  #sheet{position:fixed; left:0; right:0; bottom:0; max-height:86vh; overflow:hidden;
    display:flex; flex-direction:column;
    background:var(--bg); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; transform:translateY(102%);
    transition:transform .28s cubic-bezier(.3,.8,.3,1); z-index:100;
    padding:18px 0 0; max-width:720px; margin:0 auto;}
  body.sheet-open #overlay{opacity:1; pointer-events:auto}
  body.sheet-open #sheet{transform:none}
  @media (min-width:700px){
    #sheet{
      bottom:auto; top:50%; left:50%; right:auto;
      width:min(680px, 92vw); max-height:82vh;
      border:1px solid var(--line); border-radius:18px;
      box-shadow:0 24px 80px rgba(0,0,0,.45);
      transform:translate(-50%,-46%); opacity:0; pointer-events:none;
      transition:transform .22s ease, opacity .22s ease;
    }
    body.sheet-open #sheet{transform:translate(-50%,-50%); opacity:1; pointer-events:auto}
  }
  .sheet-close{position:absolute; top:12px; right:14px; width:34px; height:34px;
    border-radius:50%; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); font-size:1rem; cursor:pointer}
  .sheet-head{display:flex; gap:16px; align-items:flex-start;
    flex:0 0 auto; padding:0 20px 14px}
  /* Drag-to-dismiss: only the bottom-sheet layout gets a grab handle. */
  .grab{display:none}
  @media (max-width:699px){
    .grab{
      display:block; width:38px; height:4px; border-radius:2px;
      background:var(--line); margin:0 auto 10px; flex:0 0 auto;
    }
    .sheet-head{touch-action:none; cursor:grab}
    #sheet.dragging{transition:none}
  }
  .sheet-body{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; padding:0 20px 28px;
    border-top:1px solid var(--line)}
  .sheet-body > .syn:first-child{margin-top:14px}
  /* The chain key has to stay put while the day list scrolls: a long film has 40+ stubs
     over several days, and the colour on a stub means nothing once the key has scrolled
     away. Negative margins span the body's 20 px padding so the sticky strip reaches
     both edges instead of leaving a gutter the stubs slide through. */
  .sheet-body > .legend{
    position:sticky; top:0; z-index:2;
    margin:0 -20px; padding:10px 20px;
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .sheet-body > .legend + .syn{margin-top:14px}
  .sheet-head .poster{flex:0 0 104px; width:104px; height:150px}
  .sheet-title{font-size:1.25rem; font-weight:800; line-height:1.2; padding-right:36px}
  .syn{margin-top:14px; line-height:1.6; font-size:.92rem; color:var(--ink)}
  .trailer{display:inline-block; margin-top:12px; color:var(--accent); font-weight:700;
    text-decoration:none; font-size:.88rem}
  .sheet-days{margin-top:6px}
  .sheet-days h3{margin:16px 0 8px; font-size:.75rem; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em; font-weight:700}

  /* Ticket stubs — the signature */
  .stubs{margin-top:12px; display:flex; flex-wrap:wrap; gap:8px}
  .stubs.grid{
    display:grid; gap:8px;
    grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
  }
  .stubs.grid .stub{flex-direction:column; align-items:stretch}
  .stubs.grid .stub .time{padding:6px 10px 2px 12px}
  .stubs.grid .stub .aud{
    padding:0 10px 7px 12px; border-left:0; max-width:none;
    display:flex; align-items:flex-start;
  }
  .stubs.grid .stub .aud .loc{white-space:normal; overflow:visible; text-overflow:clip}
  /* Top-aligned in the grid: the label may run to two lines, the glyph column stays
     level with the first, so a row of stubs has its glyphs on one line. */
  .stubs.grid .stub .glyphs{align-self:flex-start; padding-top:1px}
  /* the perforation reads wrong on a stacked stub */
  .stubs.grid .stub::before,.stubs.grid .stub::after{display:none}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; font-size:.72rem; color:var(--muted)}
  .legend .lg{padding-left:8px; border-left:3px solid var(--line)}
  .legend .lg-btn{
    font:inherit; font-size:.74rem; font-weight:600; cursor:pointer;
    color:var(--muted); background:var(--surface);
    border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:0 999px 999px 0; padding:5px 12px 5px 9px;
    transition:color .15s, background .15s, opacity .15s;
  }
  .legend .lg-btn.on{color:var(--ink); background:var(--chip-bg)}
  .legend .lg-btn:not(.on){opacity:.5}
  .legend .lg[class*="chain-"],
  .legend .lg-btn[class*="chain-"]{border-left-color:var(--chain, var(--line))}
  .legend .lg-btn.lg-all{
    border-left-width:1px; border-radius:999px; color:var(--ink); opacity:1;
    background:var(--chip-bg);
  }
  .legend.top{max-width:1100px; margin:0 auto; padding:0 20px 4px}
  @media (max-width:520px){
    .stubs.grid{grid-template-columns:repeat(auto-fill, minmax(140px, 1fr))}
  }
  .stub{
    --r:7px;
    display:inline-flex; align-items:center; text-decoration:none;
    background:var(--chip-bg); border:1px solid var(--line);
    border-radius:var(--r); box-shadow:var(--shadow);
    font-variant-numeric:tabular-nums;
    transition:background .15s,color .15s,border-color .15s,transform .1s;
    position:relative; overflow:hidden;
  }
  .stub .time{padding:7px 10px 7px 12px; font-weight:800; font-size:.92rem}
  .stub .aud{
    padding:7px 12px 7px 10px; font-size:.72rem; color:var(--muted);
    border-left:1px dashed var(--line); max-width:130px;
    display:flex; align-items:center; gap:6px; min-width:0;
  }
  /* Glyphs sit in their own column, pushed right and never wrapping with the label:
     trailing them after variable-length text put them in a different place on every
     stub, and on a two-line label they dropped onto a line of their own. */
  .stub .glyphs{margin-left:auto; flex:0 0 auto; display:flex; align-items:center; gap:3px}
  /* The room name truncates; the age chip never does. It is the one part of a stub a
     visitor cannot afford to have eaten by an ellipsis. */
  .stub .aud .loc{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .stub .aud .agelim{flex:0 0 auto}
  /* perforation notches */
  .stub::before,.stub::after{
    content:""; position:absolute; width:8px; height:8px; border-radius:50%;
    background:var(--bg); border:1px solid var(--line); left:var(--notch);
  }
  .stub::before{top:-5px}.stub::after{bottom:-5px}
  .stub:hover{background:var(--chip-hover); color:var(--chip-hover-ink); border-color:var(--chip-hover); transform:translateY(-1px)}
  .stub:hover .aud{color:var(--chip-hover-ink); opacity:.75}
  .stub.past{opacity:.45; pointer-events:none}
  .stub.sold{opacity:.55; pointer-events:none; filter:grayscale(1)}
  .stub.sold .time{text-decoration:line-through}
  .stub.past .time{color:var(--past)}

  .theatre-tag{color:var(--accent); font-weight:600}
  .tmdb{color:var(--accent); font-weight:700}
  /* Score ring. The arc length carries the score and the number inside repeats it, so
     it survives greyscale and colourblind vision — which is why it is one hue rather
     than TMDB's green/amber/red: this app already spends colour on chain identity, and
     a second colour language competing with it would cost more than it explains.
     Deliberately not a copy of TMDB's widget either; we use their data, not their
     badge, and looking like their component would imply an endorsement we do not have. */
  .ring{
    --v:0; position:relative; flex:0 0 auto;
    width:30px; height:30px; border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--v) * 3.6deg), var(--line) 0);
    display:grid; place-items:center;
  }
  .ring::before{
    content:""; position:absolute; inset:3px; border-radius:50%; background:var(--bg);
  }
  .ring b{position:relative; font-size:.68rem; font-weight:800; color:var(--ink); line-height:1}
  .ring.thin{opacity:.55}
  .votes{color:var(--muted); font-size:.7rem; font-weight:600}
  .sheet-head .ring{width:38px; height:38px}
  .sheet-head .ring b{font-size:.82rem}

  .tools{
    max-width:1100px; margin:0 auto; padding:0 20px 14px;
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  .seg{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface)}
  .seg button{border:0; background:transparent; padding:7px 14px; font:inherit; font-size:.78rem; font-weight:700; color:var(--muted); cursor:pointer}
  .seg button.on{background:var(--ink); color:var(--bg)}
  .chip{border:1px solid var(--line); background:var(--surface); border-radius:999px;
    padding:7px 13px; font:inherit; font-size:.78rem; font-weight:600; color:var(--muted); cursor:pointer; transition:all .15s}
  .chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

  .trow{display:flex; align-items:center; gap:14px; padding:9px 0; border-bottom:1px solid var(--line)}
  .trow .stub{flex:0 0 158px; width:158px; min-width:0}
  .trow .stub .time{flex:0 0 62px; text-align:center; padding:7px 4px 7px 8px}
  .trow .stub .aud{flex:1 1 0; min-width:0; max-width:none; text-align:left}
  .trow .stub .aud .loc{flex:0 1 auto}
  .tinfo{min-width:0; cursor:pointer}
  .tinfo b{display:block; font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tinfo small{color:var(--muted); font-size:.75rem}

  #stale{
    display:none; max-width:1060px; margin:12px auto 0; padding:10px 14px;
    border:1px solid var(--accent); background:var(--accent-soft); color:var(--ink);
    border-radius:10px; font-size:.85rem;
  }
  @media (max-width:1100px){ #stale{margin:12px 20px 0} }

  footer{
    max-width:1100px; margin:0 auto; padding:24px 20px; color:var(--muted);
    font-size:.75rem; border-top:1px solid var(--line);
  }
  #sources{
    max-width:1100px; margin:0 auto; padding:20px 20px 0; color:var(--muted);
    font-size:.72rem; display:flex; flex-wrap:wrap; gap:4px 10px;
  }
  #sources .src{white-space:nowrap}
  #sources .src.bad{color:var(--accent); font-weight:700}

  @media (max-width:560px){
    .poster{flex-basis:72px; width:72px; height:104px}
    .title{font-size:1.02rem}
    /* Venue picker and its star share one row; search gets the next. Setting the select to
       width:100% pushed the star onto a row of its own and wasted ~60px of height. */
    .controls{padding:10px 14px 8px; gap:8px}
    select{max-width:none; flex:1 1 auto; width:auto; min-width:0}
    .fav{flex:0 0 auto; padding:8px 11px}
    .search{flex:1 1 100%; width:100%; min-width:0}
    /* Tighter vertical rhythm: the header used to fill most of a phone screen. */
    .bar{padding:10px 14px; gap:10px}
    .days{padding:0 14px 8px; gap:6px}
    .tools{padding:0 14px 10px; gap:6px}
    .day{padding:6px 1px}
    .day b{font-size:.8rem}
    .day small{font-size:.66rem; letter-spacing:0}
    .seg button, .chip{padding:6px 11px; font-size:.74rem}
    #sources{padding:14px 14px 0}
    footer{padding:16px 14px}
  }
  @media (max-width:400px){
    .day small{font-size:.6rem}
    .day b{font-size:.76rem}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">Leffavuoro<span>.</span></div>
    <div class="spacer"></div>
    <button id="langToggle" aria-label="Vaihda kieli">EN</button>
    <button id="themeToggle" title="Switch theme" aria-label="Switch light/dark theme">◐</button>
  </div>
  <div class="controls">
    <select id="areaSelect" aria-label="Choose theatre"></select>
    <button id="favBtn" class="fav" aria-pressed="false" title="Oma teatteri">☆</button>
    <input class="search" id="search" type="search" placeholder="Search e.g. Dune or comedy" aria-label="Filter movies by title or genre">
  </div>
  <div class="days" id="days" role="tablist" aria-label="Choose date"></div>
  <div class="tools">
    <div class="seg" role="tablist">
      <button id="segMovies" class="on">Leffat</button><button id="segTimes">Ajat</button>
    </div>
    <button class="chip" id="chipLang">Suom. puhe</button>
    <button class="chip" id="chipKids">Lapsille</button>
  </div>
</header>

<div id="stale" role="status"></div>

<div id="overlay"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>

<main id="main">
  <div class="status"><div class="reel"></div>Ladataan teattereita…</div>
</main>

<div id="sources"></div>
<footer>Näytösajat suomalaisista elokuvateattereista</footer>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const main = $('#main'), areaSel = $('#areaSelect'), daysEl = $('#days'), searchEl = $('#search');

  let state = { area:null, dateStr:'', shows:[], filter:'', lang:'fi', view:'movies',
                fLang:false, fKids:false, dates:null, horizon:'', advanced:false,
                chains:null,     // null = every chain; a Set = only those
                revealed:new Set() };  // eventIds whose past showtimes are expanded
  let films = null;
  // films.json is Finnkino-only (keyed by its filmId). Other providers get synopses from
  // films-extra.json, keyed by normalised title — same normalisation as enrich_tmdb.py.
  let extraFilms = null;
  const normTitle = t => (t || '').toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
  // Cross-provider identity for the combined city view: "Spider-Man: Brand New Day 2D",
  // "Ryhmä Hau: Dinoelokuva (suomeksi)" and "Marsupilami, suomeksi" must all match their
  // plain forms at another chain.
  // Reissue markers are the same film labelled in two languages: BioRex ships
  // "Autot (re-release)", Finnkino "Autot (uudelleenjulkaisu)". Safe to strip because
  // they carry no sequel information, unlike a subtitle after a dash — dropping that
  // would merge "Mission: Impossible - Dead Reckoning" into "Mission: Impossible".
  const mergeKey = t => normTitle((t || '')
    .replace(/\((?:suomeksi|dubattu|dub|orig\.?)\)/gi, ' ')
    .replace(/\((?:re-?release|uudelleenjulkaisu|uusi\s+kopio)\)/gi, ' ')
    .replace(/,?\s*\bsuomeksi\b/gi, ' ')
    .replace(/\b(?:2d|3d|imax|4k)\b/gi, ' '));
  async function ensureExtraFilms(){
    if(extraFilms) return extraFilms;
    try {
      const j = await fetchJSON('data/films-extra.json');
      extraFilms = j.films || {};
    } catch(_) { extraFilms = {}; }
    return extraFilms;
  }

  // TMDB genre ids are language-neutral; data/tmdb-genres.json turns them into names.
  // Provider genre strings stay as the fallback: four chains spell the family genre four
  // ways ("Perhe-elokuva", "Koko perheen", "Koko perheen elokuva", "Perhe"), Cinema Orion
  // publishes none at all, and in English mode every one of them is still Finnish.
  let genreNames = null;
  async function ensureGenres(){
    if(genreNames) return genreNames;
    try { genreNames = await fetchJSON('data/tmdb-genres.json'); }
    catch(_) { genreNames = {}; }
    // The search haystack is memoised per show and includes genre names, so it has to be
    // thrown away once the maps arrive — otherwise a search typed before the fetch
    // finished would keep matching titles only.
    for(const s of state.shows) delete s._hay;
    return genreNames;
  }
  const genresOf = m => {
    const map = genreNames && genreNames[state.lang];
    if(map && Array.isArray(m.gids) && m.gids.length){
      const out = m.gids.map(id => map[id]).filter(Boolean);
      if(out.length) return out.join(', ');
    }
    return (m.genres || '').replace(/\s+,\s*/g, ', ').trim();
  };

  async function ensureFilms(){
    if(films !== null) return;
    try{ films = (await fetchJSON('data/films.json')).films || {}; }
    catch(e){ films = {}; }
  }
  const L = {
    fi:{ today:'Tänään', other:'Muu', days:['Su','Ma','Ti','Ke','To','Pe','La'],
         filter:'Etsi elokuvaa tai genreä', searchEg:'Etsi esim.', searchOr:'tai komedia',
         trailer:'▶ Katso traileri', min:'min',
         movies:'Leffat', times:'Ajat', flang:'Suom. puhe', fkids:'Lapsille',
         tomorrow:'Huomenna', from:'alkaen', sources:'Lähteet', hours:'h',
         favOn:'Oma teatteri, avataan tämä jatkossa', favOff:'Aseta omaksi teatteriksi',
         favCta:'Tallenna', favCtaLong:'Tallenna oma teatteri',
         allIn:'Kaikki', manySources:'usea lähde',
         soldout:'loppuunmyyty', staleOne:'aikataulu ei ole päivittynyt',
         nomatch:'Yksikään elokuva ei vastaa suodattimia.',
         nomore:'Ei enää näytöksiä tänään.',
         noshows:'Ei näytöksiä tänä päivänä valitussa teatterissa.',
         notpublished:'Ohjelmistoa ei ole vielä julkaistu tälle päivälle.',
         onlyDays:'Vain päivät, joille on näytöksiä, ovat valittavissa.',
         showPast:'aiemmin', hidePast:'piilota aiemmat', nextShows:'Seuraavat näytökset',
         alreadyShown:'Menneet näytökset', allChains:'Kaikki',
         keyAnniskelu:'anniskelu', keyAge:'ikäraja tässä näytöksessä',
         premiere:'Ensi-ilta', votes:'ääntä',
         loadingTheatres:'Ladataan teattereita…', loadingSchedule:'Ladataan näytöksiä…',
         loadFail:'Aikataulua ei juuri nyt saatu ladattua.',
         dataLabel:'Aikataulut', updated:'päivitetty',
         actCombined:'Napauta näytöstä avataksesi teatterin oman sivun',
         actDoor:'Liput myydään ovelta · {host}',
         actReserve:'Napauta näytöstä varataksesi paikat — {host}',
         actList:'Napauta näytöstä avataksesi ohjelmiston — {host}',
         actBuy:'Napauta näytöstä ostaaksesi liput — {host}' },
    en:{ today:'Today', other:'Other', days:['Su','Mo','Tu','We','Th','Fr','Sa'],
         filter:'Search title or genre', searchEg:'Search e.g.', searchOr:'or comedy',
         trailer:'▶ Watch trailer', min:'min',
         movies:'Movies', times:'By time', flang:'Finnish audio', fkids:'Kids',
         tomorrow:'Tomorrow', from:'from', sources:'Sources', hours:'h',
         favOn:'Home theatre, opens here next time', favOff:'Set as home theatre',
         favCta:'Save', favCtaLong:'Save as home theatre',
         allIn:'All', manySources:'multiple sources',
         soldout:'sold out', staleOne:'schedule has not refreshed',
         nomatch:'No movies match your filters.',
         nomore:'No more shows today.',
         noshows:'No shows for this day at the selected theatre.',
         notpublished:'The schedule for this day has not been published yet.',
         onlyDays:'Only days with screenings can be picked.',
         showPast:'earlier', hidePast:'hide earlier', nextShows:'Next screenings',
         alreadyShown:'Past screenings', allChains:'All',
         keyAnniskelu:'licensed bar', keyAge:'age limit for this screening',
         premiere:'Premiere', votes:'votes',
         loadingTheatres:'Loading theatres…', loadingSchedule:'Loading schedule…',
         loadFail:"Couldn't load the schedule right now.",
         dataLabel:'Schedule data', updated:'updated',
         actCombined:'Tap a showtime to open the cinema\u2019s own page',
         actDoor:'Tickets are sold at the door · {host}',
         actReserve:'Tap a showtime to reserve seats on {host}',
         actList:'Tap a showtime to open the programme on {host}',
         actBuy:'Tap a showtime to buy tickets on {host}' }
  };
  const LN = {
    fi:{FI:'suomi', EN:'englanti', SE:'ruotsi', JA:'japani', FR:'ranska'},
    en:{FI:'Finnish', EN:'English', SE:'Swedish', JA:'Japanese', FR:'French'}
  };
  // Full nominatives above, not the old abbreviated "engl."/"ruots." forms: the audio
  // language now stands on its own with no role word, so it has to read as a noun.
  const LW = { fi:{S:'tekstit'}, en:{S:'subs'} };
  // "EN-A, FI-S, SE-S" reads "englanti · tekstit suomi/ruotsi": audio bare, subtitles
  // labelled, one entry per role rather than per language. The "/" matches how a single
  // multi-language code (FI-SE-S) has always rendered.
  function langTxt(code){
    if(!code) return '';
    const by = { A: [], S: [] };
    for(const c of code.split(/,\s*/)){
      const m = c.match(/^([A-Z]{2}(?:-[A-Z]{2})?)-(A|S)$/);
      if(!m) continue;
      for(const x of m[1].split('-')){
        const nm = LN[state.lang][x] || x;
        if(!by[m[2]].includes(nm)) by[m[2]].push(nm);
      }
    }
    const out = [];
    if(by.A.length) out.push(by.A.join('/'));
    if(by.S.length) out.push(LW[state.lang].S + ' ' + by.S.join('/'));
    return out.join(' · ');
  }
  // films.json is keyed by Finnkino's filmId. In a combined city view eventId is the
  // cross-chain merge key, so the id has to come from the show's own _eid — the same
  // resolution showSheet() already does. Without it English mode fell back to the
  // Finnish title for every film in every combined view.
  const filmEntry = m => {
    if(!films || !m) return null;
    const ids = [m.eventId, m._eid, ...(m.times || []).map(t => t._eid)];
    for(const id of ids) if(id && films[id]) return films[id];
    return null;
  };
  // Never translate m.title itself: that string is the key for mergeKey(), normTitle()
  // -> films-extra.json, the TMDB title cache and tmdb-aliases.json. This is display
  // only.
  const disp = m => {
    if(state.lang !== 'en') return m.title;
    const f = filmEntry(m);
    // Only Finnkino publishes an English title. Some others publish the original one,
    // which beats a Finnish distributor title in English mode; most publish neither,
    // so a Finnish title remains the honest fallback.
    return (f && ((f.t && f.t.en) || f.o)) || m.original || m.title;
  };

  /* ---------- theme ---------- */
  const store = { get k(){ try{return localStorage.getItem('kino-theme')}catch(e){return null} },
                  set k(v){ try{localStorage.setItem('kino-theme',v)}catch(e){} } };
  const applyTheme = t => document.documentElement.setAttribute('data-theme', t);
  applyTheme(store.k || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('#themeToggle').onclick = () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next); store.k = next;
  };

  /* ---------- persisted prefs ---------- */
  const prefs = {
    get(){ try{ return JSON.parse(localStorage.getItem('kino-prefs')||'{}'); }catch(e){ return {}; } },
    set(p){ try{ localStorage.setItem('kino-prefs', JSON.stringify(Object.assign(prefs.get(), p))); }catch(e){} }
  };

  /* ---------- date chips ---------- */
  let fiDay = L[state.lang].days;
  let calChip = null, dayBtns = {}, venueIndex = {}, providerMeta = {};
  let allVenues = [], cityGroups = {};
  const FI_TZ = 'Europe/Helsinki';
  const fiDayFmt  = new Intl.DateTimeFormat('sv-SE', { timeZone: FI_TZ });
  const fiTimeFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: FI_TZ, hour:'2-digit', minute:'2-digit' });
  const fiDate = d => fiDayFmt.format(d);            // Date -> 'YYYY-MM-DD' in Finland
  const fiTime = d => fiTimeFmt.format(d);           // Date -> 'HH:MM'  in Finland
  const fiToday = () => fiDate(new Date());
  const addDays = (iso, n) => { const t = new Date(iso + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
  const dowOf = iso => new Date(iso + 'T12:00:00Z').getUTCDay();
  const dmOf  = iso => { const [,m,d] = iso.split('-'); return `${+d}.${+m}.`; };
  // The picked day is persisted as an ISO date, not as an offset from today. The offset
  // had to be clamped to the chip range on every rebuild, so once horizons ran months out
  // (Gilda into December) picking a far date and then reloading — or just toggling the
  // language, which rebuilds the row — silently landed on today+13 with an empty list and
  // nothing on screen to explain it. An old `dayIdx` pref is ignored, which falls back to
  // today.
  function savedDay(){
    const d = prefs.get().day;
    const base = fiToday();
    if(typeof d !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d) || d < base) return null;
    // state.horizon is empty until the first area file lands. Unknown is not unlimited,
    // but the saved date was inside somebody's horizon when it was picked, and a date past
    // this venue's own horizon already has its own empty state ("ohjelmistoa ei ole vielä
    // julkaistu"), which explains itself.
    if(state.horizon && d > state.horizon) return null;
    return d;
  }
  function buildDays(){
    daysEl.innerHTML = '';
    const base = fiToday();
    const saved = savedDay() || base;
    const activate = el => { [...daysEl.children].forEach(c=>c.classList.remove('active')); el.classList.add('active'); };
    dayBtns = {};
    for(let i=0;i<5;i++){
      const iso = addDays(base, i);
      const b = document.createElement('button');
      b.className = 'day'; b.role = 'tab';
      const lbl = i===0 ? L[state.lang].today : (i===1 ? L[state.lang].tomorrow : fiDay[dowOf(iso)]);
      b.innerHTML = `<small>${lbl}</small><b>${dmOf(iso)}</b>`;
      b.onclick = () => { state.dateStr = iso; state.advanced = true; prefs.set({day:iso});
                          resetCalChip(); activate(b); loadSchedule(); };
      dayBtns[iso] = b;
      if(iso === saved){ b.classList.add('active'); state.dateStr = iso; }
      daysEl.appendChild(b);
    }
    // Calendar chip: opens the custom month picker (see openCal).
    const cal = document.createElement('button');
    cal.className = 'day'; cal.role = 'tab';
    cal.innerHTML = `<small>${L[state.lang].other}</small><b>📅</b>`;
    calChip = cal;
    cal.onclick = openCal;
    if(!dayBtns[saved]){
      state.dateStr = saved;
      cal.innerHTML = `<small>${fiDay[dowOf(saved)]}</small><b>${dmOf(saved)}</b>`;
      cal.classList.add('active');
    }
    daysEl.appendChild(cal);
  }

  /* ---------- month picker ---------- */
  // `dates` per venue is sparse (Gilda publishes 20 dates across 14 weeks), and a native
  // date input cannot disable individual days, so picking one was mostly a miss.
  const ymOf = iso => iso.slice(0, 7);
  const ymAdd = (ym, k) => {
    const [y, m] = ym.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1 + k, 1)).toISOString().slice(0, 7);
  };
  let calMonth = null;
  // The calendar chip shows the picked date while that date is the one being viewed, and
  // goes back to the 📅 face as soon as a quick chip takes over. Leaving the date on it
  // was a lie: the chip read "La 19.9." but tapping it opened the picker, because it is
  // the picker button, not a shortcut back to that date.
  function resetCalChip(){
    if(!calChip) return;
    calChip.innerHTML = `<small>${L[state.lang].other}</small><b>\u{1F4C5}</b>`;
    calChip.classList.remove('active');
  }
  function closeCal(){
    const w = document.querySelector('.cal-wrap');
    if(w) w.remove();
    document.removeEventListener('keydown', calKey);
  }
  function calKey(e){ if(e.key === 'Escape') closeCal(); }
  function openCal(){
    closeCal();
    const base = fiToday();
    const max = state.horizon || addDays(base, 13);
    calMonth = ymOf(state.dateStr > base ? state.dateStr : base);
    const wrap = document.createElement('div');
    wrap.className = 'cal-wrap';
    wrap.innerHTML = '<div class="cal" role="dialog" aria-modal="true"></div>';
    wrap.addEventListener('click', e => { if(e.target === wrap) closeCal(); });
    document.body.appendChild(wrap);
    document.addEventListener('keydown', calKey);
    drawCal(base, max);
  }
  function drawCal(base, max){
    const el = document.querySelector('.cal');
    if(!el) return;
    // No dates loaded yet: allow the whole range rather than locking the user out.
    const avail = (Array.isArray(state.dates) && state.dates.length) ? new Set(state.dates) : null;
    const [y, m] = calMonth.split('-').map(Number);
    const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;   // Monday first
    const title = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString(
      state.lang === 'fi' ? 'fi-FI' : 'en-GB', { month:'long', year:'numeric', timeZone:'UTC' });
    const dow = [1,2,3,4,5,6,0].map(i => `<span class="cal-dow">${fiDay[i]}</span>`).join('');
    let cells = '';
    for(let i = 0; i < lead; i++) cells += '<span class="cal-day pad"></span>';
    for(let d = 1; d <= days; d++){
      const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const has = iso >= base && iso <= max && (!avail || avail.has(iso));
      const cls = 'cal-day' + (has ? ' has' : ' off') + (iso === state.dateStr ? ' sel' : '');
      cells += has ? `<button class="${cls}" data-day="${iso}">${d}</button>`
                   : `<span class="${cls}">${d}</span>`;
    }
    const prevOk = ymAdd(calMonth, -1) >= ymOf(base);
    const nextOk = ymAdd(calMonth, 1) <= ymOf(max);
    el.innerHTML = `<div class="cal-head">
        <button class="cal-nav" data-mon="-1"${prevOk ? '' : ' disabled'} aria-label="&larr;">&lsaquo;</button>
        <b>${title}</b>
        <button class="cal-nav" data-mon="1"${nextOk ? '' : ' disabled'} aria-label="&rarr;">&rsaquo;</button>
      </div>
      <div class="cal-grid">${dow}${cells}</div>
      ${avail ? `<small class="cal-note">${L[state.lang].onlyDays}</small>` : ''}`;
    el.onclick = e => {
      const nav = e.target.closest('.cal-nav');
      if(nav && !nav.disabled){ calMonth = ymAdd(calMonth, +nav.dataset.mon); drawCal(base, max); return; }
      const day = e.target.closest('[data-day]');
      if(day){ closeCal(); selectDay(day.dataset.day); }
    };
  }

  // Each provider updates on its own schedule, so show every source's age. A scraper that
  // silently stops is otherwise invisible unless you happen to pick one of its venues.
  const STALE_H = 8;
  function ageHours(iso){
    const t = iso ? new Date(iso).getTime() : NaN;
    return isNaN(t) ? null : (Date.now() - t) / 36e5;
  }
  function renderHealth(){
    const el = document.querySelector('#sources');
    if(!el) return;
    const names = Object.keys(providerMeta);
    if(!names.length){ el.textContent = ''; return; }
    const parts = names.map(p => {
      const m = providerMeta[p], h = ageHours(m.generated);
      const nm = esc((SOURCE[p] || [p])[0]);
      if(h === null) return `<span class="src bad">${nm} ?</span>`;
      const cls = h > STALE_H ? 'src bad' : 'src';
      const mark = h > STALE_H ? '\u26a0 ' : '';
      return `<span class="${cls}">${mark}${nm} ${Math.round(h)}${L[state.lang].hours}</span>`;
    });
    // The key lives here rather than under the chain legend: it is reference material,
    // not something to scan past on the way to a showtime, and the word it decodes is
    // already on the card, in the times meta line and in the sheet. A second key row
    // above the list read as clutter.
    el.innerHTML = `${L[state.lang].sources}: ${parts.join(' · ')}`
      + tagKey(state.shows || []);
  }

  // "12€" -> 12. Only Kinoset and Kino Akseli publish prices so far.
  function priceLabel(rows){
    const vals = rows.map(r => parseFloat(String(r.price || '').replace(',', '.')))
      .filter(v => !isNaN(v) && v > 0);
    if(!vals.length) return '';
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const fmt = v => (Math.round(v * 100) % 100 === 0 ? String(Math.round(v)) : v.toFixed(2));
    return lo === hi ? `${fmt(lo)}\u20ac` : `${L[state.lang].from} ${fmt(lo)}\u20ac`;
  }

  const favBtn = $('#favBtn');
  // Nothing about a bare star says "this venue opens next time", so label it until the
  // user has set one. Short label on phones, full sentence on desktop.
  function syncFav(){
    const t = L[state.lang];
    const anyFav = !!prefs.get().fav;
    const on = prefs.get().fav === state.area;
    const label = window.matchMedia('(max-width:560px)').matches ? t.favCta : t.favCtaLong;
    favBtn.innerHTML = on
      ? '\u2605'
      : (anyFav ? '\u2606' : `\u2606 <span class="fav-cta">${label}</span>`);
    favBtn.classList.toggle('labelled', !on && !anyFav);
    favBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    favBtn.title = on ? t.favOn : t.favOff;
    favBtn.setAttribute('aria-label', on ? t.favOn : t.favOff);
  }
  favBtn.onclick = () => {
    const on = prefs.get().fav === state.area;
    prefs.set({ fav: on ? '' : state.area });
    syncFav();
  };

  function netErrorHtml(e){
    return `<div class="status">${L[state.lang].loadFail}<br><small>${esc(e.message||e)}</small></div>`;
  }
  // Every provider string crosses an innerHTML boundary somewhere, and every adapter
  // strips tags *then* unescapes, so a source page's entities arrive here as live HTML
  // metacharacters — a stored-XSS surface fed by nine third-party sites, and a rendering
  // bug on harmless titles ("Movie &lt;3"). Escape at the sink, never in the adapters:
  // the verbatim title is the key for normTitle(), films-extra.json and tmdb-aliases.
  const esc = v => String(v ?? '').replace(/[&<>"']/g,
    ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  // href/src values also come from provider JSON. esc() stops attribute breakout; this
  // additionally rejects any scheme that is not http(s), so a hostile booking URL cannot
  // be javascript: or data:. Scheme-less (repo-relative poster paths) stays allowed.
  const safeUrl = u => {
    u = String(u || '').trim();
    if(!u) return '';
    const m = u.match(/^([a-z][a-z0-9+.\-]*):/i);
    return (!m || /^https?$/i.test(m[1])) ? esc(u) : '';
  };
  const jsonCache = {};
  async function fetchJSON(path){
    // No cache-buster: GitHub Pages serves max-age=600 and data updates 4x/day, so a
    // schedule up to 10 min stale is immaterial and the stale banner covers the
    // pathological case. The buster made every fetch a unique URL, so the SW cached a
    // fresh copy of every file per app open (tens of MB on a phone, evicted only on a
    // CACHE bump) and the HTTP cache never served anything.
    const r = await fetch(path);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  // Finnkino names carry the city as the last word ("Plevna Tampere"); BioRex ships city
  // explicitly. Group by city, since people pick a place before they pick a chain.
  function cityOf(a){
    if(a.city) return a.city;
    const w = (a.name || '').trim().split(/\s+/);
    return w.length > 1 ? w[w.length-1] : (a.name || '');
  }
  // "Itis Helsinki" never says Finnkino, so prefix the chain and drop the city — the
  // optgroup label already carries the city. BioRex names are already chain-prefixed.
  // Every provider-specific string and colour comes from data/providers.json, which
  // the pipeline generates from scripts/providers/registry.py. Adding a provider is a
  // registry entry plus an adapter: no edit in this file. The fallback keeps the app
  // usable when that file is missing (first deploy, or an old service worker).
  const PROV_FALLBACK = [
    { id:'finnkino',     label:'Finnkino',      host:'finnkino.fi',       accent:'#E4551F', book:'buy' },
    { id:'biorex',       label:'BioRex',        host:'biorex.fi',         accent:'#1273D4', book:'buy' },
    { id:'kinoset',      label:'Kinoset',       host:'kinoset.fi',        accent:'#0E9B63', book:'reserve' },
    { id:'kotkanleffat', label:'Kotkan Leffat', host:'kotkanleffat.fi',   accent:'#C42749', book:'buy' },
    { id:'riviera',      label:'Riviera',       host:'rivieracinemas.fi', accent:'#7B3FD4', book:'buy' },
    { id:'gilda',        label:'Gilda',         host:'gilda.fi',          accent:'#D62D8F', book:'buy' },
    { id:'savonkinot',   label:'Savon Kinot',   host:'savonkinot.fi',     accent:'#0C8FA8', book:'buy' },
    { id:'orion',        label:'Cinema Orion',  host:'cinemaorion.fi',    accent:'#4E7A16', book:'buy' },
    { id:'kinoakseli',   label:'Kino Akseli',   host:'kinoakseli.fi',     accent:'#B8801A', book:'door' }
  ];
  let PROVIDERS = [];
  const CHAIN = {}, SOURCE = {}, BOOK = {};
  function applyProviders(list){
    PROVIDERS = (Array.isArray(list) && list.length) ? list : PROV_FALLBACK;
    for(const o of [CHAIN, SOURCE, BOOK]) for(const k of Object.keys(o)) delete o[k];
    for(const p of PROVIDERS){
      if(!p || !p.id) continue;
      CHAIN[p.id] = p.label || p.id;
      SOURCE[p.id] = [p.label || p.id, p.host || ''];
      BOOK[p.id] = p.book || 'buy';
    }
    let el = document.getElementById('chainpal');
    if(!el){ el = document.createElement('style'); el.id = 'chainpal'; document.head.appendChild(el); }
    el.textContent = PROVIDERS.filter(p => p && p.id && p.accent)
      .map(p => `.chain-${p.id}{--chain:${p.accent}}`).join('');
  }
  applyProviders(null);
  async function loadProviders(){
    try { applyProviders((await fetchJSON('data/providers.json')).providers); }
    catch(_){ applyProviders(null); }   // fallback already applied; stay quiet
  }
  function shortOf(a){
    if(a.short) return a.short;
    const city = cityOf(a);
    const n = (a.name || '').trim();
    return n.endsWith(' ' + city) ? n.slice(0, -(city.length + 1)).trim() : n;
  }
  function labelOf(a){
    const chain = CHAIN[a.provider] || '';
    const short = shortOf(a);
    return (chain && !short.startsWith(chain)) ? `${chain} ${short}` : short;
  }
  // Split out of fillAreaSelect: the language toggle has to relabel the picker
  // ("Kaikki Helsinki" / "All in Helsinki") without resetting the selected venue.
  function buildAreaOptions(){
    const areas = allVenues;
    const byCity = new Map();
    for(const a of areas){
      const c = cityOf(a);
      if(!byCity.has(c)) byCity.set(c, []);
      byCity.get(c).push(a);
    }
    const cities = [...byCity.keys()].sort((x,y)=>x.localeCompare(y,'fi'));
    cityGroups = {};
    for(const c of cities) cityGroups[c] = byCity.get(c).map(a => a.id);
    const opt = a => `<option value="${esc(a.id)}">${esc(labelOf(a))}</option>`;
    // Cities with more than one screen get a combined entry at the top of their group.
    areaSel.innerHTML = cities.map(c => {
      const vs = byCity.get(c).sort((x,y)=>labelOf(x).localeCompare(labelOf(y),'fi'));
      const all = vs.length > 1
        ? `<option value="city:${esc(c)}">${L[state.lang].allIn} ${esc(c)} (${vs.length})</option>`
        : '';
      return `<optgroup label="${esc(c)}">${all}${vs.map(opt).join('')}</optgroup>`;
    }).join('');
  }
  function fillAreaSelect(areas){
    allVenues = areas.slice();
    venueIndex = {};
    for(const a of areas) venueIndex[a.id] = Object.assign({}, a, { short: shortOf(a), label: labelOf(a) });
    buildAreaOptions();
    // A starred venue opens every time; otherwise fall back to the last one browsed.
    const pr = prefs.get();
    const known = id => !!id && (areas.some(a => a.id === id) ||
      (id.startsWith('city:') && (cityGroups[id.slice(5)] || []).length > 1));
    state.area = known(pr.fav) ? pr.fav : (known(pr.area) ? pr.area : areas[0].id);
    areaSel.value = state.area;
    syncFav();
  }

  async function loadAreas(areasPromise){
    // No fallback path: if same-origin areas.json fails, the site itself is broken or
    // the visitor is offline on first visit, and the boot's catch says so. The old
    // XML/CORS-proxy chain could not have helped in either case — see IDEAS.
    const data = await (areasPromise || fetchJSON('data/areas.json'));
    const areas = (data.areas || []).filter(a => a.id && a.id !== '1029')
      .map(a => ({ ...a, provider:'finnkino' }));
    providerMeta = { finnkino: { generated: data.generated, venues: areas.length } };
    if(!areas.length) throw new Error('Theatre list came back empty');
    // Extra providers, each optional: a missing or broken file must not take the app down.
    // Fetched in parallel — awaiting eight files one at a time was most of the startup
    // waterfall on mobile. Promise.all keeps array order, so the picker order is stable.
    const extra = [];
    // Finnkino is skipped: it is the areas.json above, in the legacy numeric shape.
    const provIds = PROVIDERS.map(p => p.id).filter(id => id !== 'finnkino');
    const provFiles = await Promise.all(provIds.map(
      prov => fetchJSON(`data/venues-${prov}.json`).catch(() => null)));
    provIds.forEach((prov, i) => {
      const j = provFiles[i];
      if(!j) return;
      const vs = (j.venues || []).filter(v => v.id && v.name);
      for(const v of vs) extra.push({ ...v, provider: prov });
      if(vs.length) providerMeta[prov] = { generated: j.generated, venues: vs.length };
    });
    state.generated = data.generated;
    fillAreaSelect(areas.concat(extra));
    renderHealth();
    areaSel.addEventListener('change', () => {
      state.area = areaSel.value; prefs.set({area: state.area});
      state.chains = null;
      syncFav(); loadSchedule();
    });
  }

  /* ---------- schedule ---------- */
  const pad = n => String(n).padStart(2,'0');

  // Jump to a date and keep the chip row in sync, whether it is a chip or the picker.
  function selectDay(iso){
    state.dateStr = iso;
    state.revealed.clear();
    prefs.set({ day: iso });
    [...daysEl.children].forEach(c => c.classList.remove('active'));
    if(dayBtns[iso]){
      resetCalChip();
      dayBtns[iso].classList.add('active');
    } else if(calChip){
      calChip.innerHTML = `<small>${fiDay[dowOf(iso)]}</small><b>${dmOf(iso)}</b>`;
      calChip.classList.add('active');
    }
    return loadSchedule();
  }

  // Combined city view: fetch each venue in the city and fold them into one payload.
  // eventId is rewritten to the merge key so grouping, the sheet and the URL hash all
  // keep working unchanged.
  async function loadCity(city){
    const ids = cityGroups[city] || [];
    const parts = await Promise.all(ids.map(async id => {
      try { return await fetchJSON(`data/area-${id}.json`); }
      catch(_) { return null; }
    }));
    const shows = [], dates = new Set();
    let generated = '';
    parts.forEach((p, i) => {
      if(!p) return;
      if(!generated || (p.generated && p.generated < generated)) generated = p.generated || '';
      (p.dates || []).forEach(d => dates.add(d));
      const v = venueIndex[ids[i]] || {};
      for(const s of (p.shows || [])){
        shows.push({ ...s, eventId: mergeKey(s.title), _eid: s.eventId,
                     venueShort: v.short || s.theatre, venueLabel: v.label || v.short || s.theatre,
                     provider: s.provider || v.provider });
      }
    });
    mergeIds(shows);
    const list = [...dates].sort();
    return { generated, dates: list, horizon: list[list.length-1] || '', shows };
  }

  // Two signals say "same film" and neither is complete on its own, so treat both as
  // links rather than picking one. The title key merges chains that agree on the title;
  // the TMDB id merges chains that do not ("Mutiny" vs "Mutiny - Lavastettu
  // syylliseksi"). Choosing the id when present *unmerged* pairs that used to work:
  // "Maailman rikkain nainen" resolved an id at Gilda and none at Finnkino, so one row
  // was keyed by id and its twin by title. Union them and take the group root.
  function mergeIds(shows){
    const parent = new Map();
    const find = k => { while(parent.get(k) !== k) { parent.set(k, parent.get(parent.get(k))); k = parent.get(k); } return k; };
    const add = k => { if(!parent.has(k)) parent.set(k, k); return k; };
    const union = (a, b) => { a = find(add(a)); b = find(add(b)); if(a !== b) parent.set(b, a); };
    for(const s of shows){
      add(s.eventId);
      if(s.tmdbId) union(s.eventId, `tmdb:${s.tmdbId}`);
    }
    for(const s of shows) s.eventId = find(s.eventId);
  }

  async function loadSchedule(){
    main.innerHTML = `<div class="status"><div class="reel"></div>${L[state.lang].loadingSchedule}</div>`;
    try {
      if(!jsonCache[state.area]){
        jsonCache[state.area] = state.area.startsWith('city:')
          ? await loadCity(state.area.slice(5))
          : await fetchJSON(`data/area-${state.area}.json`);
      }
      const cache = jsonCache[state.area];
      if(cache.generated) state.generated = cache.generated;
      state.dates = Array.isArray(cache.dates) ? cache.dates : null;
      state.horizon = cache.horizon || '';
      state.shows = cache.shows
        .map(s => ({ ...s, start: new Date(s.start) }))
        .filter(s => fiDate(s.start) === state.dateStr);
      // Late evening with nothing left today: move to the next day that has shows.
      if(!state.advanced && state.dateStr === fiToday() && !state.shows.length){
        const next = (state.dates || []).find(x => x > state.dateStr);
        if(next){
          state.advanced = true;
          selectDay(next);
          return;
        }
      }
      render();
      renderHealth();
      renderStatus();
      // The example is drawn from the shows now on screen, so it is refreshed with them
      // rather than only at startup or on a language switch.
      if(searchEl && !searchEl.value) searchEl.placeholder = searchHint();
    } catch(e){
      main.innerHTML = netErrorHtml(e);
    }
  }

  // Stale banner and footer credit. Pulled out of loadSchedule so applyLang can
  // redraw them: they carry translated strings and used to stay stale until reload.
  function renderStatus(){
    const staleEl = document.querySelector('#stale');
    if(!staleEl || !state.generated) return;
    const ageH = (Date.now() - new Date(state.generated).getTime()) / 36e5;
    if(ageH > STALE_H){
      // Name the provider: every source runs on its own schedule.
      const vv = venueIndex[state.area] || {};
      const nm = (SOURCE[vv.provider] || SOURCE.finnkino)[0];
      staleEl.textContent = `\u26a0 ${nm}: ${L[state.lang].staleOne} `
        + `(${Math.round(ageH)} ${L[state.lang].hours})`;
      staleEl.style.display = 'block';
    } else {
      staleEl.style.display = 'none';
    }
    const t = new Date(state.generated);
    const combined = state.area.startsWith('city:');
    const v = venueIndex[state.area] || {};
    const [src, host] = combined
      ? [L[state.lang].manySources, '']
      : (SOURCE[v.provider] || SOURCE.finnkino);
    const stamp = t.toLocaleString('fi-FI',
      {day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
    // book mode per provider: door = sold at the door, reserve = free seat
    // reservation rather than payment. From the registry, not from an id test.
    const bk = BOOK[v.provider] || 'buy';
    const T = L[state.lang];
    const act = (combined ? T.actCombined
      : bk === 'door' ? T.actDoor
      : bk === 'reserve' ? T.actReserve
      : bk === 'list' ? T.actList
      : T.actBuy).replace('{host}', host);
    document.querySelector('footer').textContent =
      `${T.dataLabel}: ${src} · ${T.updated} ${stamp} · ${act}`;
  }

  /* ---------- render ---------- */
  // What the search box matches: the title, the original title, and the genres — in
  // *both* languages, so "comedy" finds a film the Finnish UI labels Komedia and vice
  // versa. Genre ids are checked through the same id -> name maps the card renders from,
  // with the provider's own genre string as the fallback for films TMDB never matched.
  // Punctuation and spacing are not part of what anyone means by a title: nobody types
  // "Spider-Man" with the hyphen in the right place, and "spiderman", "spider man" and
  // "spider-man" are one search. Diacritics fold too, so "katyrit" finds "Kätyrit".
  // Everything non-alphanumeric is removed from both sides rather than replaced with a
  // space, so the query need not guess the separator either.
  // The example in the placeholder is the film with the most showtimes on screen — a
  // decent "what is big right now" signal that costs nothing and never goes stale, unlike
  // a hardcoded title. Shortened at a colon so "Spider-Man: Brand New Day" becomes
  // "Spider-Man", which is what someone would actually type.
  function popularTitle(){
    const count = new Map();
    for(const s of state.shows){
      if(!s.title) continue;
      count.set(s.title, (count.get(s.title) || 0) + 1);
    }
    let best = '', n = 1;
    for(const [t, c] of count) if(c > n) { best = t; n = c; }
    const short = best.split(/\s*[:–]\s*/)[0].trim();
    return short.length >= 3 ? short : '';
  }
  function searchHint(){
    const ex = popularTitle();
    return ex ? `${L[state.lang].searchEg} ${ex} ${L[state.lang].searchOr}` : L[state.lang].filter;
  }

  const searchKey = x => (x || '').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '');

  function haystack(s){
    if(s._hay) return s._hay;
    const parts = [s.title || '', s.original || '', s.genres || ''];
    const ids = Array.isArray(s.gids) ? s.gids : [];
    if(ids.length && genreNames){
      for(const lang of ['fi', 'en']){
        const map = genreNames[lang];
        if(map) for(const id of ids) if(map[id]) parts.push(map[id]);
      }
    }
    // Both forms: the spaced one so a two-word query still reads naturally, and the
    // collapsed one so punctuation and spacing stop mattering.
    return (s._hay = parts.join(' ').toLowerCase() + ' ' + parts.map(searchKey).join(' '));
  }

  function passFilters(s){
    const q = state.filter.trim().toLowerCase();
    if(q && !haystack(s).includes(q) && !haystack(s).includes(searchKey(q))) return false;
    if(state.fLang && !/FI(?:-[A-Z]{2})?-A/.test(s.lang || '')) return false;
    // Rating first, so the filter can never admit a restricted film — the cinema
    // enforces the age limit at the door and this is only a browse aid. Genre ids then
    // remove the merely-unrestricted: documentaries and dramas. Whitelisting Animation
    // and Family alone was tried and rejected — TMDB tags Marsupilami as Adventure,
    // Comedy, so a K-7 family comedy would have vanished from the filter. A film with no
    // ids stays on rating alone.
    if(state.fKids){
      if(!(s.rating === 'S' || s.rating === 'K-7')) return false;
      const g = Array.isArray(s.gids) ? s.gids : [];
      if(g.length && !g.includes(16) && !g.includes(10751)
         && (g.includes(99) || g.includes(18))) return false;
    }
    if(state.chains && s.provider && !state.chains.has(s.provider)) return false;
    return true;
  }

  function renderTimes(){
    const now = new Date();
    const rows = state.shows.filter(passFilters).sort((a,b) => a.start - b.start);
    const timesLegend = labelVenues(state.shows) ? chainLegend(state.shows, 'top') : '';
    if(!rows.length){ main.innerHTML = timesLegend + `<div class="status">${emptyMsg()}${nextDayLink()}</div>`; return; }
    // The film cards label the venue and tint by chain in a combined view; this list
    // never did, so "Sali 14" named a room in one of five cinemas, with no colour and no
    // cinema, under a legend it had no connection to. The stub is a fixed 158 px ticket
    // and its label column is ~75 px, so "Kinopalatsi · Sali 14" would truncate to
    // "Kinopalat…" and lose both halves. The venue goes on the meta line instead, which
    // has the full row width, and the stub carries the chain tint.
    const multi = labelVenues(state.shows);
    const tinted = multi;
    main.innerHTML = rows.map(s => {
      const past = s.start < now;
      const t = fiTime(s.start);
      const cls = past ? ' past' : (s.soldOut ? ' sold' : '');
      const where = venueName(s);
      const tint = tinted && s.provider ? ` chain-${esc(s.provider)}` : '';
      const venue = multi && where ? `<span class="theatre-tag">${esc(where)}</span>` : '';
      return `<div class="trow">
        <a class="stub${cls}${tint}" style="--notch:${past?52:56}px" href="${safeUrl(s.url)}" target="_blank" rel="noopener">
          <span class="time">${t}</span><span class="aud"><span class="loc">${esc(s.aud)}${s.soldOut && !past ? ' · ' + L[state.lang].soldout : ''}</span>${glyphRow((s.method||'').split(' · ').map(glyphOf).join('') + ageGlyph(s))}</span></a>
        <div class="tinfo" data-id="${esc(s.eventId)}"><b>${esc(disp(s))}</b>
          <small>${[venue, esc(s.rating), s.len ? esc(s.len)+' '+L[state.lang].min : '', esc(s.method), esc(langTxt(s.lang))].filter(Boolean).join(' · ')}</small></div>
      </div>`;
    }).join('');
  }

  // Filters beat everything; past the published horizon is not the same as a quiet day.
  // "Tripla" does not tell you it is BioRex, so a combined list needs a chain key.
  // In the list the chain key doubles as a filter; in the sheet it stays a plain key.
  function chainLegend(shows, extraClass){
    const chains = [...new Set(shows.map(s => s.provider).filter(Boolean))].sort();
    if(chains.length < 2) return '';
    const interactive = (extraClass || '').includes('top');
    if(!interactive){
      return `<div class="legend ${extraClass || ''}">${chains
        .map(c => `<span class="lg chain-${esc(c)}">${esc((SOURCE[c] || [c])[0])}</span>`).join('')}</div>`;
    }
    // "Kaikki" only appears while something is filtered: an always-on reset that never
    // does anything is just noise in the row.
    const reset = state.chains
      ? `<button class="lg-btn lg-all" data-chain="*">${L[state.lang].allChains}</button>` : '';
    return `<div class="legend top" role="group" aria-label="Suodata ketjun mukaan">${chains
      .map(c => {
        const on = !state.chains || state.chains.has(c);
        return `<button class="lg-btn chain-${esc(c)}${on ? ' on' : ''}" data-chain="${esc(c)}"
                  aria-pressed="${on}">${esc((SOURCE[c] || [c])[0])}</button>`;
      }).join('') + reset}</div>`;
  }

  // Additive filter: from the default (no selection, everything shown) the first click
  // isolates that chain rather than hiding it, then each further click adds one. Clicking
  // the last remaining chain off, or selecting them all, means "no filter" again.
  function toggleChain(c, all){
    if(c === '*'){ state.chains = null; render(); return; }
    const set = state.chains ? new Set(state.chains) : new Set();
    set.has(c) ? set.delete(c) : set.add(c);
    state.chains = (set.size === 0 || set.size === all.length) ? null : set;
    render();
  }
  main.addEventListener('click', e => {
    const goto = e.target.closest('[data-goto]');
    if(goto){ selectDay(goto.dataset.goto); return; }
    const rev = e.target.closest('[data-reveal]');
    if(rev){
      const id = rev.dataset.reveal;
      state.revealed.has(id) ? state.revealed.delete(id) : state.revealed.add(id);
      render();
      return;
    }
    const b = e.target.closest('.lg-btn');
    if(!b) return;
    const all = [...new Set(state.shows.map(s => s.provider).filter(Boolean))].sort();
    toggleChain(b.dataset.chain, all);
  });

  function emptyMsg(){
    const t = L[state.lang];
    if(state.filter || state.fLang || state.fKids) return t.nomatch;
    if(state.horizon && state.dateStr > state.horizon) return t.notpublished;
    if(state.dateStr === fiToday()) return t.nomore;
    return t.noshows;
  }
  // Long horizons are sparse, so an empty day should point at the next real one instead
  // of leaving the visitor to hunt through the picker.
  function nextDayLink(){
    if(state.filter || state.fLang || state.fKids) return '';
    const today = fiToday();
    const next = (state.dates || []).find(d => d > state.dateStr && d >= today);
    if(!next) return '';
    return `<button class="nextday" data-goto="${next}">${L[state.lang].nextShows}`
      + ` &rarr; ${fiDay[dowOf(next)]} ${dmOf(next)}</button>`;
  }

  // Whether a showtime needs its venue spelled out. It must depend on the *view*, not on
  // how many venues happen to have shows on the day being looked at: a combined city view
  // showing a single 14:00 with no venue and a blank auditorium (single-screen houses
  // render one) tells the visitor nothing at all.
  // An age limit that belongs to the screening rather than the film: a licensed bar
  // auditorium is 18+ even when the film is K-12. It has to sit on the showtime, since
  // one film at one venue can have both kinds on the same day.
  const ageOf = s => (s.age && s.age !== s.rating) ? s.age : '';
  const ageChip = s => ageOf(s) ? `<span class="agelim">${esc(ageOf(s))}</span>` : '';
  // Glyphs for the two tags that repeat on every stub. Everything else stays a word:
  // LUXE, iSense and IMAX are brand names people already read, and an invented icon for
  // each would need its own legend entry to say less than the word does.
  const GLYPH = { anniskelu: ['A', 'Anniskelu'] };
  // A stub label was reading "Tennispalatsi · LUXE 8 · 2D · LUXE": the room name already
  // carries the format, and 2D is on nearly every screening, so it says nothing. Drop a
  // tag the auditorium name already contains, and drop 2D outright — the exceptions
  // (IMAX, 3D, iSense) are what a visitor is actually looking for.
  const stubTags = (tags, aud) => tags.filter(t =>
    t && !/^2d$/i.test(t) && !(aud || '').toLowerCase().includes(t.toLowerCase()));
  const glyphRow = html => html ? `<span class="glyphs">${html}</span>` : '';
  // Premiere date, from films.json (Finnkino only — nobody else publishes one, and a
  // guessed premiere is worse than none). Shown while it is still ahead, because that is
  // when it changes a decision: tickets go on sale days before a film opens, so a
  // bookable showtime can sit in front of an opening night. Once the film has opened the
  // badge is noise and disappears.
  const premiereOf = m => {
    const f = filmEntry(m);
    const rd = f && f.rd;
    if(!rd || rd < fiToday()) return '';
    const [y, mo, d] = rd.split('-');
    return `${+d}.${+mo}.`;
  };
  // Score as a ring: arc length for a glance, the number for the actual value, and the
  // vote count beside it because 7.1 from 41 votes and 7.1 from 15 000 are not the same
  // claim. `thin` dims a rating resting on a handful of votes rather than hiding it.
  const VOTE_SOLID = 25;
  const shortVotes = n => n >= 1000 ? `${(n / 1000).toFixed(n < 10000 ? 1 : 0)}k` : `${n}`;
  const scoreRing = m => {
    const v = m.tmdb;
    if(!v) return '';
    const n = m.votes || 0;
    const thin = n && n < VOTE_SOLID ? ' thin' : '';
    const lbl = n ? `${v} · ${n} ${L[state.lang].votes}` : `${v}`;
    return `<span class="ring${thin}" style="--v:${Math.round(v * 10)}" title="${esc(lbl)}"`
      + ` aria-label="${esc(lbl)}"><b>${esc(v)}</b></span>`
      + (n ? `<span class="votes">${esc(shortVotes(n))}</span>` : '');
  };

  const premiereChip = m => {
    const d = premiereOf(m);
    return d ? `<span class="fmt prem">${L[state.lang].premiere} ${d}</span>` : '';
  };
  const glyphOf = tag => {
    const g = GLYPH[(tag || '').toLowerCase()];
    return g ? `<span class="gl" title="${g[1]}" aria-label="${g[1]}">${g[0]}</span>` : '';
  };
  const ageGlyph = s => {
    const a = ageOf(s);
    if(!a) return '';
    const n = a.replace(/[^0-9]/g, '') || a;
    return `<span class="gl age" title="${esc(a)}" aria-label="${esc(a)}">${esc(n)}+</span>`;
  };
  // Only rendered when the day's shows actually carry these, so it never explains
  // something that is not on screen.
  function tagKey(shows){
    const hasA = shows.some(s => /anniskelu/i.test(s.method || ''));
    const hasAge = shows.some(s => ageOf(s));
    if(!hasA && !hasAge) return '';
    const bits = [];
    if(hasA) bits.push(`<span><span class="gl">A</span>${L[state.lang].keyAnniskelu}</span>`);
    if(hasAge) bits.push(`<span><span class="gl age">18+</span>${L[state.lang].keyAge}</span>`);
    return `<div class="tagkey">${bits.join('')}</div>`;
  }

  // The chain tint is on for every stub in a combined view, including a day served by a
  // single chain. It was briefly gated on two chains being present, because colour with
  // no legend explained nothing — but that was the wrong end of the problem: the stub
  // label was the thing failing to name the chain, and it now does. With the meaning
  // carried by words, colour is a scanning aid, and it only becomes one if it is always
  // there to be learned. The legend keeps its own rule and stays hidden below two chains,
  // where it would be a filter with nothing to filter.
  //
  // In a combined view a stub must name the *cinema*, not the district. "Punavuori",
  // "Kallio", "Tripla", "Redi" and "Kamppi" are all bare venue shorts, and on their own
  // they say nothing about which chain — Punavuori is a neighbourhood of Helsinki, not a
  // cinema. The chain colour used to fill that gap, which broke the app's own rule that
  // colour never carries meaning alone, and fell apart entirely on a day served by one
  // chain, where there is no legend and no tint. So the label carries the chain:
  // "Riviera Punavuori". labelOf() already omits the prefix when the short starts with
  // the chain name, so Finnkino venues do not become "Finnkino Finnkino Itis".
  const venueName = s => s.venueLabel || s.venueShort || (s.theatre || '').split(',')[0];

  const labelVenues = shows =>
    (state.area || '').startsWith('city:') || new Set(shows.map(s => s.theatre)).size > 1;

  function render(){
    if(state.view === 'times'){ renderTimes(); return; }
    const now = new Date();
    const byEvent = new Map();
    // Facts about the *film* are folded from every showtime it has, filtered or not, so
    // they do not move when a filter changes which chain's screenings survive. Chains
    // disagree: Finnkino calls "Laula minulle Arja" "Dokumentti, Kotimainen" and Gilda
    // calls it "Dokumentti", so with "Suom. puhe" on — which drops Finnkino's subtitled
    // screenings — the genres used to change under the visitor. `lang` is deliberately
    // NOT in this list: it belongs to the screening, and showing "tekstit suomi/ruotsi"
    // from a screening the filter just removed would be wrong.
    const FILM_FIELDS = ['tmdb','votes','tr','img','len','genres','rating','original','gids'];
    const filmFacts = new Map();
    for(const s of state.shows){
      let g = filmFacts.get(s.eventId);
      if(!g) filmFacts.set(s.eventId, g = {});
      for(const f of FILM_FIELDS){
        // Longest wins for genres: "first non-empty" made the richer of two disagreeing
        // strings a matter of which venue happened to load first.
        if(f === 'genres'){
          if((s[f] || '').trim().length > (g[f] || '').trim().length) g[f] = s[f];
        } else if(!g[f] && s[f]) g[f] = s[f];
      }
    }
    for(const s of state.shows){
      if(!passFilters(s)) continue;
      if(!byEvent.has(s.eventId)) byEvent.set(s.eventId, { ...s, times:[] });
      const m = byEvent.get(s.eventId);
      Object.assign(m, filmFacts.get(s.eventId) || {});
      // Per-screening, so still folded from what survived the filter.
      if(!m.lang && s.lang) m.lang = s.lang;
      m.times.push(s);
    }
    const movies = [...byEvent.values()].sort((a,b)=>a.title.localeCompare(b.title,'fi'));

    if(!movies.length){
      main.innerHTML = `<div class="status">${emptyMsg()}${nextDayLink()}</div>`;
      return;
    }

    const multiTheatre = labelVenues(state.shows);
    const tintedList = multiTheatre;
    // Same title at two chains is one film: sort by the earliest showtime overall.
    if(multiTheatre) movies.forEach(m => m.times.sort((a,b)=>a.start-b.start));

    const listLegend = multiTheatre ? chainLegend(state.shows, 'top') : '';
    // A film whose every screening has passed is not the same as one still to come. Rather
    // than dimming it in place, where it reads as a broken card, group them at the end
    // under one heading. Said once, not annotated on every card.
    const spent = m => m.times.every(t => t.start < now);
    const live = movies.filter(m => !spent(m));
    const over = movies.filter(spent);
    const card = m => {
      const title = disp(m);
      const hue = [...m.title].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0, 7) % 360;
      const initials = (title.match(/\p{L}+|\d+/gu) || ['?']).slice(0,2).map(w=>w[0]).join('').toUpperCase();
      const tile = `<div class="poster blank" style="background:linear-gradient(160deg,hsl(${hue} 45% 32%),hsl(${(hue+45)%360} 50% 16%));color:hsl(${hue} 75% 82%)">${initials}</div>`;
      const posterUrl = safeUrl(m.img);
      const poster = posterUrl
        ? `<img class="poster" src="${posterUrl}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.f" data-f='${tile.replace(/'/g,"&#39;")}'>`
        : tile;
      const stubClass = multiTheatre ? 'stubs grid' : 'stubs';
      // method is per *showtime*, so a pill at film level claimed something about every
      // screening: 47 film/day combinations mix an Anniskelu screening with normal ones
      // at one venue, and the card used to inherit the first showtime's tags. Tags every
      // showtime shares stay on the card; the rest move onto the stub they belong to,
      // rather than vanishing — one IMAX screening among 2D ones must still say so.
      const tagsOf = t => (t.method || '').split(' · ').filter(Boolean);
      const tagSets = m.times.map(t => new Set(tagsOf(t)));
      const common = [...(tagSets[0] || [])].filter(f => tagSets.every(set => set.has(f)));
      // Past times are hidden behind a compact stub rather than a global toggle: it costs
      // no header space and only appears on the cards that have any. If *every* time has
      // passed they stay visible, since an empty card would read as a bug.
      const sorted = m.times.sort((a,b)=>a.start-b.start);
      const ahead = sorted.filter(t => t.start >= now);
      const gone = sorted.filter(t => t.start < now);
      const open = state.revealed.has(m.eventId);
      const shown = (!ahead.length || open) ? sorted : ahead;
      const stubs = shown.map(t => {
        const clock = fiTime(t.start);
        const past = t.start < now;
        const cls = past ? ' past' : (t.soldOut ? ' sold' : '');
        const where = venueName(t);
        const ownTags = stubTags(tagsOf(t).filter(f => !common.includes(f)), t.aud);
        const own = ownTags.filter(f => !glyphOf(f)).join(' · ');
        const glyphs = ownTags.map(glyphOf).join('') + ageGlyph(t);
        const loc = [(multiTheatre ? (t.aud ? `${where} · ${t.aud}` : where) : t.aud), own]
          .filter(Boolean).join(' · ')
          + (t.soldOut && !past ? ' · ' + L[state.lang].soldout : '');
        const tint = tintedList && t.provider ? ` chain-${esc(t.provider)}` : '';
        return `<a class="stub${cls}${tint}" style="--notch:${past?52:56}px" href="${safeUrl(t.url)}" target="_blank" rel="noopener" title="Buy tickets — ${esc([loc, ageOf(t)].filter(Boolean).join(' · '))}">
                  <span class="time">${clock}</span><span class="aud"><span class="loc">${esc(loc)}</span>${glyphRow(glyphs)}</span>
                </a>`;
      }).join('');
      const fmts = common.map(f => `<span class="fmt">${esc(f)}</span>`).join('');
      const meta1 = [
        scoreRing(m),
        m.rating ? `<span class="rating">${esc(m.rating)}</span>` : '',
        premiereChip(m),
        fmts
      ].filter(Boolean).join('');
      const price = priceLabel(m.times);
      // The past-times toggle sits on the meta line, not in the stub grid: a ticket-shaped
      // cell that is not a ticket reads as a broken showtime.
      const pastToggle = (gone.length && ahead.length)
        ? `<button class="pastlink" data-reveal="${esc(m.eventId)}" aria-expanded="${open}">`
          + (open ? L[state.lang].hidePast : `+${gone.length} ${L[state.lang].showPast}`)
          + `</button>`
        : '';
      const meta2 = [
        genresOf(m) ? `<span>${esc(genresOf(m))}</span>` : '',
        m.len ? `<span>${esc(m.len)} min</span>` : '',
        m.lang ? `<span>${esc(langTxt(m.lang))}</span>` : '',
        price ? `<span>${price}</span>` : '',
        pastToggle
      ].filter(Boolean).join('');
      return `<article class="movie" data-id="${esc(m.eventId)}">
                ${poster}
                <div class="info">
                  <h2 class="title">${esc(title)}</h2>
                  <div class="meta1">${meta1}</div>
                  ${meta2 ? `<div class="meta2">${meta2}</div>` : ''}
                  <div class="${stubClass}">${stubs}</div>
                </div>
              </article>`;
    };

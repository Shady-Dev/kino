<meta name="theme-color" content="#0D0E12">
<!-- Crawler and share-preview metadata. Deliberately carries no venue or city count:
     those live in README and IDEAS and would be a third place to keep in step. The
     chains change far less often. og:image is the 512 icon, the only image on this
     origin; a purpose-built 1200x630 card would preview better. -->
<meta name="description" content="Suomen elokuvateatterien näytösajat yhdessä paikassa: Finnkino, BioRex, Riviera, Savon Kinot, Kinoset ja muut. Valitse teatteri ja päivä.">

<meta name="twitter:image" content="https://leffavuoro.fi/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Archivo, self-hosted. It used to come from fonts.googleapis.com, which meant
     Google saw every visitor's IP on every load -- the last third-party request on
     this origin now that posters are mirrored. Same two woff2 subsets Google serves
     to a modern browser, same unicode-ranges, so latin-ext is still only fetched by
     a page that needs it. Licence in fonts/OFL.txt. Only latin is preloaded: it
     covers Finnish and Swedish, and preloading both would download 86 kB most
     visitors never use. */
  @font-face{font-family:'Archivo';font-style:normal;
    font-weight:100 900;font-stretch:62% 125%;font-display:swap;
    src:url(fonts/archivo-latin-ext.woff2) format('woff2');
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
  @font-face{font-family:'Archivo';font-style:normal;
    font-weight:100 900;font-stretch:62% 125%;font-display:swap;
    src:url(fonts/archivo-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --ink:#16181D; --muted:#5C6470;
    --line:#E3E6EB; --accent:#B8860B; --accent-soft:#F4E9CE;
    --chip-bg:#FFFFFF; --chip-hover:#16181D; --chip-hover-ink:#F6F7F9;
    --shadow:0 1px 3px rgba(22,24,29,.06);
    --past:#AEB4BE;
  }
  [data-theme="dark"]{
    --bg:#0D0E12; --surface:#16181F; --ink:#EDEDEA; --muted:#8B93A1;
    --line:#262A33; --accent:#E8B84B; --accent-soft:#2A2415;
    --chip-bg:#1C1F28; --chip-hover:#E8B84B; --chip-hover-ink:#0D0E12;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --past:#4A4F5A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    transition:background .25s,color .25s;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ===== Header ===== */
  /* The whole header used to be sticky, so the logo, language toggle and theme button
     held 58 px of every screen for the entire length of a 45-card list. They are the one
     row a reader scrolling films has no use for. Sticking the *controls* instead lets
     that row scroll away as ordinary content while the picker, search, dates and filters
     stay pinned.
     Deliberately no JavaScript, no scroll listener and no height constant: the wrapper
     pins itself at top:0, so nothing has to know how tall the branding row is, and
     nothing can drift when that row changes. Nothing resizes either, so the list never
     shifts under the reader -- the header's flow height is identical before and after.
     Scrolling back to the top brings the row back by itself, because it is just content. */
  header{
    z-index:50;
    background:var(--bg);
    transition:background .25s;
  }
  .pinned{
    position:sticky; top:0; z-index:50;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .bar{
    max-width:1100px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; gap:16px;
  }
  .logo{
    font-stretch:125%; font-weight:900; letter-spacing:.16em;
    text-transform:uppercase; font-size:1.05rem; user-select:none;
    white-space:nowrap;
  }
  @media (max-width:520px){
    .logo{font-size:.82rem; letter-spacing:.08em}
  }
  /* At 320 the wordmark, three language segments and the theme circle do not all fit at
     the 520px sizes. Measured: 103px + 86px + 38px + gaps against 292px of usable row. */
  @media (max-width:360px){
    .bar{gap:8px}
    .logo{font-size:.66rem; letter-spacing:.04em}
    .langseg button{padding:0 7px; font-size:.7rem; letter-spacing:0}
  }
  .logo span{color:var(--accent)}
  .bar .spacer{flex:1}
  #themeToggle{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    /* flex-shrink:0, or the language control squeezes this circle into an oval. It was
       only ever safe because nothing else shared the row. */
    flex:0 0 38px;
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    font-size:1rem; line-height:1; display:grid; place-items:center;
    transition:border-color .15s, transform .15s;
  }
  #themeToggle:hover{border-color:var(--accent); transform:rotate(15deg)}
  #themeToggle:focus-visible, .day:focus-visible, .stub:focus-visible, select:focus-visible,
  input:focus-visible, .tlink:focus-visible, .tinfo:focus-visible, .sheet-close:focus-visible,
  button:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ===== Controls ===== */
  .controls{
    max-width:1100px; margin:0 auto; padding:16px 20px 12px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  /* Form controls carry no shadow: a border on a flat surface is affordance enough,
     and the drop shadows were the one treatment making the header read as a generic
     component library rather than a timetable. The shadow stays on stubs (the thing
     you tap) and posters (imagery). */
  select, .search{
    font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 14px;
  }
  select{cursor:pointer; max-width:280px}
  select:hover, .fav:hover{border-color:var(--muted)}
  .fav{
    font:inherit; font-size:1.15rem; line-height:1; cursor:pointer;
    color:var(--muted); background:var(--surface);
    border:1px solid var(--line); border-radius:10px;
    padding:8px 12px;
  }
  .fav[aria-pressed="true"]{color:var(--accent); border-color:var(--accent)}
  .fav.labelled{display:inline-flex; align-items:center; gap:6px; color:var(--ink)}
  .fav .fav-cta{font-size:.78rem; font-weight:600; white-space:nowrap}
  /* Chain hint in combined views. The venue name carries the meaning; this only helps
     scanning, so it is never the sole signal. */
  /* --chain is set per chain by a <style> generated from data/providers.json.
     Not --accent: that is already the theme colour. */
  .stub[class*="chain-"]{border-left:3px solid var(--chain, var(--line))}

  /* themed dropdown on Chromium (progressive enhancement) */
  select, ::picker(select){appearance:base-select}
  ::picker(select){
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
    padding:6px; margin-top:6px;
  }
  select option{
    padding:9px 12px; border-radius:8px; font:inherit;
    background:var(--surface); color:var(--ink); cursor:pointer;
  }
  select option:hover, select option:focus{background:var(--accent-soft)}
  select option:checked{color:var(--accent); font-weight:700}
  select option::checkmark{color:var(--accent)}
  select optgroup{font:inherit; color:var(--muted); padding:6px 8px 2px}
  .search{flex:1; min-width:160px}
  .search::placeholder{color:var(--muted)}

  .days{
    max-width:1100px; margin:0 auto; padding:0 20px 16px;
    display:flex; gap:6px;
  }
  .day{
    flex:1 1 0; min-width:0; border:1px solid var(--line); background:var(--surface);
    border-radius:10px; padding:7px 2px; cursor:pointer; font:inherit;
    color:var(--muted); text-align:center; transition:all .15s;
    position:relative; overflow:hidden;
  }
  .day:hover:not(.active){border-color:var(--muted)}
  /* nowrap + overflow:hidden clipped "Huomenna" mid-glyph at 320px; an ellipsis at
     least says the label continues. */
  .day b, .day small{overflow:hidden; text-overflow:ellipsis}
  .day b{display:block; color:var(--ink); font-weight:700; font-size:.85rem; white-space:nowrap}
  .day small{display:block; font-size:.74rem; font-weight:600; letter-spacing:.01em; white-space:nowrap}
  /* Custom month picker: <input type=date> cannot dim individual days, and with
     horizons out to three months most days have no screening at all. */
  .cal-wrap{
    position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .cal{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.5); padding:14px; width:min(340px,100%);
  }
  .cal-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
  .cal-head b{font-size:.95rem; text-transform:capitalize}
  .cal-nav{
    font:inherit; font-size:1.1rem; line-height:1; cursor:pointer; color:var(--ink);
    background:var(--chip-bg); border:1px solid var(--line); border-radius:8px;
    padding:4px 12px;
  }
  .cal-nav[disabled]{opacity:.3; cursor:default}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center}
  .cal-dow{font-size:.68rem; font-weight:700; color:var(--muted); padding-bottom:4px}
  .cal-day{
    font:inherit; font-size:.85rem; padding:7px 0; border-radius:8px;
    border:1px solid transparent; background:none; color:var(--muted);
  }
  .cal-day.has{
    cursor:pointer; color:var(--ink); font-weight:700;
    background:var(--chip-bg); border-color:var(--line);
  }
  .cal-day.has:hover{border-color:var(--muted)}
  .cal-day.off{opacity:.28}
  .cal-day.pad{opacity:0}
  .cal-day.sel{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .cal-note{display:block; margin-top:10px; font-size:.7rem; color:var(--muted); text-align:center}
  /* Past showtimes are hidden by default. The toggle lives on the meta line, so it
     costs no header space and no slot in the showtime grid. */
  .pastlink{
    font:inherit; font-size:inherit; cursor:pointer; padding:0;
    background:none; border:0; border-bottom:1px dotted currentColor;
    color:var(--muted);
  }
  .pastlink:hover{color:var(--ink)}
  .daydone{
    max-width:1100px; margin:26px auto 4px; padding:0 0 8px;
    border-bottom:1px solid var(--line);
    font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
  }
  .nextday{
    /* Own line: inline-block left it stranded beside the message with a wide gap. */
    display:block; width:fit-content; margin:14px auto 0;
    font:inherit; font-size:.85rem; font-weight:600;
    cursor:pointer; color:var(--ink); background:var(--chip-bg);
    border:1px solid var(--line); border-radius:999px; padding:8px 16px;
  }
  .day.active{background:var(--ink); border-color:var(--ink)}
  .day.active b{color:var(--bg)}
  .day.active small{color:var(--accent)}

  /* ===== Movie list ===== */
  main{max-width:1100px; margin:0 auto; padding:8px 20px 80px}
  .status{padding:60px 0; text-align:center; color:var(--muted)}
  .status .reel{
    width:34px;height:34px;margin:0 auto 16px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .movie{
    display:flex; gap:18px; padding:20px 0;
    border-bottom:1px solid var(--line);
    /* Offscreen cards skip layout and paint. render() rebuilds the whole list through
       innerHTML (a decision recorded in IDEAS), so on a long day every card used to be
       laid out on every keystroke and day tap; with ~5 of 45 cards visible this cuts
       most of that. auto remembers the real height once a card has been on screen; the
       173px estimate only sizes the scrollbar before then. */
    content-visibility:auto; contain-intrinsic-size:auto 173px;
  }
  .poster{
    flex:0 0 92px; width:92px; height:132px; border-radius:8px;
    object-fit:cover; background:var(--surface); box-shadow:var(--shadow);
  }
  .poster.blank{display:grid;place-items:center;font-weight:800;font-size:1.5rem;letter-spacing:.04em;border:1px solid var(--line)}
  .info{flex:1; min-width:0}
  /* -.01em: Archivo at 800 tracks a touch loose at heading size; pulling it in makes
     the title read as display type against the untracked meta lines below it. */
  .title{font-size:1.15rem; font-weight:800; line-height:1.25; letter-spacing:-.01em}
  /* The trigger is a link because opening the sheet is hash navigation. It has to look
     like the heading it is, so only the focus ring gives it away. */
  .tlink{text-decoration:none; color:inherit; border-radius:3px}
  .tlink:hover, .tinfo:hover b{
    text-decoration:underline; text-decoration-thickness:1px;
    text-decoration-color:var(--muted); text-underline-offset:3px;
  }
  .meta1{
    /* 10px columns: the unboxed tags lean on whitespace where the border used to
       separate them. */
    margin-top:7px; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center;
    font-size:.82rem;
  }
  .meta2{
    margin-top:5px; color:var(--muted); font-size:.8rem;
    display:flex; flex-wrap:wrap; gap:4px 14px;
  }
  .rating{
    display:inline-block; border:1px solid var(--line); border-radius:5px;
    padding:1px 7px; font-weight:700; font-size:.72rem; color:var(--ink);
    background:var(--surface);
  }
  /* Format, runtime and method tags are passive metadata, not controls. Boxing them
     made them read as buttons beside the stubs; small uppercase type separated by the
     row gap says "tag" on its own. The age rating keeps its box: it is an official
     classification and the chip shape is what distinguishes it from the free-form tags. */
  .fmt{
    display:inline-block; padding:1px 0; font-size:.72rem;
    color:var(--muted); font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  }
  .fmt.prem{color:var(--accent); font-weight:700}
  /* A limit the *screening* imposes, not the film's classification: a licensed bar
     auditorium is 18+ even when the film is K-12. Deliberately not red and not KAVI's
     official symbol — that artwork means a legal age rating, which this is not, and a
     red chip inside a stub whose left rule is already Finnkino orange or Kotkan Leffat
     crimson would compete with the one thing colour does here. Separated by shape and
     weight instead, so it also survives greyscale and colourblind vision. */
  /* Two glyphs, no more. A stub's label column is about 75 px and truncates, so
     "Anniskelu" costs a third of it; the word survives on the card, where there is room.
     Monochrome and drawn with currentColor on purpose: the chain rule is the only thing
     in a stub allowed to carry colour. Never a glyph alone — each one has a title and an
     aria-label with the Finnish word, and the legend spells both out. */
  .gl{
    display:inline-grid; place-items:center; flex:0 0 auto;
    width:15px; height:15px; border-radius:50%;
    border:1px solid currentColor; color:var(--ink);
    font-size:.55rem; font-weight:800; letter-spacing:0; line-height:1;
  }
  .gl.age{width:auto; min-width:15px; padding:0 3px; border-radius:8px}
  .stub .gl{color:var(--muted)}
  .stub:hover .gl{color:inherit}
  .tagkey{display:inline-flex; flex-wrap:wrap; gap:10px; align-items:center;
    font-size:.7rem; color:var(--muted); margin-left:10px;
    padding-left:10px; border-left:1px solid var(--line)}
  @media (max-width:560px){
    .tagkey{margin-left:0; padding-left:0; border-left:0; margin-top:6px}
  }
  .tagkey .gl{color:var(--muted); margin-right:4px}
  .agelim{
    display:inline-block; margin-left:6px; border:1px solid var(--line);
    border-radius:4px; padding:0 4px; font-size:.66rem; font-weight:800;
    letter-spacing:.03em; color:var(--ink); background:var(--surface);
    white-space:nowrap; vertical-align:1px;
  }
  .stub:hover .agelim{color:inherit; border-color:currentColor; background:transparent; opacity:.85}

  /* Three languages do not fit a toggle that shows the one you would switch *to*: with
     two you can infer where you are, with three you cannot, and reaching the third is
     two taps with nothing saying so. Same segmented pill as Leffat/Ajat, so it is a
     pattern already on the page rather than a new one.
     flex:0 0 auto is load-bearing. The pill clips its overflow, so under flex pressure
     it does not push the row wide, it silently eats "EN". */
  .langseg{
    display:flex; flex:0 0 auto; overflow:hidden;
    border:1px solid var(--line); border-radius:19px; background:var(--surface);
  }
  .langseg button{
    border:0; background:transparent; color:var(--muted); cursor:pointer;
    font:inherit; font-weight:800; font-size:.74rem; letter-spacing:.06em;
    padding:0 10px; height:36px;
  }
  .langseg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
  .langseg button:hover:not([aria-pressed="true"]){color:var(--ink)}
  .movie{cursor:pointer}

  #overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0;
    pointer-events:none; transition:opacity .25s; z-index:90}
  #sheet{position:fixed; left:0; right:0; bottom:0; max-height:86vh; overflow:hidden;
    display:flex; flex-direction:column;
    background:var(--bg); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; transform:translateY(102%);
    transition:transform .28s cubic-bezier(.3,.8,.3,1); z-index:100;
    padding:18px 0 0; max-width:720px; margin:0 auto;}
  body.sheet-open #overlay{opacity:1; pointer-events:auto}
  body.sheet-open #sheet{transform:none}
  @media (min-width:700px){
    #sheet{
      bottom:auto; top:50%; left:50%; right:auto;
      width:min(680px, 92vw); max-height:82vh;
      border:1px solid var(--line); border-radius:18px;
      box-shadow:0 24px 80px rgba(0,0,0,.45);
      transform:translate(-50%,-46%); opacity:0; pointer-events:none;
      transition:transform .22s ease, opacity .22s ease;
    }
    body.sheet-open #sheet{transform:translate(-50%,-50%); opacity:1; pointer-events:auto}
  }
  .sheet-close{position:absolute; top:12px; right:14px; width:34px; height:34px;
    border-radius:50%; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); font-size:1rem; cursor:pointer}
  .sheet-head{display:flex; gap:16px; align-items:flex-start;
    flex:0 0 auto; padding:0 20px 14px}
  /* Drag-to-dismiss: only the bottom-sheet layout gets a grab handle. */
  .grab{display:none}
  @media (max-width:699px){
    .grab{
      display:block; width:38px; height:4px; border-radius:2px;
      background:var(--line); margin:0 auto 10px; flex:0 0 auto;
    }
    .sheet-head{touch-action:none; cursor:grab}
    #sheet.dragging{transition:none}
  }
  .sheet-body{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; padding:0 20px 28px;
    border-top:1px solid var(--line)}
  .sheet-body > .syn:first-child{margin-top:14px}
  /* The chain key has to stay put while the day list scrolls: a long film has 40+ stubs
     over several days, and the colour on a stub means nothing once the key has scrolled
     away. Negative margins span the body's 20 px padding so the sticky strip reaches
     both edges instead of leaving a gutter the stubs slide through. */
  .sheet-body > .legend{
    position:sticky; top:0; z-index:2;
    margin:0 -20px; padding:10px 20px;
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .sheet-body > .legend + .syn{margin-top:14px}
  .sheet-head .poster{flex:0 0 104px; width:104px; height:150px}
  .sheet-title{font-size:1.25rem; font-weight:800; line-height:1.2; padding-right:36px; letter-spacing:-.01em}
  .syn{margin-top:14px; line-height:1.6; font-size:.92rem; color:var(--ink)}
  .trailer{display:inline-block; margin-top:12px; color:var(--accent); font-weight:700;
    text-decoration:none; font-size:.88rem}
  .sheet-days{margin-top:6px}
  .sheet-days h3{margin:16px 0 8px; font-size:.75rem; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em; font-weight:700}

  /* Ticket stubs — the signature */
  .stubs{margin-top:12px; display:flex; flex-wrap:wrap; gap:8px}
  .stubs.grid{
    display:grid; gap:8px;
    grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
  }
  .stubs.grid .stub{flex-direction:column; align-items:stretch}
  .stubs.grid .stub .time{padding:6px 10px 2px 12px}

         actDoor:'Tickets are sold at the door · {host}',
         actReserve:'Tap a showtime to reserve seats on {host}',
         actList:'Tap a showtime to open the programme on {host}',
         actBuy:'Tap a showtime to buy tickets on {host}',
         contact:'For cinemas: enquiries and removal requests', source:'Source',
         partialOf:'{n}/{m} cinemas did not refresh', unavailable:'unavailable',
         partialCity:'Showing {n} of {m} cinemas.',
         partialMissing:'Could not load: {names}.',
         allFresh:'All {m} sources up to date', behind:'Sources behind',
         partialSources:'Some cinemas did not refresh',
         aTheme:'Switch between light and dark theme', aVenue:'Choose theatre',
         aSearch:'Filter movies by title or genre', aDays:'Choose date',
         aView:'Choose view', aLang:'Language', aClose:'Close',
         aPrevMonth:'Previous month', aNextMonth:'Next month',
         aChains:'Filter by chain' }
  };
  const LN = {
    fi:{FI:'suomi', EN:'englanti', SV:'ruotsi', ES:'espanja', DE:'saksa', FR:'ranska',
        IT:'italia', RU:'venäjä', ET:'viro', DA:'tanska', NO:'norja', IS:'islanti',
        NL:'hollanti', PL:'puola', PT:'portugali', UK:'ukraina', AR:'arabia',
        JA:'japani', ZH:'kiina', KO:'korea', HI:'hindi', TR:'turkki', KA:'georgia',
        TA:'tamili'},
    sv:{FI:'finska', EN:'engelska', SV:'svenska', ES:'spanska', DE:'tyska', FR:'franska',
        IT:'italienska', RU:'ryska', ET:'estniska', DA:'danska', NO:'norska',
        IS:'isländska', NL:'nederländska', PL:'polska', PT:'portugisiska',
        UK:'ukrainska', AR:'arabiska', JA:'japanska', ZH:'kinesiska', KO:'koreanska',
        HI:'hindi', TR:'turkiska', KA:'georgiska', TA:'tamil'},
    en:{FI:'Finnish', EN:'English', SV:'Swedish', ES:'Spanish', DE:'German', FR:'French',
        IT:'Italian', RU:'Russian', ET:'Estonian', DA:'Danish', NO:'Norwegian',
        IS:'Icelandic', NL:'Dutch', PL:'Polish', PT:'Portuguese', UK:'Ukrainian',

        TR:'Turkish', KA:'Georgian', TA:'Tamil'}

  // Keys are ISO 639-1 language codes. Swedish is SV, not SE: SE is Sweden the country,
  // and this app stored it until 2026-08-29 because Finnkino sends it.
  // A code with no entry here renders as itself, and that is how a bare "SV" sat on 644
  // showtimes unnoticed -- and then how "ES" sat on 133 more, found the same day while
  // checking the first fix. Which way to fix it depends on the code:
  //   a real language code missing from this map  -> add it here, the adapter is right
  //   something that is not a language code at all -> fix the adapter (SE was this)
  // The list covers every code in the data plus the ones the adapters' own name maps
  // can emit, so a new one means a provider started publishing a language nobody has
  // screened here before.
  // Full nominatives above, not the old abbreviated "engl."/"ruots." forms: the audio
  // language now stands on its own with no role word, so it has to read as a noun.
  const LW = { fi:{S:'tekstit'}, sv:{S:'text'}, en:{S:'subs'} };
  // "EN-A, FI-S, SE-S" reads "englanti · tekstit suomi/ruotsi": audio bare, subtitles
  // labelled, one entry per role rather than per language. The "/" matches how a single
  // multi-language code (FI-SE-S) has always rendered.
  function langTxt(code){
    if(!code) return '';
    const by = { A: [], S: [] };
    for(const c of code.split(/,\s*/)){
      const m = c.match(/^([A-Z]{2}(?:-[A-Z]{2})?)-(A|S)$/);
      if(!m) continue;
      for(const x of m[1].split('-')){
        const nm = LN[state.lang][x] || x;
        if(!by[m[2]].includes(nm)) by[m[2]].push(nm);
      }
    }
    const out = [];
    if(by.A.length) out.push(by.A.join('/'));
    if(by.S.length) out.push(LW[state.lang].S + ' ' + by.S.join('/'));
    return out.join(' · ');
  }
  // films.json is keyed by Finnkino's filmId. In a combined city view eventId is the
  // cross-chain merge key, so the id has to come from the show's own _eid — the same
  // resolution showSheet() already does. Without it English mode fell back to the
  // Finnish title for every film in every combined view.
  const filmEntry = m => {
    if(!films || !m) return null;
    const ids = [m.eventId, m._eid, ...(m.times || []).map(t => t._eid)];
    for(const id of ids) if(id && films[id]) return films[id];
    return null;
  };
  // Never translate m.title itself: that string is the key for mergeKey(), normTitle()
  // -> films-extra.json, the TMDB title cache and tmdb-aliases.json. This is display
  // only.
  const disp = m => {
    // Swedish lands here too, deliberately: no provider gives us a Swedish title yet, and
    // the Finnish distributor title is the one on the ticket and on the cinema's page.
    if(state.lang !== 'en') return m.title;
    const f = filmEntry(m);
    // Only Finnkino publishes an English title. Some others publish the original one,
    // which beats a Finnish distributor title in English mode; most publish neither,
    // so a Finnish title remains the honest fallback.
    return (f && ((f.t && f.t.en) || f.o)) || m.original || m.title;

  /* ---------- theme ---------- */
  const store = { get k(){ try{return localStorage.getItem('kino-theme')}catch(e){return null} },
                  set k(v){ try{localStorage.setItem('kino-theme',v)}catch(e){} } };
  const applyTheme = t => document.documentElement.setAttribute('data-theme', t);
  applyTheme(store.k || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next); store.k = next;

  const prefs = {
    get(){ try{ return JSON.parse(localStorage.getItem('kino-prefs')||'{}'); }catch(e){ return {}; } },
    set(p){ try{ localStorage.setItem('kino-prefs', JSON.stringify(Object.assign(prefs.get(), p))); }catch(e){} }
  };

  /* ---------- date chips ---------- */
  let fiDay = L[state.lang].days;
  let calChip = null, dayBtns = {}, venueIndex = {}, providerMeta = {};
  let allVenues = [], cityGroups = {};
  const FI_TZ = 'Europe/Helsinki';
  const fiDayFmt  = new Intl.DateTimeFormat('sv-SE', { timeZone: FI_TZ });
  const fiTimeFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: FI_TZ, hour:'2-digit', minute:'2-digit' });
  const fiDate = d => fiDayFmt.format(d);            // Date -> 'YYYY-MM-DD' in Finland

  const fiToday = () => fiDate(new Date());
  const addDays = (iso, n) => { const t = new Date(iso + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
  const dowOf = iso => new Date(iso + 'T12:00:00Z').getUTCDay();
  const dmOf  = iso => { const [,m,d] = iso.split('-'); return `${+d}.${+m}.`; };
  // The picked day is persisted as an ISO date, not as an offset from today. The offset
  // had to be clamped to the chip range on every rebuild, so once horizons ran months out
  // (Gilda into December) picking a far date and then reloading — or just toggling the
  // language, which rebuilds the row — silently landed on today+13 with an empty list and
  // nothing on screen to explain it. An old `dayIdx` pref is ignored, which falls back to
  // today.
  function savedDay(){
    const d = prefs.get().day;
    const base = fiToday();
    if(typeof d !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d) || d < base) return null;
    // state.horizon is empty until the first area file lands. Unknown is not unlimited,
    // but the saved date was inside somebody's horizon when it was picked, and a date past
    // this venue's own horizon already has its own empty state ("ohjelmistoa ei ole vielä
    // julkaistu"), which explains itself.
    if(state.horizon && d > state.horizon) return null;
    return d;
  }
  function buildDays(){
    daysEl.innerHTML = '';
    const base = fiToday();
    const saved = savedDay() || base;
    // aria-current, not aria-selected: these are buttons that pick a day, not tabs with
    // panels, and the file used to claim role="tab" while implementing none of the
    // pattern -- no aria-selected, no aria-controls, no arrow keys. `date` is the exact
    // token for "the one in this set that is current".
    const activate = el => {
      [...daysEl.children].forEach(c => { c.classList.remove('active'); c.removeAttribute('aria-current'); });
      el.classList.add('active');
      if(el !== calChip) el.setAttribute('aria-current', 'date');
    };
    dayBtns = {};
    for(let i=0;i<5;i++){
      const iso = addDays(base, i);
      const b = document.createElement('button');
      b.className = 'day'; b.type = 'button';
      const lbl = i===0 ? L[state.lang].today : (i===1 ? L[state.lang].tomorrow : fiDay[dowOf(iso)]);
      b.innerHTML = `<small>${lbl}</small><b>${dmOf(iso)}</b>`;
      b.onclick = () => { state.dateStr = iso; state.advanced = true; prefs.set({day:iso});
                          resetCalChip(); activate(b); loadSchedule(); };
      dayBtns[iso] = b;
      if(iso === saved){ b.classList.add('active'); b.setAttribute('aria-current', 'date');
                         state.dateStr = iso; }
      daysEl.appendChild(b);
    }

    // Not a tab under any reading: it opens the month picker, which is a dialog.
    const cal = document.createElement('button');
    cal.className = 'day'; cal.type = 'button';
    cal.setAttribute('aria-haspopup', 'dialog');
    cal.setAttribute('aria-expanded', 'false');
    cal.innerHTML = `<small>${L[state.lang].other}</small><b>📅</b>`;
    calChip = cal;
    cal.onclick = openCal;
    if(!dayBtns[saved]){
      state.dateStr = saved;
      cal.innerHTML = `<small>${fiDay[dowOf(saved)]}</small><b>${dmOf(saved)}</b>`;
      cal.classList.add('active');
    }
    daysEl.appendChild(cal);
  }

  /* ---------- month picker ---------- */
  // `dates` per venue is sparse (Gilda publishes 20 dates across 14 weeks), and a native
  // date input cannot disable individual days, so picking one was mostly a miss.
  const ymOf = iso => iso.slice(0, 7);
  const ymAdd = (ym, k) => {
    const [y, m] = ym.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1 + k, 1)).toISOString().slice(0, 7);
  };
  let calMonth = null;
  // The calendar chip shows the picked date while that date is the one being viewed, and
  // goes back to the 📅 face as soon as a quick chip takes over. Leaving the date on it
  // was a lie: the chip read "La 19.9." but tapping it opened the picker, because it is
  // the picker button, not a shortcut back to that date.
  function resetCalChip(){
    if(!calChip) return;
    calChip.innerHTML = `<small>${L[state.lang].other}</small><b>\u{1F4C5}</b>`;
    calChip.classList.remove('active');
  }
  function closeCal(){
    const w = document.querySelector('.cal-wrap');

  }
  function calKey(e){ if(e.key === 'Escape') closeCal(); }

    closeCal();

    calMonth = ymOf(state.dateStr > base ? state.dateStr : base);

    wrap.className = 'cal-wrap';
    wrap.innerHTML = '<div class="cal" role="dialog" aria-modal="true"></div>';
    wrap.addEventListener('click', e => { if(e.target === wrap) closeCal(); });

  }
  function drawCal(base, max){
    const el = document.querySelector('.cal');

    const avail = (Array.isArray(state.dates) && state.dates.length) ? new Set(state.dates) : null;
    const [y, m] = calMonth.split('-').map(Number);
    const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;   // Monday first
    const title = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString(
      { fi:'fi-FI', sv:'sv-FI', en:'en-GB' }[state.lang], { month:'long', year:'numeric', timeZone:'UTC' });
    const dow = [1,2,3,4,5,6,0].map(i => `<span class="cal-dow">${fiDay[i]}</span>`).join('');
    let cells = '';
    for(let i = 0; i < lead; i++) cells += '<span class="cal-day pad"></span>';
    for(let d = 1; d <= days; d++){
      const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const has = iso >= base && iso <= max && (!avail || avail.has(iso));
      const cls = 'cal-day' + (has ? ' has' : ' off') + (iso === state.dateStr ? ' sel' : '');
      cells += has ? `<button class="${cls}" data-day="${iso}">${d}</button>`
                   : `<span class="${cls}">${d}</span>`;
    }
    const prevOk = ymAdd(calMonth, -1) >= ymOf(base);
    const nextOk = ymAdd(calMonth, 1) <= ymOf(max);
    el.innerHTML = `<div class="cal-head">
        <button class="cal-nav" type="button" data-mon="-1"${prevOk ? '' : ' disabled'} aria-label="${esc(L[state.lang].aPrevMonth)}">&lsaquo;</button>
        <b>${title}</b>
        <button class="cal-nav" type="button" data-mon="1"${nextOk ? '' : ' disabled'} aria-label="${esc(L[state.lang].aNextMonth)}">&rsaquo;</button>
      </div>
      <div class="cal-grid">${dow}${cells}</div>

      if(nav && !nav.disabled){ calMonth = ymAdd(calMonth, +nav.dataset.mon); drawCal(base, max); return; }

  }

  // Each provider updates on its own schedule, so show every source's age. A scraper that
  // silently stops is otherwise invisible unless you happen to pick one of its venues.
  const STALE_H = 8;
  // The route a cinema uses to ask a question or to be taken out. The pipeline's
  // User-Agent points every provider at this site, so the site has to answer. Plain
  // text on purpose: obfuscating it against scrapers also hides it from the reader it
  // exists for, and a contact route nobody can copy is not one.
  const CONTACT = 'tiles-39nomads@icloud.com';
  // AGPL section 13 makes a network-deployed *modified* version offer its source, so
  // this is not an obligation on the original. It is here because the clause is
  // toothless without an example: a forker who never saw a source link has no idea one
  // is expected. The licence's own how-to-apply text suggests exactly this for a web
  // application.
  const SOURCE_URL = 'https://github.com/Shady-Dev/kino';
  const LICENCE = 'AGPL-3.0';
  function ageHours(iso){
    const t = iso ? new Date(iso).getTime() : NaN;
    return isNaN(t) ? null : (Date.now() - t) / 36e5;
  }
  // --- healthState: pure, extracted verbatim by tests/health_state_harness.js ---
  // Age alone was the whole test, so a provider that failed to refresh one venue read as
  // healthy for as long as the venue it kept was under STALE_H -- the summary said every
  // source was up to date while the expanded row beside it said (1/12). A partial refresh
  // is a degraded state the moment it happens, independent of how old the retained data
  // is, because it is a statement about *this run* rather than about the data's age.
  //
  // Order is by severity, and `behind` outranks `partial`: a provider that is both has
  // the worse problem, and saying so twice in one summary line would not fit anyway.
  // `partial` is kept distinct from `behind` rather than folded into it, because data two
  // hours old is not behind and calling it that is the kind of false alarm that teaches
  // people to ignore the line.
  function healthState(m, ageH){
    if(!m) return 'gone';
    if(m.gone) return 'gone';
    if(ageH === null || ageH > STALE_H) return 'behind';
    if(m.status === 'partial' || m.stale > 0 || m.unverified > 0) return 'partial';
    return 'ok';
  }
  // --- end healthState ---
  function renderHealth(){
    const el = document.querySelector('#sources');
    if(!el) return;
    const names = Object.keys(providerMeta);
    if(!names.length){ el.textContent = ''; return; }
    const state_ = {};
    const parts = names.map(p => {
      const m = providerMeta[p], h = ageHours(m.oldest || m.generated);
      const st = healthState(m, h);
      state_[p] = st;
      const nm = esc((SOURCE[p] || [p])[0]);
      // Its venue file did not load at all. Distinct from `?`, which means a file
      // arrived carrying a timestamp that could not be read.
      if(st === 'gone') return `<span class="src bad">\u26a0 ${nm} ${L[state.lang].unavailable}</span>`;
      if(h === null) return `<span class="src bad">${nm} ?</span>`;
      const cls = st === 'behind' ? 'src bad' : (st === 'partial' ? 'src part-bad' : 'src');
      const mark = st === 'behind' ? '\u26a0 ' : '';
      // Without this a chain whose age comes from one stale cinema reads as if the
      // whole chain were down. The count says how much of it is actually behind, and
      // it covers both kinds: a venue that kept older data and one that has never
      // produced a showtime.
      const n = (m.stale || 0) + (m.unverified || 0);
      const part = n
        ? ` <span class="part" title="${esc(L[state.lang].partialOf
            .replace('{n}', n).replace('{m}', m.venues))}">(${n}/${m.venues})</span>`
        : '';
      return `<span class="${cls}">${mark}${nm} ${Math.round(h)}${L[state.lang].hours}${part}</span>`;
    });
    // The key lives here rather than under the chain legend: it is reference material,
    // not something to scan past on the way to a showtime, and the word it decodes is
    // already on the card, in the times meta line and in the sheet. A second key row
    // above the list read as clutter.
    el.innerHTML = parts.join(' · ');

    // The summary names the sources that are behind rather than counting them. A count
    // makes you open the disclosure to learn anything; a name is the answer. Truncated
    // past three, because at that point the shape of the problem is "most of them" and
    // the list is one click away.
    const nameOf = p => (SOURCE[p] || [p])[0];
    const behind = names.filter(p => state_[p] === 'behind' || state_[p] === 'gone').map(nameOf);
    const partial = names.filter(p => state_[p] === 'partial').map(nameOf);
    const sum = document.querySelector('#freshSum');
    if(sum){
      const T = L[state.lang];
      const list = xs => xs.slice(0, 3).join(', ') + (xs.length > 3 ? ` +${xs.length - 3}` : '');
      if(behind.length){
        sum.textContent = `\u26a0 ${T.behind}: ${esc(list(behind))}`;
        sum.className = 'bad';
      } else if(partial.length){
        // Named separately rather than folded into `behind`. The data is not old; one of
        // this chain's cinemas did not refresh on the last run, which is a different
        // thing and deserves different words.
        sum.textContent = `\u26a0 ${T.partialSources}: ${esc(list(partial))}`;
        sum.className = 'bad';
      } else {
        sum.textContent = T.allFresh.replace('{m}', names.length);
        sum.className = '';
      }
    }
    const tk = document.querySelector('#tagkey');
    if(tk) tk.innerHTML = tagKey(state.shows || []);
  }

  // "12€" -> 12. Only Kinoset and Kino Akseli publish prices so far.
  function priceLabel(rows){
    const vals = rows.map(r => parseFloat(String(r.price || '').replace(',', '.')))
      .filter(v => !isNaN(v) && v > 0);
    if(!vals.length) return '';
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const fmt = v => (Math.round(v * 100) % 100 === 0 ? String(Math.round(v)) : v.toFixed(2));
    return lo === hi ? `${fmt(lo)}\u20ac` : `${L[state.lang].from} ${fmt(lo)}\u20ac`;
  }

  const favBtn = $('#favBtn');
  // Nothing about a bare star says "this venue opens next time", so label it until the
  // user has set one. Short label on phones, full sentence on desktop.
  function syncFav(){
    const t = L[state.lang];
    const anyFav = !!prefs.get().fav;
    const on = prefs.get().fav === state.area;
    const label = window.matchMedia('(max-width:560px)').matches ? t.favCta : t.favCtaLong;

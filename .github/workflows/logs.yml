name: Check run logs

# Fail on any committed run log that ended non-zero. The cloud half turns its own run red
# on a provider failure; the local half runs outside this repo, writes exit=1 into a log,
# pushes it and carries on, and the first symptom would be the health line going amber
# eight hours later. Both halves commit their logs, so reading them on push gives the
# local half the same signal without touching the wrapper.
on:
  push:
    paths:
      - 'run*.log'
      - 'scripts/check_runs.py'
      - '.github/workflows/logs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest push matters: this reads committed state, so cancelling an older run is
# safe.
concurrency:
  group: check-run-logs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a SHA like the other workflows: actions/checkout v7.0.1, resolved
      # 2026-08-31, on node24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Every committed run log ended exit=0
        run: python3 scripts/check_runs.py

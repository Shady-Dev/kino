name: Fetch Finnkino data

on:
  schedule:
    - cron: '0 2,6,10,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch.yml', 'scripts/fetch_data.py']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch schedule data
        env:
          FINNKINO_TOKEN: ${{ secrets.FINNKINO_SECRET }}
          TMDB_TOKEN: ${{ secrets.TMDB_SECRET_TOKEN }}
        run: |
          set +e
          python3 scripts/fetch_data.py > run.log 2>&1
          echo "exit=$?" >> run.log
          tail -5 run.log
      - name: Commit data and log
        run: |
          git config user.name kino-bot && git config user.email a@b.c
          git add data run.log && git add -A data/posters 2>/dev/null; true
          git diff --cached --quiet || git commit -m "Update schedule data"
          git push
      - name: Fail if script failed
        run: grep -q "exit=0" run.log

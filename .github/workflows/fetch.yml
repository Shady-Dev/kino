name: Fetch Finnkino data

on:
  schedule:
    - cron: '0 2,6,10,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch.yml', 'scripts/fetch_data.py']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch schedule data
        env:
          FINNKINO_TOKEN: ${{ vars.FINNKINO_TOKEN }}
          TOKEN_WORKER_URL: ${{ vars.TOKEN_WORKER_URL }}
        run: python3 scripts/fetch_data.py
      - name: Commit updated data
        run: |
          git config user.name "kino-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update schedule data"
          git push

name: probe (throwaway)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > probe-orion.txt
          import json, re, urllib.request
          UA = "kino-probe/1.0"
          def get(u):
              r = urllib.request.Request(u, headers={"user-agent": UA})
              with urllib.request.urlopen(r, timeout=30) as f:
                  return f.read().decode("utf-8", "replace"), {k.lower(): v for k, v in f.headers.items()}
          base = "https://cinemaorion.fi/wp-json/wp/v2/elokuvat"
          body, hdr = get(base + "?per_page=100")
          items = json.loads(body)
          print("items", len(items), "| x-wp-total", hdr.get("x-wp-total"), "pages", hdr.get("x-wp-totalpages"))
          def ogs(it):
              return ((it.get("yoast_head_json") or {}).get("og_image") or [])
          exts = {}
          for it in items:
              for o in ogs(it):
                  e = (o.get("url") or "").rsplit(".", 1)[-1].lower()
                  exts[e] = exts.get(e, 0) + 1
          print("og_image extensions:", exts)
          print("entries with no og_image:", sum(1 for it in items if not ogs(it)))
          for it in items:
              if it.get("slug") in ("follow-the-plants", "zejtune", "mother"):
                  c = (it.get("content") or {}).get("rendered") or ""
                  imgs = re.findall(r'<img[^>]+src=["\']([^"\']+)["\']', c)[:4]
                  print("---", it["slug"], "| content imgs:", imgs)
                  print("    og:", [ (o.get('url'), o.get('width'), o.get('height')) for o in ogs(it) ])
                  print("    acf:", json.dumps(it.get("acf"), ensure_ascii=False)[:200])
                  m = re.search(r'wp-content/uploads/[^"\']+\.(?:jpg|jpeg|png|webp)', c, re.I)
                  print("    first web-format upload in body:", m.group(0) if m else None)
          PY
          head -c 300 probe-orion.txt
          git config user.name kino-bot && git config user.email a@b.c
          git add probe-orion.txt
          git commit -m "probe: orion elokuvat media shape (throwaway)"
          for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push -q && exit 0; sleep 5; done
          echo "::error::push failed"; exit 1

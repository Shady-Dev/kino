name: Diag reachability
on:
  push:
    paths: ['.github/workflows/diag.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          echo "digital-api /sites (no auth):"
          curl -s -o /dev/null -w "%{http_code}\n" -A "$UA" "https://digital-api.finnkino.fi/WSVistaWebClient/ocapi/v1/sites"
          echo "www.finnkino.fi front page:"
          curl -s -o /dev/null -w "%{http_code}\n" -A "$UA" "https://www.finnkino.fi/"
          echo "digital-api CORS preflight headers:"
          curl -s -D - -o /dev/null -A "$UA" -H "Origin: https://shady-dev.github.io" "https://digital-api.finnkino.fi/WSVistaWebClient/ocapi/v1/sites" | grep -i "^access-control\|^HTTP" || true

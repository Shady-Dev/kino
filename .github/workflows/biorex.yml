name: Fetch cloud providers

on:
  schedule:
    - cron: '30 2,6,10,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/biorex.yml', 'scripts/providers/**']

permissions:
  contents: write

concurrency:
  group: kino-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BioRex schedule
        run: |
          set +e
          python3 scripts/providers/fetch_biorex.py > run-biorex.log 2>&1
          echo "exit=$?" >> run-biorex.log
          tail -3 run-biorex.log
      - name: Fetch Nexxo Scope sites
        run: |
          set +e
          python3 scripts/providers/fetch_nexxo.py > run-nexxo.log 2>&1
          echo "exit=$?" >> run-nexxo.log
          tail -6 run-nexxo.log
      - name: Commit data and log
        run: |
          git config user.name kino-bot && git config user.email a@b.c
          git add data run-biorex.log run-nexxo.log
          git diff --cached --quiet || git commit -m "Update cloud provider data"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push -q && break
            sleep 5
          done
      - name: Fail if a provider failed
        run: grep -q "exit=0" run-biorex.log && grep -q "exit=0" run-nexxo.log

name: Fetch cloud providers

on:
  schedule:
    - cron: '30 2,6,10,14 * * *'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: kino-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BioRex schedule
        run: |
          set +e
          python3 scripts/providers/fetch_biorex.py > run-biorex.log 2>&1
          echo "exit=$?" >> run-biorex.log
          tail -3 run-biorex.log
      - name: Fetch Nexxo Scope sites
        run: |
          set +e
          python3 scripts/providers/fetch_nexxo.py > run-nexxo.log 2>&1
          echo "exit=$?" >> run-nexxo.log
          tail -6 run-nexxo.log
      - name: Fetch eTiketti sites
        run: |
          set +e
          python3 scripts/providers/fetch_etiketti.py > run-etiketti.log 2>&1
          echo "exit=$?" >> run-etiketti.log
          tail -5 run-etiketti.log
      - name: Enrich with TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_SECRET_TOKEN }}
        run: |
          set +e
          python3 scripts/providers/enrich_tmdb.py > run-enrich.log 2>&1
          echo "exit=$?" >> run-enrich.log
          tail -3 run-enrich.log
      - name: Commit data and log
        run: |
          git config user.name kino-bot && git config user.email a@b.c
          git add data run-biorex.log run-nexxo.log run-etiketti.log run-enrich.log
          git diff --cached --quiet || git commit -m "Update cloud provider data"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash -q origin main && git push -q; then
              pushed=1; break
            fi
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::could not push after 3 attempts"; exit 1
          fi
      - name: Fail if a provider failed
        run: grep -q "exit=0" run-biorex.log && grep -q "exit=0" run-nexxo.log && grep -q "exit=0" run-etiketti.log

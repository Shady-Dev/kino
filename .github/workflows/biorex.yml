name: Fetch cloud providers

on:
  schedule:
    - cron: '30 2,6,10,14 * * *'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: kino-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build providers.json
        run: python3 scripts/build_providers.py
      # One step for every cloud provider: the module list comes from the registry, so
      # adding a provider needs no edit here. Logs stay per module (run-{module}.log) and
      # are committed on purpose: read those, not the Actions logs.
      - name: Fetch cloud providers
        run: |
          set +e
          fail=0
          for m in $(python3 scripts/providers/registry.py --cloud); do
            python3 scripts/providers/run.py "$m" > "run-$m.log" 2>&1
            code=$?
            echo "exit=$code" >> "run-$m.log"
            [ "$code" = 0 ] || fail=1
            echo "--- $m (exit=$code)"
            tail -6 "run-$m.log"
          done
          echo "$fail" > "$RUNNER_TEMP/provfail"
      - name: Enrich with TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_SECRET_TOKEN }}
        run: |
          set +e
          python3 scripts/providers/enrich_tmdb.py > run-enrich.log 2>&1
          code=$?
          echo "exit=$code" >> run-enrich.log
          echo "$code" > "$RUNNER_TEMP/enrichfail"
          tail -3 run-enrich.log
      # Mirror posters before the pages are built, so a poster fetched on this run is
      # already same-origin in the markup this run generates. Pillow is installed for the
      # downscale and nothing else; see the module docstring for why verbatim mirroring
      # is not an option.
      - name: Mirror posters
        run: |
          set +e
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 scripts/providers/mirror_posters.py > run-posters.log 2>&1
          code=$?
          echo "exit=$code" >> run-posters.log
          echo "$code" > "$RUNNER_TEMP/mirrorfail"
          tail -4 run-posters.log
      # Pages last: they are rendered from the JSON the steps above just wrote, so this
      # has to run after enrichment or the posters and ratings would be a run behind.
      # Not gated on provider failure -- a stale venue still deserves a page.
      - name: Build indexable pages
        run: |
          set +e
          python3 scripts/build_pages.py > run-pages.log 2>&1
          code=$?
          echo "exit=$code" >> run-pages.log
          echo "$code" > "$RUNNER_TEMP/pagesfail"
          tail -3 run-pages.log
      - name: Commit data and logs
        run: |
          git config user.name kino-bot && git config user.email a@b.c
          git add data run-*.log teatteri kaupunki en sitemap.xml
          git diff --cached --quiet || git commit -m "Update cloud provider data"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash -q origin main && git push -q; then
              pushed=1; break
            fi
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::could not push after 3 attempts"; exit 1
          fi
      # Data is committed first so a provider failure still publishes whatever worked.
      - name: Fail if a provider failed
        run: |
          [ "$(cat "$RUNNER_TEMP/enrichfail")" = 0 ] || { echo "::error::enrich failed"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/provfail")" = 0 ] || { echo "::error::a provider failed"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/mirrorfail")" = 0 ] || { echo "::error::poster mirror failed"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/pagesfail")" = 0 ] || { echo "::error::page build failed"; exit 1; }

name: Fetch cloud providers

on:
  schedule:
    - cron: '30 2,6,10,14 * * *'
  workflow_dispatch:
permissions:
  contents: write

# One run at a time on the data files; a queued run still runs. cancel-in-progress: true
# discarded work nothing retries: the local half publishes Kino Engel and Kino Akseli
# posters as the cinemas' own URLs and only this workflow mirrors them, so a cancelled run
# left those venues without posters until the next cron (seen 2026-08-30).
concurrency:
  group: kino-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Actions and the one pip install are pinned to exact versions: a tag can be
      # re-pointed, a SHA cannot, and this job holds a write token. actions/checkout
      # v7.0.1 and actions/cache v6.1.0, resolved 2026-08-31, both on node24. cache v6.1.0
      # still accepts path, key and restore-keys.
      #
      # ref: main rather than the default github.sha, which is resolved when the run is
      # created. A run queued behind another would otherwise generate data on top of a
      # base that has since moved, which caused the rebase conflicts this job used to
      # die on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      # Conditional GETs need the validators to survive between runs on an ephemeral
      # runner. A stale cache costs nothing: a mismatched validator gets the 200 it would
      # have got anyway.
      - name: Restore HTTP validator cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .http-cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Build providers.json
        run: python3 scripts/build_providers.py
      # One loop over every cloud provider; the module list comes from the registry, so
      # adding a provider needs no edit here. Logs are per module (run-{module}.log) and
      # committed: read those, not the Actions logs.
      - name: Fetch cloud providers
        run: |
          set +e
          fail=0
          for m in $(python3 scripts/providers/registry.py --cloud); do
            python3 scripts/providers/run.py "$m" > "run-$m.log" 2>&1
            code=$?
            echo "exit=$code" >> "run-$m.log"
            [ "$code" = 0 ] || fail=1
            echo "--- $m (exit=$code)"
            tail -6 "run-$m.log"
          done
          echo "$fail" > "$RUNNER_TEMP/provfail"
      - name: Enrich with TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_SECRET_TOKEN }}
        run: |
          set +e
          python3 scripts/providers/enrich_tmdb.py > run-enrich.log 2>&1
          code=$?
          echo "exit=$code" >> run-enrich.log
          echo "$code" > "$RUNNER_TEMP/enrichfail"
          tail -3 run-enrich.log
      # Mirror posters before the pages are built, so a poster fetched on this run is
      # same-origin in the markup this run generates. Pillow is installed for the
      # downscale only; the module docstring explains the downscale.
      - name: Mirror posters
        run: |
          set +e
          # Pinned exactly: the runner installs this fresh every run, in a job that
          # commits to this repo.
          python3 -m pip install --quiet --disable-pip-version-check pillow==12.3.0
          python3 scripts/providers/mirror_posters.py > run-posters.log 2>&1
          code=$?
          echo "exit=$code" >> run-posters.log
          echo "$code" > "$RUNNER_TEMP/mirrorfail"
          tail -4 run-posters.log
      # Pages last: they render the JSON the steps above wrote, so posters and ratings
      # would otherwise be a run behind. Not gated on provider failure; a stale venue
      # still gets a page.
      - name: Build indexable pages
        run: |
          set +e
          python3 scripts/build_pages.py > run-pages.log 2>&1
          code=$?
          echo "exit=$code" >> run-pages.log
          echo "$code" > "$RUNNER_TEMP/pagesfail"
          tail -3 run-pages.log
      - name: Commit data and logs
        run: |
          git config user.name kino-bot && git config user.email a@b.c
          git add data run-*.log teatteri kaupunki en sitemap.xml
          git diff --cached --quiet || git commit -m "Update cloud provider data"
          pushed=0
          for i in 1 2 3; do
            # A conflicted rebase leaves the tree unmerged and every later attempt dies
            # on "Pulling is not possible because you have unmerged files". Abort first.
            git rebase --abort 2>/dev/null || true
            # A plain rebase. -X theirs resolves every conflict in favour of this run's
            # snapshot, which silently overwrites newer generator or provider changes on
            # main with output from stale code. A conflict should fail the job instead.
            if git pull --rebase --autostash -q origin main && git push -q; then
              pushed=1; break
            fi
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::could not push after 3 attempts"; exit 1
          fi
      # Data is committed first so a provider failure still publishes whatever worked.
      - name: Fail if a provider failed
        run: |
          [ "$(cat "$RUNNER_TEMP/enrichfail")" = 0 ] || { echo "::error::enrich failed"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/provfail")" = 0 ] || { echo "::error::a provider failed"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/mirrorfail")" = 0 ] || { echo "::error::poster mirror failed"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/pagesfail")" = 0 ] || { echo "::error::page build failed"; exit 1; }
